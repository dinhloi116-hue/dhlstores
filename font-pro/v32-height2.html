<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Font Pro Studio V32.3</title>
<style>body{font-family:Segoe UI,Arial;padding:24px}pre{white-space:pre-wrap}.muted{color:#64748b;font-size:13px;margin-top:8px}</style>
</head>
<body>
<div id="status">Đang tải Font Pro Studio V32.3...</div>
<div class="muted" id="detail">Payload đã xác minh + đồng bộ chiều cao + thay SVG theo ký tự</div>
<script>
let stage='khởi động';
(async()=>{
  const files=['f00-0.txt','f00-1.txt','f00-2.txt','f00-3.txt','part-01.txt','part-02.txt','part-03.txt','part-04.txt','part-05.txt','part-06.txt','part-07.txt','f08-0.txt','f08-1.txt','f08-2.txt','f08-3.txt'];
  const parts=[];
  const status=document.getElementById('status'),detail=document.getElementById('detail');
  function loadTextByFrame(name,i){return new Promise((resolve,reject)=>{const frame=document.createElement('iframe');frame.style.cssText='position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px';let done=false;const timer=setTimeout(()=>{if(done)return;done=true;frame.remove();reject(new Error('Hết thời gian tải '+name));},15000);frame.onload=()=>{if(done)return;try{const doc=frame.contentDocument||frame.contentWindow.document;let txt='';if(doc&&doc.body)txt=(doc.body.innerText||doc.body.textContent||'').trim();if(!txt)throw new Error('Nội dung rỗng');done=true;clearTimeout(timer);frame.remove();resolve(txt);}catch(e){done=true;clearTimeout(timer);frame.remove();reject(new Error('Không đọc được '+name+': '+e));}};frame.onerror=()=>{if(done)return;done=true;clearTimeout(timer);frame.remove();reject(new Error('Không tải được '+name));};frame.src='./data/'+name+'?v=323-'+Date.now()+'-'+i;document.body.appendChild(frame);});}
  stage='đọc 15 mảnh dữ liệu đã xác minh';
  for(let i=0;i<files.length;i++){status.textContent='Đang tải Font Pro Studio V32.3... '+(i+1)+'/'+files.length;detail.textContent='Đang đọc '+files[i]+' — '+(i+1)+'/'+files.length;parts.push(await loadTextByFrame(files[i],i));}
  stage='kiểm tra payload';
  const payload=parts.join('');
  if(payload.length!==71252)throw new Error('Payload V32 sai độ dài: '+payload.length+' / 71252');
  if(payload.slice(0,20)!=='H4sIAAAAAAAC/+y9+3sb')throw new Error('Payload V32 sai phần đầu.');
  if(payload.slice(-20)!=='o1735rn/H1pJVHoHkAMA')throw new Error('Payload V32 sai phần cuối.');
  stage='giải mã base64';const bin=atob(payload);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  stage='giải nén gzip';if(typeof DecompressionStream!=='function')throw new Error('Chrome này không hỗ trợ DecompressionStream.');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const reader=stream.getReader();const decoder=new TextDecoder('utf-8');let html='';while(true){const chunk=await reader.read();if(chunk.done)break;html+=decoder.decode(chunk.value,{stream:true});}html+=decoder.decode();
  stage='kiểm tra HTML';const utf8Bytes=new TextEncoder().encode(html);if(html.length!==228259)throw new Error('Số ký tự HTML V32 sai: '+html.length+' / 228259');if(utf8Bytes.length!==233479)throw new Error('Số byte UTF-8 V32 sai: '+utf8Bytes.length+' / 233479');if(!html.includes('V32.0 • SONG NGỮ + CHỌN NHIỀU + FIX Đ'))throw new Error('Nội dung V32 không hợp lệ.');
  stage='gắn bộ đồng bộ chiều cao + thay SVG theo ký tự';
  html=html.replace('</body></html>','<script src="./height-sync-v322.js?v=b545a29"><\/script><script src="./svg-replace-v323.js?v=c93b96a"><\/script></body></html>');
  stage='mở ứng dụng';document.open();document.write(html);document.close();
})().catch(e=>{document.getElementById('status').innerHTML='<pre style="color:#b91c1c">Không mở được tool: '+String(e)+'\n\nBước lỗi: '+stage+'\nLoader: v323-height-svg-select</pre>';document.getElementById('detail').textContent='Bản này dùng payload đã xác minh, đồng bộ chiều cao thật và thay SVG theo ký tự đã chọn.';console.error(e);});
</script>
</body>
</html>
