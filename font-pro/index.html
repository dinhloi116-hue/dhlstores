<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Font Pro Studio</title></head>
<body style="font-family:Segoe UI,Arial;padding:24px"><div id="status">Đang tải Font Pro Studio...</div>
<script>
(async()=>{
  const r=await fetch('./payload.html?v='+Date.now(),{cache:'no-store'});
  if(!r.ok) throw new Error('Không tải được payload: HTTP '+r.status);
  const s=await r.text();
  const m=s.match(/const b="([\s\S]*?)";const a=/);
  if(!m) throw new Error('Không tìm thấy dữ liệu tool trong payload.');
  let b=m[1].replace(/[^A-Za-z0-9+/=]/g,'');
  b=b.replace(/=+$/,'');
  b += '='.repeat((4-b.length%4)%4);
  const bin=atob(b);
  const a=Uint8Array.from(bin,c=>c.charCodeAt(0));
  const ds=new DecompressionStream('gzip');
  const t=await new Response(new Blob([a]).stream().pipeThrough(ds)).text();
  document.open();document.write(t);document.close();
})().catch(e=>{document.getElementById('status').innerHTML='<pre style="white-space:pre-wrap;color:#b91c1c">Không mở được tool: '+String(e)+'</pre>';console.error(e);});
</script></body></html>
