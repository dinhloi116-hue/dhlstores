<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Font Pro Studio V32</title>
</head>
<body style="font-family:Segoe UI,Arial;padding:24px">
<div id="status">Đang tải Font Pro Studio V32...</div>
<script>
(async()=>{
  const files=['part-00.txt','part-01.txt','part-02.txt','part-03.txt','part-04.txt','part-05.txt','part-06.txt','part-07.txt','part-08.txt'];
  const pinned='3378e5c16c743fd66fc928250fad8506794823d5';
  const rawBase='https://raw.githubusercontent.com/dinhloi116-hue/dhlstores/'+pinned+'/font-pro/data/';
  const parts=[];
  async function getPart(name,i){
    const status=document.getElementById('status');
    status.textContent='Đang tải Font Pro Studio V32... '+(i+1)+'/'+files.length;
    const attempts=[
      './data/'+name+'?v=32-dual-'+Date.now(),
      rawBase+name+'?v=32-dual-'+Date.now()
    ];
    let last='';
    for(let n=0;n<attempts.length;n++){
      try{
        const r=await fetch(attempts[n],{cache:'no-store',mode:'cors'});
        if(!r.ok){last='HTTP '+r.status;continue;}
        const txt=(await r.text()).trim();
        if(!txt){last='file rỗng';continue;}
        return txt;
      }catch(e){last=String(e);}
    }
    throw new Error('Không tải được '+name+' ở cả Pages và raw GitHub. Lỗi cuối: '+last);
  }
  for(let i=0;i<files.length;i++) parts.push(await getPart(files[i],i));
  const payload=parts.join('');
  if(payload.length!==71252) throw new Error('Payload V32 sai độ dài: '+payload.length+' / 71252');
  if(payload.slice(0,20)!=='H4sIAAAAAAAC/+y9+3sb') throw new Error('Payload V32 sai phần đầu.');
  if(payload.slice(-20)!=='o1735rn/H1pJVHoHkAMA') throw new Error('Payload V32 sai phần cuối.');
  document.getElementById('status').textContent='Đang giải nén Font Pro Studio V32...';
  const bin=atob(payload);
  const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  const ds=new DecompressionStream('gzip');
  const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
  const utf8Bytes=new TextEncoder().encode(html);
  if(html.length!==228259) throw new Error('Số ký tự HTML V32 sai: '+html.length+' / 228259');
  if(utf8Bytes.length!==233479) throw new Error('Số byte UTF-8 V32 sai: '+utf8Bytes.length+' / 233479');
  const hashBuffer=await crypto.subtle.digest('SHA-256',utf8Bytes);
  const hashHex=[...new Uint8Array(hashBuffer)].map(x=>x.toString(16).padStart(2,'0')).join('');
  if(hashHex!=='1730277029ff963d849599e88ff22a8f84ee691ba235d20cd04c2245a7b997e8') throw new Error('SHA-256 V32 không khớp: '+hashHex);
  if(!html.includes('V32.0 • SONG NGỮ + CHỌN NHIỀU + FIX Đ')) throw new Error('Nội dung V32 không hợp lệ.');
  document.open();document.write(html);document.close();
})().catch(e=>{
  document.getElementById('status').innerHTML='<pre style="white-space:pre-wrap;color:#b91c1c">Không mở được tool: '+String(e)+'\n\nLoader: v32-dual-source</pre>';
  console.error(e);
});
</script>
</body>
</html>
