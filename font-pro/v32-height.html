<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Font Pro Studio V32.1</title>
<style>body{font-family:Segoe UI,Arial;padding:24px}pre{white-space:pre-wrap}.muted{color:#64748b;font-size:13px;margin-top:8px}</style>
</head>
<body>
<div id="status">Đang tải Font Pro Studio V32.1...</div>
<div class="muted" id="detail">Loader verified-slices + cân chiều cao A–Z / 0–9</div>
<script>
let stage='khởi động';
(async()=>{
  const files=[
    'f00-0.txt','f00-1.txt','f00-2.txt','f00-3.txt',
    'part-01.txt','part-02.txt','part-03.txt','part-04.txt','part-05.txt','part-06.txt','part-07.txt',
    'f08-0.txt','f08-1.txt','f08-2.txt','f08-3.txt'
  ];
  const parts=[];
  const status=document.getElementById('status');
  const detail=document.getElementById('detail');
  function loadTextByFrame(name,i){
    return new Promise((resolve,reject)=>{
      const frame=document.createElement('iframe');
      frame.style.position='fixed';frame.style.width='1px';frame.style.height='1px';frame.style.opacity='0';frame.style.pointerEvents='none';frame.style.left='-9999px';
      let done=false;
      const timer=setTimeout(()=>{if(done)return;done=true;frame.remove();reject(new Error('Hết thời gian tải '+name));},15000);
      frame.onload=()=>{
        if(done)return;
        try{
          const doc=frame.contentDocument||frame.contentWindow.document;
          let txt='';
          if(doc&&doc.body) txt=(doc.body.innerText||doc.body.textContent||'').trim();
          if(!txt) throw new Error('Nội dung rỗng');
          done=true;clearTimeout(timer);frame.remove();resolve(txt);
        }catch(e){done=true;clearTimeout(timer);frame.remove();reject(new Error('Không đọc được '+name+': '+e));}
      };
      frame.onerror=()=>{if(done)return;done=true;clearTimeout(timer);frame.remove();reject(new Error('Không tải được '+name));};
      frame.src='./data/'+name+'?v=321-height-'+Date.now()+'-'+i;
      document.body.appendChild(frame);
    });
  }
  stage='đọc 15 mảnh dữ liệu đã xác minh';
  for(let i=0;i<files.length;i++){
    status.textContent='Đang tải Font Pro Studio V32.1... '+(i+1)+'/'+files.length;
    detail.textContent='Đang đọc '+files[i]+' — '+(i+1)+'/'+files.length;
    parts.push(await loadTextByFrame(files[i],i));
  }
  stage='kiểm tra payload';
  const payload=parts.join('');
  if(payload.length!==71252) throw new Error('Payload V32 sai độ dài: '+payload.length+' / 71252');
  if(payload.slice(0,20)!=='H4sIAAAAAAAC/+y9+3sb') throw new Error('Payload V32 sai phần đầu.');
  if(payload.slice(-20)!=='o1735rn/H1pJVHoHkAMA') throw new Error('Payload V32 sai phần cuối.');
  stage='giải mã base64';
  const bin=atob(payload);
  const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  stage='giải nén gzip';
  if(typeof DecompressionStream!=='function') throw new Error('Chrome này không hỗ trợ DecompressionStream.');
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const reader=stream.getReader();
  const decoder=new TextDecoder('utf-8');
  let html='';
  while(true){const chunk=await reader.read();if(chunk.done)break;html+=decoder.decode(chunk.value,{stream:true});}
  html+=decoder.decode();
  stage='kiểm tra HTML V32';
  const utf8Bytes=new TextEncoder().encode(html);
  if(html.length!==228259) throw new Error('Số ký tự HTML V32 sai: '+html.length+' / 228259');
  if(utf8Bytes.length!==233479) throw new Error('Số byte UTF-8 V32 sai: '+utf8Bytes.length+' / 233479');
  if(!html.includes('V32.0 • SONG NGỮ + CHỌN NHIỀU + FIX Đ')) throw new Error('Nội dung V32 không hợp lệ.');
  stage='gắn bộ cân chiều cao';
  const heightPatch="(function(){\n  const HEIGHT_CHARS='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';\n  const TOL=0.005;\n\n  function byId(id){return document.getElementById(id)}\n  function fmtPct(x){return (x*100).toFixed(1)+'%'}\n  function median(arr){\n    const a=arr.slice().sort((x,y)=>x-y);\n    if(!a.length)return 0;\n    const m=Math.floor(a.length/2);\n    return a.length%2?a[m]:(a[m-1]+a[m])/2;\n  }\n\n  async function measureSvgRatio(svgText){\n    const doc=new DOMParser().parseFromString(svgText,'image/svg+xml');\n    const src=doc.documentElement;\n    if(!src || src.tagName.toLowerCase()!=='svg') return 0;\n    let vb=(src.getAttribute('viewBox')||'').trim().split(/[ ,]+/).map(Number);\n    if(vb.length!==4 || !vb.every(Number.isFinite) || vb[2]<=0 || vb[3]<=0){\n      const w=parseFloat(src.getAttribute('width'))||1000;\n      const h=parseFloat(src.getAttribute('height'))||1000;\n      vb=[0,0,w,h];\n    }\n    const clone=document.importNode(src,true);\n    clone.removeAttribute('width'); clone.removeAttribute('height');\n    clone.setAttribute('preserveAspectRatio','xMinYMin meet');\n    clone.style.cssText='position:fixed;left:-100000px;top:0;opacity:0;pointer-events:none;overflow:visible;';\n    clone.style.height='1000px';\n    clone.style.width=(1000*vb[2]/vb[3])+'px';\n    document.body.appendChild(clone);\n    await new Promise(r=>requestAnimationFrame(()=>r()));\n    const nodes=[...clone.querySelectorAll('path,rect,circle,ellipse,polygon,polyline,line,text,use')];\n    let top=Infinity,bottom=-Infinity;\n    for(const el of nodes){\n      const r=el.getBoundingClientRect();\n      if(!Number.isFinite(r.top)||!Number.isFinite(r.bottom)||r.height<=0) continue;\n      top=Math.min(top,r.top); bottom=Math.max(bottom,r.bottom);\n    }\n    clone.remove();\n    if(!Number.isFinite(top)||!Number.isFinite(bottom)||bottom<=top) return 0;\n    return (bottom-top)/1000;\n  }\n\n  async function measureBaseRatio(ch){\n    const ov=state.svgOverrides && state.svgOverrides[ch];\n    if(ov && ov.svg) return await measureSvgRatio(ov.svg);\n    if(typeof fontLoaded!=='undefined' && fontLoaded){\n      try{await document.fonts.ready}catch(e){}\n      const c=document.createElement('canvas');\n      const ctx=c.getContext('2d');\n      ctx.font='1000px LoadedFont';\n      const m=ctx.measureText(ch);\n      const h=(m.actualBoundingBoxAscent||0)+(m.actualBoundingBoxDescent||0);\n      return h>0?h/1000:0;\n    }\n    return 0;\n  }\n\n  async function collect(){\n    const rows=[];\n    for(const ch of HEIGHT_CHARS){\n      const base=await measureBaseRatio(ch);\n      if(base>0){\n        const g=gs(ch);\n        rows.push({ch,base,current:base*Math.abs(Number(g.sy)||1)});\n      }else rows.push({ch,base:0,current:0});\n    }\n    return rows;\n  }\n\n  function renderResult(rows,afterNormalize){\n    const status=byId('heightNormStatus');\n    const detail=byId('heightNormDetail');\n    if(!status)return;\n    const ok=rows.filter(r=>r.current>0);\n    const missing=rows.filter(r=>!r.current).map(r=>r.ch);\n    if(!ok.length){\n      status.className='bigStatus warn';\n      status.innerHTML='<b>Chưa đo được.</b> Hãy nạp font hoặc SVG A–Z + 0–9 trước.';\n      if(detail)detail.textContent='';\n      return;\n    }\n    const refRow=ok.find(r=>r.ch==='A');\n    const ref=refRow?refRow.current:median(ok.map(r=>r.current));\n    const min=Math.min(...ok.map(r=>r.current));\n    const max=Math.max(...ok.map(r=>r.current));\n    const spread=ref?((max-min)/ref):0;\n    const out=ok.filter(r=>Math.abs(r.current-ref)/ref>TOL).map(r=>r.ch);\n    const same=out.length===0 && missing.length===0;\n    status.className='bigStatus '+(same?'ok':'warn');\n    if(same) status.innerHTML='<b>✓ A–Z và 0–9 đã cùng chiều cao.</b> Sai lệch dưới 0,5%.';\n    else status.innerHTML='<b>Chưa đều chiều cao.</b> Độ lệch toàn dải: '+fmtPct(spread)+(out.length?' • lệch so với A: '+out.join(' '):'')+(missing.length?' • chưa đo được: '+missing.join(' '):'');\n    if(detail){\n      const sorted=ok.slice().sort((a,b)=>Math.abs(b.current-ref)-Math.abs(a.current-ref));\n      detail.textContent=(afterNormalize?'Đã cân theo chiều cao chữ A và giữ nguyên tỷ lệ hình. ':'')+'Mốc A = 100%. Lệch lớn nhất: '+sorted.slice(0,8).map(r=>r.ch+' '+fmtPct(r.current/ref)).join(' • ');\n    }\n  }\n\n  async function scan(afterNormalize=false){\n    const status=byId('heightNormStatus');\n    if(status){status.className='bigStatus warn';status.textContent='Đang đo chiều cao thực A–Z + 0–9…';}\n    try{const rows=await collect();renderResult(rows,afterNormalize);return rows;}\n    catch(e){if(status){status.className='bigStatus err';status.textContent='Lỗi đo chiều cao: '+e.message;}console.error(e);return [];}\n  }\n\n  async function normalizeHeights(){\n    const rows=await collect();\n    const ok=rows.filter(r=>r.current>0);\n    if(!ok.length){renderResult(rows,false);return;}\n    const a=ok.find(r=>r.ch==='A');\n    const target=a?a.current:median(ok.map(r=>r.current));\n    for(const r of ok){\n      const factor=target/r.current;\n      const g=gs(r.ch);\n      g.sx=(Number(g.sx)||1)*factor;\n      g.sy=(Number(g.sy)||1)*factor;\n    }\n    try{dirty()}catch(e){}\n    try{render()}catch(e){}\n    try{glyphToUI()}catch(e){}\n    await scan(true);\n  }\n\n  function install(){\n    if(byId('heightNormalizeCard'))return;\n    const side=document.querySelector('.side');\n    if(!side)return;\n    const sourceCard=side.querySelector('.card');\n    if(!sourceCard)return;\n    const card=document.createElement('div');\n    card.id='heightNormalizeCard';\n    card.className='card';\n    card.innerHTML='<div class=\"cardTitleRow\"><div><span class=\"sectionEyebrow\">SIZE CHECK</span><h3>Chiều cao A–Z + 0–9</h3></div><span class=\"stepBadge\">✓</span></div><div class=\"muted\" style=\"margin-bottom:7px\">Đo <b>chiều cao hình thực</b>, không chỉ nhìn thông số 100%. Nếu lệch, nút cân sẽ phóng/thu đều cả ngang và dọc để không méo chữ.</div><div class=\"btns\"><button id=\"heightNormScan\" class=\"btn\">KIỂM TRA CHIỀU CAO</button><button id=\"heightNormApply\" class=\"btn primary\">ĐƯA VỀ CÙNG CHIỀU CAO</button></div><div id=\"heightNormStatus\" class=\"bigStatus\" style=\"margin-top:7px\">Chưa kiểm tra A–Z + 0–9.</div><div id=\"heightNormDetail\" class=\"smallNote\" style=\"margin-top:5px\"></div>';\n    sourceCard.insertAdjacentElement('afterend',card);\n    byId('heightNormScan').onclick=()=>scan(false);\n    byId('heightNormApply').onclick=()=>normalizeHeights();\n    const pill=document.querySelector('.versionPill');\n    if(pill && !pill.textContent.includes('CÂN CHIỀU CAO')) pill.textContent='V32.1 • SONG NGỮ + CHỌN NHIỀU + FIX Đ + CÂN CHIỀU CAO';\n    const sv=document.querySelector('.sideVersion'); if(sv)sv.textContent='STUDIO V32.1';\n  }\n\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install);else install();\n  window.__HEIGHT_NORMALIZER__={scan,normalizeHeights,collect};\n})();\n";
  html=html.replace('</body></html>','<script>'+heightPatch+'<\/script></body></html>');
  stage='mở ứng dụng';
  document.open();document.write(html);document.close();
})().catch(e=>{
  document.getElementById('status').innerHTML='<pre style="color:#b91c1c">Không mở được tool: '+String(e)+'\n\nBước lỗi: '+stage+'\nLoader: v321-height-verified</pre>';
  document.getElementById('detail').textContent='Bản này dùng payload đã xác minh và thêm kiểm tra/cân chiều cao A–Z + 0–9.';
  console.error(e);
});
</script>
</body>
</html>
