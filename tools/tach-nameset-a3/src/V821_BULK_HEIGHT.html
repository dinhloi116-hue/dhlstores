<style id="dhl-v821-bulk-height-style">
#v821BulkHeightBox{background:#fff!important}
.v821-row{display:table!important;width:100%!important;table-layout:fixed!important;margin-top:6px!important}.v821-row>div{display:table-cell!important;vertical-align:bottom!important;padding-right:5px!important}.v821-row>div:last-child{padding-right:0!important}
.v821-result{margin-top:6px!important;padding:6px 7px!important;border:1px solid #d5d5d5!important;border-radius:5px!important;background:#fafafa!important;font-size:10px!important;line-height:1.4!important;color:#222!important;min-height:18px!important}
.v821-mainbtn{font-weight:800!important;min-height:32px!important}

</style>
<script id="dhl-v821-bulk-height" type="text/javascript">
(function(){
function E(id){return document.getElementById(id);}function LANG(){try{return currentLang==='en'?'en':'vi';}catch(e){return'vi';}}function r2(v){return Math.round(v*100)/100;}
function app(){if(window.external&&window.external.Application)return window.external.Application;if(typeof corelApp==='function')return corelApp();throw new Error(LANG()==='vi'?'Không kết nối được CorelDRAW.':'Cannot connect to CorelDRAW.');}
function sel(a){var sr=a.ActiveSelectionRange;if(!sr||!sr.Count)throw new Error(LANG()==='vi'?'Chưa chọn đối tượng nào.':'No objects selected.');return sr;}
function status(s,ok){var x=E('v821BulkHeightResult');if(!x)return;x.innerHTML=(ok===false?'⚠ ':'✓ ')+s;}
function readFirstSize(axis){
  var a,sr,sh,val;
  a=app();sr=sel(a);sh=sr.Item(1);
  val=axis==='w'?Math.abs(Number(sh.SizeWidth))/10:Math.abs(Number(sh.SizeHeight))/10;
  if(!(val>0))throw new Error(LANG()==='vi'?(axis==='w'?'Không đọc được chiều ngang đối tượng.':'Không đọc được chiều cao đối tượng.'):(axis==='w'?'Could not read object width.':'Could not read object height.'));
  return val;
}
function getHeight(){var inp=E('v821BulkHeightInput'),h;try{h=readFirstSize('h');inp.value=r2(h);try{localStorage.setItem('dhl_v821_height',inp.value);}catch(e){}status((LANG()==='vi'?'Đã lấy chiều cao từ đối tượng đầu: ':'Read height from first object: ')+r2(h)+' cm',true);}catch(e2){status(e2.message,false);}}
function getWidth(){var inp=E('v821BulkWidthInput'),w;try{w=readFirstSize('w');inp.value=r2(w);try{localStorage.setItem('dhl_v821_width',inp.value);}catch(e){}status((LANG()==='vi'?'Đã lấy chiều ngang từ đối tượng đầu: ':'Read width from first object: ')+r2(w)+' cm',true);}catch(e2){status(e2.message,false);}}
function setAxis(axis){
  var a,doc,sr,inp=E(axis==='w'?'v821BulkWidthInput':'v821BulkHeightInput'),cm=Number(inp.value),target,oldUnit,cmd=false,opt=false,i,sh,sw,oh,nw,nh,cx,cy,ok=0,fail=0,labelVi,labelEn;
  labelVi=axis==='w'?'chiều ngang':'chiều cao';labelEn=axis==='w'?'width':'height';
  if(!(cm>0)){status((LANG()==='vi'?(axis==='w'?'Chiều ngang':'Chiều cao'):(axis==='w'?'Width':'Height'))+(LANG()==='vi'?' phải lớn hơn 0 cm.':' must be greater than 0 cm.'),false);return;}
  try{
    if(typeof window.DHLLicenseGate==='function'){try{if(!window.DHLLicenseGate())return;}catch(g){}}
    a=app();doc=a.ActiveDocument;sr=sel(a);target=cm*10;oldUnit=doc.Unit;doc.Unit=3;
    doc.BeginCommandGroup('DHL Nameset Layout - Bulk '+(axis==='w'?'Width':'Height')+' V8.21');cmd=true;
    try{a.Optimization=true;opt=true;}catch(o){}
    for(i=1;i<=sr.Count;i++){
      try{
        sh=sr.Item(i);sw=Math.abs(Number(sh.SizeWidth));oh=Math.abs(Number(sh.SizeHeight));
        if(!(sw>0&&oh>0))throw new Error('invalid size');
        if(axis==='w'){nw=target;nh=oh*(target/sw);}else{nh=target;nw=sw*(target/oh);}
        cx=Number(sh.CenterX);cy=Number(sh.CenterY);
        sh.SetSize(nw,nh);sh.CenterX=cx;sh.CenterY=cy;ok++;
      }catch(one){fail++;}
    }
    try{if(opt)a.Optimization=false;}catch(o2){}opt=false;doc.Unit=oldUnit;doc.EndCommandGroup();cmd=false;
    try{a.ActiveWindow.Refresh();}catch(r){}
    try{localStorage.setItem(axis==='w'?'dhl_v821_width':'dhl_v821_height',String(cm));}catch(ls){}
    if(ok<1)throw new Error(LANG()==='vi'?'Không có đối tượng nào đổi kích thước được.':'No object could be resized.');
    status((LANG()==='vi'?'Đã set ':'Set ')+ok+(LANG()==='vi'?' đối tượng về '+labelVi+' ':' objects to '+labelEn+' ')+r2(cm)+' cm'+(LANG()==='vi'?'. Giữ nguyên tỷ lệ và tâm đối tượng.':'. Aspect ratio and object center preserved.')+(fail?(LANG()==='vi'?' · Bỏ qua ':' · Skipped ')+fail:''),true);
  }catch(e){
    try{if(opt)a.Optimization=false;}catch(x){}
    try{if(cmd)doc.EndCommandGroup();}catch(x2){}
    try{if(doc&&oldUnit!==undefined)doc.Unit=oldUnit;}catch(x3){}
    status(e.message,false);
  }
}
function setHeight(){setAxis('h');}
function setWidth(){setAxis('w');}
window.V821GetHeight=getHeight;window.V821SetHeight=setHeight;window.V821GetWidth=getWidth;window.V821SetWidth=setWidth;
function toggleHelp(){var x=E('v821BulkHeightHelp');if(!x)return;x.className=(' '+x.className+' ').indexOf(' open ')>=0?'v819-helptext':'v819-helptext open';}
window.V821ToggleHelp=toggleHelp;
function relabel(){
  var vi=LANG()==='vi',h=E('v821BulkHeightHead'),hlab=E('v821BulkHeightLabel'),wlab=E('v821BulkWidthLabel'),getH=E('v821GetHeightBtn'),setH=E('v821SetHeightBtn'),getW=E('v821GetWidthBtn'),setW=E('v821SetWidthBtn'),help=E('v821BulkHeightHelp'),hb=E('v821BulkHeightHelpBtn'),hs=E('v821HeightSubhead'),ws=E('v821WidthSubhead'),v=document.getElementsByClassName?document.getElementsByClassName('ver'):[],f=document.getElementsByClassName?document.getElementsByClassName('footer'):[];
  if(h){h.innerHTML='<span class="v819-icon">↕</span>'+(vi?'0. SET KÍCH THƯỚC HÀNG LOẠT':'0. BULK SIZE');if(hb)h.appendChild(hb);}
  if(hs)hs.innerHTML=vi?'THEO CHIỀU CAO':'BY HEIGHT';
  if(ws)ws.innerHTML=vi?'THEO CHIỀU NGANG':'BY WIDTH';
  if(hlab)hlab.innerHTML=vi?'Chiều cao chung (cm)':'Target height (cm)';
  if(wlab)wlab.innerHTML=vi?'Chiều ngang chung (cm)':'Target width (cm)';
  if(getH)getH.innerHTML=vi?'LẤY CAO TỪ MẪU':'READ HEIGHT';
  if(setH)setH.innerHTML=vi?'SET CHIỀU CAO':'SET HEIGHT';
  if(getW)getW.innerHTML=vi?'LẤY NGANG TỪ MẪU':'READ WIDTH';
  if(setW)setW.innerHTML=vi?'SET CHIỀU NGANG':'SET WIDTH';
  if(hb)hb.title=vi?'Giải thích':'Help';
  if(help)help.innerHTML=vi?'Chọn nhiều đối tượng trên Corel rồi chọn một trong hai cách: SET CHIỀU CAO hoặc SET CHIỀU NGANG. Tất cả đối tượng sẽ về cùng kích thước theo trục đã chọn, vẫn giữ đúng tỷ lệ rộng/cao và giữ nguyên tâm từng đối tượng.':'Select multiple Corel objects, then resize them by either HEIGHT or WIDTH. All selected objects get the same target size on that axis while preserving aspect ratio and each object center.';
  if(v&&v.length)v[0].innerHTML='v8.21';
  if(f&&f.length)f[0].innerHTML='DHL Nameset Layout · v8.21 · bulk height + width resize · VI / EN';
}
function makeRow(labelId,inputId,getId,getFn){
  var row=document.createElement('div'),left=document.createElement('div'),right=document.createElement('div'),lab=document.createElement('span'),inp=document.createElement('input'),get=document.createElement('button');
  row.className='v821-row';lab.id=labelId;lab.className='v77-mini';inp.id=inputId;inp.type='number';inp.min='0.01';inp.step='0.1';inp.value='10';get.id=getId;get.type='button';get.className='v821-mainbtn';get.onclick=getFn;
  left.appendChild(lab);left.appendChild(inp);right.appendChild(get);row.appendChild(left);row.appendChild(right);
  return {row:row,input:inp};
}
function build(){
  var card=E('v77NestCard'),anchor=E('v818PresetBox'),box,head,helpBtn,help,hsub,wsub,hrow,wrow,setH,setW,res,sh,sw;
  if(!card||!anchor){setTimeout(build,220);return;}
  if(E('v821BulkHeightBox')){relabel();return;}
  box=document.createElement('div');box.id='v821BulkHeightBox';box.className='v818-box';
  head=document.createElement('div');head.id='v821BulkHeightHead';head.className='v818-head v819-step';box.appendChild(head);
  helpBtn=document.createElement('button');helpBtn.id='v821BulkHeightHelpBtn';helpBtn.type='button';helpBtn.className='v819-helpbtn';helpBtn.innerHTML='?';helpBtn.onclick=toggleHelp;head.appendChild(helpBtn);
  help=document.createElement('div');help.id='v821BulkHeightHelp';help.className='v819-helptext';box.appendChild(help);

  hsub=document.createElement('div');hsub.id='v821HeightSubhead';hsub.className='v821-subhead';box.appendChild(hsub);
  hrow=makeRow('v821BulkHeightLabel','v821BulkHeightInput','v821GetHeightBtn',getHeight);box.appendChild(hrow.row);
  setH=document.createElement('button');setH.id='v821SetHeightBtn';setH.type='button';setH.className='v821-mainbtn';setH.style.marginTop='6px';setH.onclick=setHeight;box.appendChild(setH);

  wsub=document.createElement('div');wsub.id='v821WidthSubhead';wsub.className='v821-subhead';box.appendChild(wsub);
  wrow=makeRow('v821BulkWidthLabel','v821BulkWidthInput','v821GetWidthBtn',getWidth);box.appendChild(wrow.row);
  setW=document.createElement('button');setW.id='v821SetWidthBtn';setW.type='button';setW.className='v821-mainbtn';setW.style.marginTop='6px';setW.onclick=setWidth;box.appendChild(setW);

  res=document.createElement('div');res.id='v821BulkHeightResult';res.className='v821-result';res.innerHTML=LANG()==='vi'?'Chọn nhiều đối tượng → set chiều cao hoặc chiều ngang.':'Select objects → set height or width.';box.appendChild(res);
  card.insertBefore(box,anchor);
  try{sh=localStorage.getItem('dhl_v821_height');if(sh&&Number(sh)>0)hrow.input.value=sh;}catch(e){}
  try{sw=localStorage.getItem('dhl_v821_width');if(sw&&Number(sw)>0)wrow.input.value=sw;}catch(e2){}
  relabel();
  var old=window.setLanguage;if(old&&!old._v821){var nw=function(x){var r=old(x);setTimeout(relabel,100);return r;};nw._v821=true;window.setLanguage=nw;}
}
if(window.addEventListener)window.addEventListener('load',function(){setTimeout(build,9400);},false);else if(window.attachEvent)window.attachEvent('onload',function(){setTimeout(build,9400);});else setTimeout(build,9600);
})();
</script>
