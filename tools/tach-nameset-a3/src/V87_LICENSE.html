<style id="dhl-v87-license-style"></style>
<script id="dhl-v87-commercial-license" type="text/javascript">
(function(){
function retireLicense(){
  var bar=document.getElementById('v87LicenseBar');
  if(bar&&bar.parentNode){try{bar.parentNode.removeChild(bar);}catch(e){}}
  window.DHLLicenseGate=function(){return true;};
  window.DHLShowLicense=function(){return false;};
}
retireLicense();
if(window.addEventListener)window.addEventListener('load',function(){setTimeout(retireLicense,200);},false);
else if(window.attachEvent)window.attachEvent('onload',function(){setTimeout(retireLicense,200);});
else setTimeout(retireLicense,300);
})();
</script>
