code="param([string]$TokenFile)\r\n$ErrorActionPreference='Stop'\r\nfunction B64U([string]$s){$s=$s.Replace('-','+').Replace('_','/');switch($s.Length % 4){2{$s+='=='}3{$s+='='}};return [Convert]::FromBase64String($s)}\r\n$token=(Get-Content -LiteralPath $TokenFile -Raw).Trim()\r\n$p=$token.Split('.')\r\nif($p.Length -ne 2){exit 2}\r\n$data=B64U $p[0]\r\n$sig=B64U $p[1]\r\n$rsa=New-Object System.Security.Cryptography.RSACryptoServiceProvider\r\n$rsa.FromXmlString('"+PUB.replace(/'/g,"''")+"')\r\n$oid=[System.Security.Cryptography.CryptoConfig]::MapNameToOID('SHA256')\r\nif(-not $rsa.VerifyData($data,$oid,$sig)){exit 3}\r\n[Console]::OutputEncoding=[Text.Encoding]::UTF8\r\n[Console]::Write([Text.Encoding]::UTF8.GetString($data))\r\n";

function loadToken(){var t=regRead('LicenseToken');if(!t)try{t=localStorage.getItem('dhl_v87_license')||'';}catch(e){}return String(t||'');}

function usedKey(){return lic&&lic.i?'Used_'+String(lic.i).replace(/[^A-Za-z0-9_\-]/g,'_'):'Used';}

function validatePayload(p){if(!p||p.p!==PRODUCT)throw new Error(L()==='vi'?'Key không dành cho DHL Nameset Layout.':'Key is for another product.');if(String(p.m||'').toUpperCase()!==machine.toUpperCase()&&String(p.m||'').toUpperCase()!=='ANY')throw new Error((L()==='vi'?'Key thuộc máy khác. Mã máy này: ':'Key belongs to another machine. This machine: ')+machine);if(p.t!=='LIFE'&&p.t!=='CREDITS')throw new Error(L()==='vi'?'Loại bản quyền không hợp lệ.':'Invalid license type.');if(p.t==='CREDITS'&&!(Number(p.c)>0))throw new Error(L()==='vi'?'Số lượt trong key không hợp lệ.':'Invalid credit count.');return p;}
