<style id="dhl-v812-font-load-fix-style">
#v86LoadFonts.v812-loading{opacity:.6!important;cursor:wait!important}
</style>
<script id="dhl-v812-font-load-fix" type="text/javascript">
(function(){
function E(id){return document.getElementById(id);}function L(){try{return currentLang==='en'?'en':'vi';}catch(e){return 'vi';}}function esc(s){return String(s===undefined||s===null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
var busy=false,cache=null;
function fso(){return new ActiveXObject('Scripting.FileSystemObject');}
function sh(){return new ActiveXObject('WScript.Shell');}
function temp(name){return fso().BuildPath(sh().ExpandEnvironmentStrings('%TEMP%'),name);}
function writeUnicode(path,text){var f=fso().CreateTextFile(path,true,true);f.Write(text);f.Close();}
function readUnicode(path){var f=fso().OpenTextFile(path,1,false,-1),s=f.ReadAll();f.Close();return s;}
function readFonts(){
 var ps=temp('DHL_LIST_FONTS_V812.ps1'),out=temp('DHL_FONTS_V812.txt'),err=temp('DHL_FONTS_V812_ERR.txt'),rc,script,lines,fonts=[],seen={},i,n;
 try{if(fso().FileExists(out))fso().DeleteFile(out,true);}catch(x){}try{if(fso().FileExists(err))fso().DeleteFile(err,true);}catch(x2){}
 script="$ErrorActionPreference='Stop'\r\n"+
 "param()\r\n"+
 "try {\r\n"+
 "  Add-Type -AssemblyName System.Drawing\r\n"+
 "  $c = New-Object System.Drawing.Text.InstalledFontCollection\r\n"+
 "  $c.Families | ForEach-Object { $_.Name } | Sort-Object -Unique | Set-Content -LiteralPath '"+out.replace(/'/g,"''")+"' -Encoding Unicode\r\n"+
 "  exit 0\r\n"+
 "} catch {\r\n"+
 "  $_.Exception.ToString() | Set-Content -LiteralPath '"+err.replace(/'/g,"''")+"' -Encoding Unicode\r\n"+
 "  exit 7\r\n"+
 "}\r\n";
 writeUnicode(ps,script);
 rc=sh().Run('powershell.exe -NoProfile -ExecutionPolicy Bypass -File "'+ps+'"',0,true);
 if(rc!==0){var em='PowerShell exit '+rc;try{if(fso().FileExists(err))em=readUnicode(err);}catch(er){}throw new Error(em);}
 if(!fso().FileExists(out))throw new Error(L()==='vi'?'Không tạo được danh sách font.':'Font list file was not created.');
 lines=String(readUnicode(out)||'').split(/\r?\n/);
 for(i=0;i<lines.length;i++){n=String(lines[i]||'').replace(/^\s+|\s+$/g,'');if(n&&!seen[n.toLowerCase()]){seen[n.toLowerCase()]=1;fonts.push(n);}}
 if(!fonts.length)throw new Error(L()==='vi'?'Windows trả về 0 font.':'Windows returned 0 fonts.');
 return fonts;
}
function fill(sel,fonts,keep){var i;if(!sel)return;while(sel.options.length>1)sel.remove(1);for(i=0;i<fonts.length;i++)sel.options.add(new Option(fonts[i],fonts[i]));if(keep)sel.value=keep;}
function populate(fonts){
 var a=E('nameFont'),b=E('numberFont'),n=E('v86NameFont'),d=E('v86NoFont'),ka=a?a.value:'',kb=b?b.value:'',kn=n?n.value:'',kd=d?d.value:'';
 fill(a,fonts,ka);fill(b,fonts,kb);fill(n,fonts,kn);fill(d,fonts,kd);
}
function status(msg,ok){var s=E('v86Status');if(s){s.className='v86-note '+(ok?'ok':'bad');s.innerHTML=msg;}var s2=E('fontStatus');if(s2)s2.innerHTML=msg;}
window.loadInstalledFonts=function(force){
 var b=E('v86LoadFonts'),fonts;
 if(busy)return cache?cache.length:0;busy=true;if(b){b.disabled=true;b.className=(b.className||'')+' v812-loading';}
 try{
   status(L()==='vi'?'Đang đọc font đã cài trên Windows...':'Reading installed Windows fonts...',true);
   fonts=(cache&&!force)?cache:readFonts();cache=fonts;populate(fonts);
   status((L()==='vi'?'✓ Đã nạp ':'✓ Loaded ')+fonts.length+(L()==='vi'?' font. Bây giờ hãy chọn Font tên và Font số.':' fonts. Now choose Name and Number fonts.'),true);
   return fonts.length;
 }catch(e){status((L()==='vi'?'Không nạp được font: ':'Could not load fonts: ')+esc(e.message),false);return 0;}
 finally{busy=false;if(b){b.disabled=false;b.className=(b.className||'').replace(/\s*v812-loading\b/g,'');}}
};
function hook(){var b=E('v86LoadFonts'),v=document.getElementsByClassName?document.getElementsByClassName('ver'):[],f=document.getElementsByClassName?document.getElementsByClassName('footer'):[];if(!b){setTimeout(hook,180);return;}b.onclick=function(){window.loadInstalledFonts(true);return false;};if(v&&v.length)v[0].innerHTML='v8.12';if(f&&f.length)f[0].innerHTML='DHL Nameset Layout · v8.12 · reliable font loader · VI / EN';}
if(window.addEventListener)window.addEventListener('load',function(){setTimeout(hook,4300);},false);else if(window.attachEvent)window.attachEvent('onload',function(){setTimeout(hook,4300);});else setTimeout(hook,4500);
})();
</script>
