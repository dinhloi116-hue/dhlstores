<script id="dhl-v810-workflow-order" type="text/javascript">
(function(){
function E(id){return document.getElementById(id);}function L(){try{return currentLang==='en'?'en':'vi';}catch(e){return 'vi';}}function txt(x){return String(x===undefined||x===null?'':x).replace(/^\s+|\s+$/g,'');}

function setStep4Disabled(v){var q=document.getElementsByClassName?document.getElementsByClassName('quickbar')[0]:null,bs,i,pb=document.getElementsByClassName?document.getElementsByClassName('pagebox')[0]:null,tr=document.getElementsByClassName?document.getElementsByClassName('toolsrow')[0]:null;if(q){q.className='quickbar'+(v?' v810-locked':'');bs=q.getElementsByTagName('button');for(i=0;i<bs.length;i++)disable(bs[i],v);}disable(E('sheetWidth'),v);disable(E('sheetHeight'),v);disable(E('sheetGap'),v);disable(E('excelMirror'),v);if(pb){pb.className='pagebox'+(v?' v810-locked':'');bs=pb.getElementsByTagName('button');for(i=0;i<bs.length;i++)disable(bs[i],v);}if(tr){tr.className='toolsrow'+(v?' v810-locked':'');bs=tr.getElementsByTagName('button');for(i=0;i<bs.length;i++)disable(bs[i],v);}}

function mkStep(id,title,extraClass){var d=document.createElement('div');d.className='v810-step '+(extraClass||'');d.innerHTML='<div class="v810-step-title" id="'+id+'Title">'+title+'</div><div id="'+id+'" class="v810-step-state lock"></div>';return d;}
function findLabelFor(id){var ls=document.getElementsByTagName('label'),i;for(i=0;i<ls.length;i++){if(String(ls[i].htmlFor||ls[i].getAttribute('for')||'')===id)return ls[i];}return null;}
function findPrevElement(el){var x=el?el.previousSibling:null;while(x&&x.nodeType!==1)x=x.previousSibling;return x;}
function build(){var body=E('excelBody'),file=E('excelFile'),preview=E('v84ExcelPreview'),box=E('v86ExcelBox'),make=E('v86MakeGroups'),run=E('excelRun'),hint=E('columnHint'),fileLabel=findLabelFor('excelFile'),q=document.getElementsByClassName?document.getElementsByClassName('quickbar')[0]:null,anchor,guide,s1,s3,s4,s5;if(!body||!file||!preview||!box||!make||!run||!q)return false;if(E('v810Guide'))return true;

 return true;}
function relabel(){var vi=L()==='vi',v=document.getElementsByClassName?document.getElementsByClassName('ver'):[],f=document.getElementsByClassName?document.getElementsByClassName('footer'):[];if(E('v810Guide'))E('v810Guide').innerHTML=vi?'<b>LÀM THEO THỨ TỰ TỪ TRÊN XUỐNG.</b> Bước sau chỉ mở khi bước trước đã hoàn tất.':'<b>FOLLOW THE STEPS TOP TO BOTTOM.</b> A later step unlocks only after the previous one is complete.';if(E('v810S1Title'))E('v810S1Title').innerHTML=vi?'BƯỚC 1 — CHỌN & KIỂM TRA FILE EXCEL':'STEP 1 — CHOOSE & VALIDATE EXCEL';if(E('v810S2Title'))E('v810S2Title').innerHTML=vi?'BƯỚC 2 — CHỌN FONT & KÍCH THƯỚC':'STEP 2 — CHOOSE FONTS & SIZES';if(E('v810S3Title'))E('v810S3Title').innerHTML=vi?'BƯỚC 3 — TẠO GROUP TÊN + SỐ':'STEP 3 — CREATE NAME + NUMBER GROUPS';if(E('v810S4Title'))E('v810S4Title').innerHTML=vi?'BƯỚC 4 — CHỌN KHỔ & SET TRANG IN':'STEP 4 — CHOOSE SIZE & SET PRINT PAGE';if(E('v810S5Title'))E('v810S5Title').innerHTML=vi?'BƯỚC 5 — DÀN CÁC GROUP VÀO TRANG':'STEP 5 — LAYOUT GROUPS ON PAGE';if(v&&v.length)v[0].innerHTML='v8.10';if(f&&f.length)f[0].innerHTML='DHL Nameset Layout · v8.10 · ordered workflow · VI / EN';refresh();}
function chainChange(el,fn){if(!el)return;var old=el.onchange;el.onchange=function(e){var r;if(old)r=old.call(el,e);fn();return r;};}

 if(typeof oldSet==='function'&&!oldSet._v810){var sw=function(){var r=oldSet.apply(window,arguments);setTimeout(function(){var p=E('pageResult');if(p&&String(p.innerHTML||'').indexOf('✓')>=0)pageSig=sizeSig();else pageSig='';refresh();},40);return r;};sw._v810=true;window.setCurrentPrintPage=sw;}

}
function finish(){if(!build()){setTimeout(finish,200);return;}hookActions();relabel();var old=window.setLanguage;if(old&&!old._v810){var w=function(x){var r=old(x);setTimeout(function(){relabel();},70);return r;};w._v810=true;window.setLanguage=w;}setInterval(refresh,900);}
if(window.addEventListener)window.addEventListener('load',function(){setTimeout(finish,3500);},false);else if(window.attachEvent)window.attachEvent('onload',function(){setTimeout(finish,3500);});else setTimeout(finish,3700);
})();
