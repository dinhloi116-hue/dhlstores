<style id="dhl-v851-nameset-style">
/* ES5 / CorelDRAW MSHTML. Old tools stay in DOM; phase-one UI is compact. */
#v82PanelNameset > *{display:none!important}
#v82PanelNameset > #v851PairPanel{display:block!important}
#v82PanelNameset.v851-expanded > *{display:block!important}
#v851PairPanel{padding:10px!important;border:1px solid #cbd8e9!important;background:#fff!important;border-radius:8px!important;margin:9px 0!important;color:#17324f!important}
#v851PairPanel .v851-title{font-size:13px!important;font-weight:800!important;color:#113b6c!important;margin-bottom:6px!important}
#v851PairPanel .v851-note{font-size:10px!important;color:#4d657b!important;line-height:1.4!important;margin-bottom:9px!important}
#v851PairPanel .v851-label{display:block!important;font-weight:700!important;font-size:10px!important;color:#294762!important;margin:6px 0 4px!important}
#v851PairPanel select,#v851PairPanel input[type=number]{box-sizing:border-box!important;width:100%!important;min-height:34px!important;border:1px solid #b3c4d8!important;border-radius:5px!important;padding:5px!important;background:#fff!important;color:#17324f!important;font-size:11px!important}
#v851PairPanel .v851-grid{display:table!important;width:100%!important;table-layout:fixed!important;border-spacing:4px 0!important}
#v851PairPanel .v851-grid>div{display:table-cell!important;vertical-align:bottom!important}
#v851PairPanel button{box-sizing:border-box!important;font-size:11px!important;border-radius:5px!important;min-height:37px!important;padding:5px 3px!important;font-weight:700!important}
#v851PairPanel #v851Inspect{background:#edf4fc!important;border:1px solid #aac6e3!important;color:#1a4d84!important;width:100%!important}
#v851PairPanel #v851Align{background:#176bd1!important;border:1px solid #1254a8!important;color:#fff!important;width:100%!important}
#v851PairPanel button:disabled{opacity:.5!important}
#v851PairPanel #v851PairReport{padding:9px!important;background:#f4f8fc!important;border:1px solid #d1dfed!important;border-radius:5px!important;margin:9px 0!important;font-size:10px!important;line-height:1.5!important;word-wrap:break-word!important}
#v851PairPanel #v851PairReport.v851-error{border-color:#dfabaa!important;color:#941c1c!important}
#v851PairPanel #v851PairReport.v851-good{border-color:#a7d3b5!important;color:#185c3b!important}
#v851PairPanel #v851More{display:block!important;width:100%!important;min-height:29px!important;background:#fff!important;border:1px solid #d2deeb!important;color:#4d6782!important;font-size:10px!important;margin-top:8px!important}
</style>
<script id="dhl-v851-safe-nameset" type="text/javascript">
(function(){
 var previous=null,preview=null,ready=false;
 function E(k){return document.getElementById(k);}
 function T(v,e){try{return currentLang==='en'?e:v;}catch(x){return v;}}
 function val(n){return Number(n);}
 function isnum(x){return isFinite(val(x));}
 function mm(n){return Math.round(val(n)*100)/100;}
 function text(s){try{return String(s.Text.Story.Text).replace(/^\s+|\s+$/g,'');}catch(e){return '';}}
 function type(s){try{if(s.Shapes&&Number(s.Shapes.Count)>0)return 'group';}catch(e){}
  try{if(s.Text&&s.Text.Story)return 'text';}catch(e){}return 'curve';}
 function geometry(s){
  var x=val(s.CenterX),y=val(s.CenterY),w=Math.abs(val(s.SizeWidth)),h=Math.abs(val(s.SizeHeight));
  if(!isnum(x)||!isnum(y)||!(w>0&&h>0))throw new Error(T('Đối tượng không có kích thước/tâm hợp lệ.','An object has invalid size/center.'));
  return{shape:s,x:x,y:y,w:w,h:h,bottom:y-h/2,top:y+h/2};
 }
 function arr(range){var a=[],i;if(!range||!isnum(range.Count))return a;for(i=1;i<=range.Count;i++)a.push(range.Item(i));return a;}
 function app(){var a=window.external&&window.external.Application;if(!a)throw new Error(T('Không kết nối được CorelDRAW.','CorelDRAW connection unavailable.'));return a;}
 function collection(sh){try{return arr(sh.Shapes);}catch(e){return []}}
 function label(g){var txt=text(g.shape);if(txt)return txt.slice(0,26);return T('[đường cong]','[curve]');}
 function textRole(g){var s=text(g.shape).replace(/\s/g,'');if(!s)return '';return /^[0-9]{1,3}$/.test(s)?'number':'name';}
 function verticallyPlausible(n,d){
  var dy=n.y-d.y,reach=Math.max(n.h,d.h);
  // Name above number; allow overlapping bounding boxes but never reversed.
  return dy>0.03&&n.top>d.top+0.03&&Math.abs(n.x-d.x)<=Math.max(n.w,d.w)*1.5+15&&dy<=reach*10+400;
 }
 function buildTwo(shapes){
  var a=geometry(shapes[0]),b=geometry(shapes[1]),ra=textRole(a),rb=textRole(b),why='';
  if(ra==='number'&&rb==='name')return{n:b,d:a,why:'text'};
  if(rb==='number'&&ra==='name')return{n:a,d:b,why:'text'};
  if((ra||rb)&&ra===rb)throw new Error(T('Không nhận được một TÊN và một SỐ rõ ràng.','Unable to identify exactly one name and one number.'));
  if(ra||rb)throw new Error(T('Một đối tượng là Text, đối tượng còn lại không rõ tên/số. Hãy tách thành cặp Text hoặc tạo Group riêng.','One object is Text and the other is unclassified. Select an unambiguous pair.'));
  // Two outlined curves only: accept clear vertical geometry, NOT arbitrary size halves.
  if(verticallyPlausible(a,b))return{n:a,d:b,why:'curves'};
  if(verticallyPlausible(b,a))return{n:b,d:a,why:'curves'};
  throw new Error(T('Hai Curves không thể phân biệt tên/số theo vị trí. Đặt tên phía trên số hoặc chọn Group rõ ràng.','Two curves cannot be classified reliably by vertical position.'));
 }
 function buildGroup(sh){
  var kids=collection(sh),names=[],nums=[],i,g,r,p,art=[];
  if(kids.length<2)throw new Error(T('Group cần có tên và số là hai đối tượng có thể chọn riêng.','Group needs a separately selectable name and number.'));
  for(i=0;i<kids.length;i++){
   if(type(kids[i])==='group'){art.push(kids[i]);continue;}
   g=geometry(kids[i]);r=textRole(g);
   if(r==='name')names.push(g);
   else if(r==='number')nums.push(g);
   else art.push(kids[i]);
  }
  if(names.length===1&&nums.length===1){p={n:names[0],d:nums[0],why:'group-text',parent:sh};return p;}
  if(kids.length===2){
   p=buildTwo(kids);p.parent=sh;return p;
  }
  throw new Error(T('Group có nhiều chi tiết hoặc logo chưa thể xác định đúng tên/số. Chọn riêng đúng 2 đối tượng hoặc Group tên và số rõ ràng.','Complex Group: name/number ambiguous. Select only the two targets or make an unambiguous Group.'));
 }
 function buildMany(objects){
  var names=[],nums=[],i,g,r,options=[],usedN={},usedD={},pairs=[],chosen={},j,o,score,second,nIdx,dIdx;
  for(i=0;i<objects.length;i++){
   if(type(objects[i])==='group')throw new Error(T('Đang trộn Group với đối tượng rời. Hãy chọn một chế độ và chọn lại.','Mixed Groups and loose shapes are not supported in automatic pairing.'));
   g=geometry(objects[i]);r=textRole(g);
   if(r==='name')names.push(g);else if(r==='number')nums.push(g);
   else throw new Error(T('Có Curves chưa xác định tên/số. Hãy chọn từng cặp hoặc Group riêng trước.','Unclassified curves found. Select one pair at a time or Group them first.'));
  }
  if(!names.length||names.length!==nums.length)throw new Error(T('Số lượng Text tên và Text số không bằng nhau.','Name and number Text counts differ.'));
  for(i=0;i<names.length;i++){
   for(j=0;j<nums.length;j++){
    if(!verticallyPlausible(names[i],nums[j]))continue;
    score=Math.abs(names[i].x-nums[j].x)+0.18*Math.abs(names[i].bottom-nums[j].top);
    options.push({i:i,j:j,score:score});
   }
  }
  options.sort(function(a,b){return a.score-b.score;});
  for(i=0;i<options.length;i++){
   o=options[i];if(usedN[o.i]||usedD[o.j])continue;
   // If another possible mate has almost the same score, never silently guess.
   for(j=i+1;j<options.length;j++){
    var alt=options[j];
    if(alt.score-o.score>Math.max(5,o.score*.15))break;
    if(!usedN[alt.i]&&!usedD[alt.j]&&(alt.i===o.i||alt.j===o.j))
     throw new Error(T('Có tên/số gần nhau gây nhầm cặp. Hãy Group mỗi bộ trước.','Ambiguous nearest pair. Group each set before proceeding.'));
   }
   usedN[o.i]=true;usedD[o.j]=true;
   pairs.push({n:names[o.i],d:nums[o.j],why:'text'});
  }
  if(pairs.length!==names.length)throw new Error(T('Không thể ghép đầy đủ các cặp, chưa thay đổi gì.','Not all pairs matched; no changes made.'));
  return pairs;
 }
 function detect(objects,mode){
  var out=[],i;
  if(!objects.length)throw new Error(T('Hãy chọn đối tượng tên/số trên CorelDRAW.','Select name/number artwork in CorelDRAW.'));
  if(mode==='group'){
   for(i=0;i<objects.length;i++){
    if(type(objects[i])!=='group')throw new Error(T('Chế độ Group chỉ nhận Group nguyên vẹn.','Group mode requires actual Groups.'));
    out.push(buildGroup(objects[i]));
   }
  }else if(objects.length===2&&type(objects[0])!=='group'&&type(objects[1])!=='group')out=[buildTwo(objects)];
  else out=buildMany(objects);
  for(i=0;i<out.length;i++)if(out[i].n.shape===out[i].d.shape)throw new Error(T('Một đối tượng bị nhận thành cả tên và số.','One object was identified as both name and number.'));
  return out;
 }
 function status(s,error){var x=E('v851PairReport');if(!x)return;x.innerHTML=s;x.className=error===false?'v851-good':error===true?'v851-error':'';}
 function escaped(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
 function selectionFingerprint(pairs,gap,mode){
  var s=mode+'|'+gap+'|'+pairs.length,i,n,d;
  for(i=0;i<pairs.length;i++){
   n=pairs[i].n;d=pairs[i].d;
   s+='|'+label(n)+','+label(d)+','+[n.x,n.y,n.w,n.h,d.x,d.y,d.w,d.h].join(',');
  }
  return s;
 }
 function sameDoc(a,b){
  if(a===b)return true;
  try{
   var ax=String(a.FullFileName||''),bx=String(b.FullFileName||'');
   if(ax&&bx)return ax===bx;
  }catch(e){}
  try{
   var an=String(a.Name||''),bn=String(b.Name||'');
   if(an&&bn)return an===bn;
  }catch(e2){}
  return false;
 }
 function readPlan(){
  var a=app(),doc=a.ActiveDocument,old,sel,pairs,gap=val(E('v851Gap').value),mode=E('v851Mode').value,i,fp;
  if(!doc)throw new Error(T('Chưa mở tài liệu Corel.','No CorelDRAW document.'));
  if(!isnum(gap)||gap<0||gap>1000)throw new Error(T('Khoảng cách phải từ 0–1000 mm.','Gap must be 0–1000 mm.'));
  old=doc.Unit;
  try{
   doc.Unit=3;
   sel=arr(a.ActiveSelectionRange);pairs=detect(sel,mode);
   fp=selectionFingerprint(pairs,gap,mode);
   return{pairs:pairs,signature:fp,gap:gap,mode:mode,doc:doc};
  }finally{doc.Unit=old;}
 }
 function describe(plan){
  var names=[],i,p,curve=0;
  for(i=0;i<plan.pairs.length;i++){
   p=plan.pairs[i];if(p.why==='curves')curve++;
   if(i<7)names.push(escaped(label(p.n))+' → '+escaped(label(p.d)));
  }
  return '<b>'+T('✓ Nhận diện ','✓ Detected ')+plan.pairs.length+T(' cặp',' pairs')+'</b> · '+mm(plan.gap)+' mm'
    +(curve?'<div>'+T('Có ','Includes ')+curve+T(' cặp Curves nhận diện theo vị trí trên/dưới.',' vertically classified curve pair(s).')+'</div>':'')
    +'<div style="margin-top:5px">'+names.join(' | ')+(plan.pairs.length>7?' …':'')+'</div>'
    +'<div style="margin-top:5px">'+T('Chưa thay đổi đối tượng. Kiểm tra cặp, sau đó nhấn CĂN CHỈNH.','No artwork changed. Verify the pairs, then press ALIGN.')+'</div>';
 }
 function inspect(){
  preview=null;if(E('v851Align'))E('v851Align').disabled=true;
  try{
   var p=readPlan();preview={signature:p.signature,doc:p.doc};
   status(describe(p),false);if(E('v851Align'))E('v851Align').disabled=false;
   return p;
  }catch(e){status('⚠ '+escaped(e.message||e),true);return null;}
 }
 function align(){
  var p=null,doc=null,old,started=false,changed=0,i,n,d,move,now;
  try{
   if(!preview)throw new Error(T('Nhấn KIỂM TRA CẶP trước khi căn chỉnh.','Inspect the pairs before alignment.'));
   p=readPlan();
   if(!sameDoc(p.doc,preview.doc)||p.signature!==preview.signature)
    throw new Error(T('Vùng chọn đã thay đổi. Hãy KIỂM TRA CẶP lại.','Selection changed. Inspect again.'));
   doc=p.doc;old=doc.Unit;doc.Unit=3;
   try{
    doc.BeginCommandGroup('DHL Nameset V8.51 - safe align');started=true;
    for(i=0;i<p.pairs.length;i++){
     n=p.pairs[i].n;d=p.pairs[i].d;
     // Anchor the number. Move only the name; logos in the number stay put.
     now=geometry(d.shape);move=geometry(n.shape);
     n.shape.CenterX=now.x;
     n.shape.CenterY=now.top+p.gap+move.h/2;
     changed++;
    }
    doc.EndCommandGroup();started=false;
   }catch(e){
    if(started){try{doc.EndCommandGroup();}catch(x){}
     try{doc.Undo();}catch(u){throw new Error(T('Lỗi và không hoàn tác được: ','Error and rollback failed: ')+String(u.message||u));}}
    throw e;
   }finally{doc.Unit=old;}
   try{app().ActiveWindow.Refresh();}catch(x){}
   preview=null;if(E('v851Align'))E('v851Align').disabled=true;
   status(T('✓ Đã căn ','✓ Aligned ')+changed+T(' cặp. Tên và số cùng tâm, cách chính xác ',' pairs. Name centered, exact gap ')+mm(p.gap)+' mm. '+T('Không đổi font hoặc kích thước. Ctrl+Z để hoàn tác.','Fonts/sizes unchanged. Ctrl+Z to undo.'),false);
   return true;
  }catch(e){preview=null;if(E('v851Align'))E('v851Align').disabled=true;status('⚠ '+escaped(e.message||e),true);return false;}
 }
 function oldControls(){
  // Preserve all original capabilities for later phases, without mixing them
  // into the new recognition/alignment workflow.
  var p=E('v82PanelNameset'),more=E('v851More');
  if(!p||!more)return;
  var expanded=(' '+p.className+' ').indexOf(' v851-expanded ')>=0;
  if(expanded)p.className=p.className.replace(/\s*v851-expanded\b/g,'');
  else p.className+=' v851-expanded';
  more.innerHTML=expanded?T('CÔNG CỤ CŨ: FONT / A3 / LOGO ▾','LEGACY TOOLS ▾'):T('ẨN CÔNG CỤ CŨ ▴','HIDE LEGACY TOOLS ▴');
 }
 function sourceSync(){
  var mode=E('mode'),gap=E('nameNumberGap');
  if(mode&&E('v851Mode'))E('v851Mode').value=mode.value==='group'?'group':'auto';
  if(gap&&E('v851Gap'))E('v851Gap').value=gap.value;
 }
 function change(){
  preview=null;if(E('v851Align'))E('v851Align').disabled=true;
  if(E('mode'))E('mode').value=E('v851Mode').value;
  if(E('nameNumberGap'))E('nameNumberGap').value=E('v851Gap').value;
  try{if(typeof saveSettings==='function')saveSettings(false);}catch(e){}
  status(T('Chọn KIỂM TRA CẶP để nhận diện vùng chọn, không thay đổi bản in.','Inspect selected artwork before making changes.'),null);
 }
 function build(){
  var box,p=E('v82PanelNameset');
  if(!p||!E('mode')||!E('nameNumberGap'))return false;
  if(ready)return true;
  box=document.createElement('div');box.id='v851PairPanel';box.innerHTML=
    '<div id="v851Title" class="v851-title"></div><div id="v851Intro" class="v851-note"></div>'
   +'<div class="v851-grid"><div><label id="v851ModeLabel" class="v851-label"></label><select id="v851Mode"><option value="auto"></option><option value="group"></option></select></div>'
   +'<div><label id="v851GapLabel" class="v851-label"></label><input id="v851Gap" type="number" value="30" min="0" max="1000" step="1"/></div></div>'
   +'<div class="v851-grid" style="margin-top:9px"><div><button type="button" id="v851Inspect"></button></div><div><button type="button" id="v851Align" disabled="disabled"></button></div></div>'
   +'<div id="v851PairReport"></div><button id="v851More" type="button"></button>';
  p.insertBefore(box,p.firstChild);
  E('v851Inspect').onclick=inspect;E('v851Align').onclick=align;
  E('v851Mode').onchange=E('v851Gap').onchange=change;E('v851More').onclick=oldControls;
  sourceSync();relabel();change();
  ready=true;
  return true;
 }
 function relabel(){
  var x;
  if(!ready&&!E('v851PairPanel'))return;
  var vi;
  x=E('v851Title');if(x)x.innerHTML=T('NAMESET · NHẬN DIỆN & CĂN CHỈNH','NAMESET · DETECT & ALIGN');
  x=E('v851Intro');if(x)x.innerHTML=T('Chọn tên và số trong Corel, kiểm tra cặp trước khi căn. Không tự Convert, không tách Group.','Select artwork in Corel, inspect pairs before alignment. No conversion or ungrouping.');
  x=E('v851ModeLabel');if(x)x.innerHTML=T('Cách nhận diện','Recognition');
  x=E('v851GapLabel');if(x)x.innerHTML=T('Cách tên → số (mm)','Name → number gap (mm)');
  x=E('v851Mode');if(x&&x.options&&x.options.length>1){x.options[0].text=T('Tự nhận diện','Automatic');x.options[1].text=T('Theo Group','By Group');}
  x=E('v851Inspect');if(x)x.innerHTML=T('1. KIỂM TRA CẶP','1. INSPECT');
  x=E('v851Align');if(x)x.innerHTML=T('2. CĂN CHỈNH','2. ALIGN');
  x=E('v851More');if(x)x.innerHTML=T('CÔNG CỤ CŨ: FONT / A3 / LOGO ▾','LEGACY TOOLS ▾');
 }
 function boot(){
  var n=0;function retry(){if(build()||n++>65)return;setTimeout(retry,250);}retry();
 }
 window.DHLNamesetSafe={inspect:inspect,align:align,detect:detect,build:build,version:'8.51'};
 if(window.addEventListener)window.addEventListener('load',function(){setTimeout(boot,1400);},false);
 else if(window.attachEvent)window.attachEvent('onload',function(){setTimeout(boot,1400);});
 else setTimeout(boot,1500);
})();
</script>
