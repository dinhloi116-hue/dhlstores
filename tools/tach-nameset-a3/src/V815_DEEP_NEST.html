function intersects(a,b){return !(b.x>=a.x+a.w-.001||b.x+b.w<=a.x+.001||b.y>=a.y+a.h-.001||b.y+b.h<=a.y+.001);}function contained(a,b){return a.x>=b.x-.001&&a.y>=b.y-.001&&a.x+a.w<=b.x+b.w+.001&&a.y+a.h<=b.y+b.h+.001;}

function order(items,kind,seed,custom){var a=items.slice(0),rnd,i,j,t;if(kind==='original')return a;if(kind==='reverse'){a.reverse();return a;}if(kind==='custom'&&custom){a.sort(function(x,y){var ax=custom[x.id],ay=custom[y.id];if(ax===undefined)ax=999999+x.id;if(ay===undefined)ay=999999+y.id;return ax-ay;});return a;}if(kind==='area')a.sort(function(x,y){return y.area-x.area;});else if(kind==='max')a.sort(function(x,y){return Math.max(y.w,y.h)-Math.max(x.w,x.h);});else if(kind==='min')a.sort(function(x,y){return Math.min(y.w,y.h)-Math.min(x.w,x.h);});else if(kind==='height')a.sort(function(x,y){return y.h-x.h;});else if(kind==='width')a.sort(function(x,y){return y.w-x.w;});else if(kind==='perimeter')a.sort(function(x,y){return (y.w+y.h)-(x.w+x.h);});else if(kind==='ratio')a.sort(function(x,y){return Math.max(y.w/y.h,y.h/y.w)-Math.max(x.w/x.h,x.h/x.w);});else if(kind==='jitterArea'){rnd=rng(seed||1);for(i=0;i<a.length;i++)a[i]._v815k=-a[i].area*(.82+rnd()*.36);a.sort(function(x,y){return x._v815k-y._v815k;});}else if(kind==='jitterMax'){rnd=rng(seed||1);for(i=0;i<a.length;i++)a[i]._v815k=-Math.max(a[i].w,a[i].h)*(.82+rnd()*.36);a.sort(function(x,y){return x._v815k-y._v815k;});}else if(kind==='shuffle'){rnd=rng(seed||1);for(i=a.length-1;i>0;i--){j=Math.floor(rnd()*(i+1));t=a[i];a[i]=a[j];a[j]=t;}}return a;}
