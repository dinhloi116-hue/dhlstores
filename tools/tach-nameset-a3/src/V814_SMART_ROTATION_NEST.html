<script id="dhl-v814-smart-rotation-nest" type="text/javascript">
(function(){
function E(id){return document.getElementById(id);}function LANG(){try{return currentLang==='en'?'en':'vi';}catch(e){return 'vi';}}function N(id,d){var x=E(id),v=x?Number(x.value):d;return isFinite(v)?v:d;}function esc(s){return String(s===undefined||s===null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}function r2(v){return Math.round(v*100)/100;}
var previousNest=null;
function mode(){try{return localStorage.getItem('dhl_v80_mode')||'compact';}catch(e){return 'compact';}}
function selection(a){var sr=a.ActiveSelectionRange,out=[],i;for(i=1;i<=sr.Count;i++)out.push(sr.Item(i));return out;}
function measureAt(shape,ang){var d=null,w,h;if(ang===0)return{w:Math.abs(Number(shape.SizeWidth)),h:Math.abs(Number(shape.SizeHeight)),ang:0};try{d=shape.Duplicate();d.Rotate(ang);w=Math.abs(Number(d.SizeWidth));h=Math.abs(Number(d.SizeHeight));d.Delete();return{w:w,h:h,ang:ang};}catch(e){try{if(d)d.Delete();}catch(x){}var rad=ang*Math.PI/180,c=Math.abs(Math.cos(rad)),s=Math.abs(Math.sin(rad)),bw=Math.abs(Number(shape.SizeWidth)),bh=Math.abs(Number(shape.SizeHeight));return{w:bw*c+bh*s,h:bw*s+bh*c,ang:ang};}}
function itemOf(shape,id){var b=measureAt(shape,0);return{id:id,shape:shape,w:b.w,h:b.h,area:b.w*b.h,m:{0:b,45:measureAt(shape,45),90:measureAt(shape,90),135:measureAt(shape,135)}};}
function opts(it,angles){var a=[],i,o,seen={};for(i=0;i<angles.length;i++){o=it.m[angles[i]];if(!o)continue;var k=(Math.round(o.w*100)+'x'+Math.round(o.h*100));if(!seen[k]){seen[k]=1;a.push(o);}}return a;}
function intersects(a,b){return !(b.x>=a.x+a.w||b.x+b.w<=a.x||b.y>=a.y+a.h||b.y+b.h<=a.y);}function contained(a,b){return a.x>=b.x-.001&&a.y>=b.y-.001&&a.x+a.w<=b.x+b.w+.001&&a.y+a.h<=b.y+b.h+.001;}
function splitFree(fr,p,out){var r=fr.x+fr.w,b=fr.y+fr.h,pr=p.x+p.w,pb=p.y+p.h;if(!intersects(fr,p)){out.push(fr);return;}if(p.x>fr.x+.001)out.push({x:fr.x,y:fr.y,w:p.x-fr.x,h:fr.h});if(pr<r-.001)out.push({x:pr,y:fr.y,w:r-pr,h:fr.h});if(p.y>fr.y+.001)out.push({x:fr.x,y:fr.y,w:fr.w,h:p.y-fr.y});if(pb<b-.001)out.push({x:fr.x,y:pb,w:fr.w,h:b-pb});}
function prune(a){var out=[],i,j,keep;for(i=0;i<a.length;i++){if(a[i].w<=.001||a[i].h<=.001)continue;keep=true;for(j=0;j<a.length;j++){if(i!==j&&contained(a[i],a[j])){keep=false;break;}}if(keep)out.push(a[i]);}return out;}
function sorted(items,kind){var a=items.slice(0);if(kind==='area')a.sort(function(x,y){return y.area-x.area;});else if(kind==='max')a.sort(function(x,y){return Math.max(y.w,y.h)-Math.max(x.w,x.h);});else if(kind==='height')a.sort(function(x,y){return y.h-x.h;});else if(kind==='width')a.sort(function(x,y){return y.w-x.w;});else if(kind==='ratio')a.sort(function(x,y){return Math.abs((y.w/y.h)-1)-Math.abs((x.w/x.h)-1);});else a.sort(function(x,y){return y.area-x.area;});return a;}
function candScore(fr,pw,ph,ang,scoreKind,x,y){var dw=fr.w-pw,dh=fr.h-ph,waste=fr.w*fr.h-pw*ph,rot=(ang===0?0:(ang===90?.02:.08));if(scoreKind==='short')return Math.min(dw,dh)*100000+Math.max(dw,dh)*100+waste+rot;if(scoreKind==='bottom')return y*100000000+x*100000+waste+rot;if(scoreKind==='depth')return (y+ph)*100000000+(x+pw)*100000+waste+rot;return waste*1000+Math.min(dw,dh)+rot;}
function oneBin(items,W,H,gap,angles,kind,scoreKind){var ord=sorted(items,kind),free=[{x:0,y:0,w:W,h:H}],placed=[],used={},i,j,k,it,oo,op,fr,pw,ph,score,best,nf,q,area=0,depth=0,right=0;for(i=0;i<ord.length;i++){it=ord[i];best=null;oo=opts(it,angles);for(j=0;j<free.length;j++){fr=free[j];for(k=0;k<oo.length;k++){op=oo[k];pw=op.w+gap;ph=op.h+gap;if(pw<=fr.w+.001&&ph<=fr.h+.001){score=candScore(fr,pw,ph,op.ang,scoreKind,fr.x,fr.y);if(!best||score<best.score)best={x:fr.x,y:fr.y,w:pw,h:ph,ow:op.w,oh:op.h,ang:op.ang,item:it,score:score};}}}if(!best)continue;placed.push(best);used[it.id]=1;area+=best.ow*best.oh;depth=Math.max(depth,best.y+best.oh);right=Math.max(right,best.x+best.ow);nf=[];for(q=0;q<free.length;q++)splitFree(free[q],best,nf);free=prune(nf);}var rem=[];for(i=0;i<items.length;i++)if(!used[items[i].id])rem.push(items[i]);return{place:placed,remaining:rem,area:area,depth:depth,right:right};}
function allBins(items,W,H,gap,angles,kind,scoreKind){var rem=items.slice(0),bins=[],guard=0,b,totalArea=0,totalDepth=0;while(rem.length&&guard++<500){b=oneBin(rem,W,H,gap,angles,kind,scoreKind);if(!b.place.length)break;bins.push(b);totalArea+=b.area;totalDepth+=b.depth;rem=b.remaining;}return{bins:bins,remaining:rem,totalArea:totalArea,totalDepth:totalDepth};}
function quality(p){var last=p.bins.length?p.bins[p.bins.length-1]:null;return p.remaining.length*1e15+p.totalDepth*1e7+p.bins.length*1e5+(last?last.right:0);}
function choose(items,W,H,gap,angles){var kinds=['area','max','height','width','ratio'],scores=['area','short','bottom','depth'],best=null,i,j,p,q;for(i=0;i<kinds.length;i++){for(j=0;j<scores.length;j++){p=allBins(items,W,H,gap,angles,kinds[i],scores[j]);q=quality(p);if(!best||q<best.q)best={plan:p,kind:kinds[i],scoreKind:scores[j],q:q};}}return best;}
function chooseBetween(base,multi){if(multi.plan.remaining.length<base.plan.remaining.length)return multi;if(multi.plan.remaining.length>base.plan.remaining.length)return base;if(multi.plan.totalDepth+0.01<base.plan.totalDepth)return multi;return base;}
function frame(page,left,bottom,w,h,idx){var f=page.ActiveLayer.CreateRectangle2(left,bottom,w,h);try{f.Fill.ApplyNoFill();}catch(e){}try{f.Outline.Width=.2;f.Outline.Color.CMYKAssign(0,0,0,100);}catch(e2){}try{f.Name='DHL_SMART_FRAME_'+idx;}catch(e3){}try{f.OrderToBack();}catch(e4){}return f;}
function smartMulti(){var a,doc,oldUnit,opt=false,cmd=false,res=E('v77NestResult');try{a=corelApp();doc=a.ActiveDocument;var ss=selection(a);if(!ss.length)throw new Error(LANG()==='vi'?'Chưa chọn đối tượng.':'No objects selected.');var W=N('v77NestW',58)*10,H=N('v77NestH',2000)*10,gap=N('v77NestGap',1.5)*10,fg=N('v77FrameGapInput',0)*10,mt=N('v77MarginT',0)*10,mb=N('v77MarginB',0)*10,ml=N('v77MarginL',0)*10,mr=N('v77MarginR',0)*10,uw=W-ml-mr,uh=H-mt-mb;if(W<=0||H<=0||gap<0||uw<=0||uh<=0)throw new Error(LANG()==='vi'?'Khổ/lề không hợp lệ.':'Invalid frame/margins.');oldUnit=doc.Unit;doc.Unit=3;var items=[],i;for(i=0;i<ss.length;i++)items.push(itemOf(ss[i],i));
 var base=choose(items,uw,uh,gap,[0,90]);var multi=choose(items,uw,uh,gap,[0,45,90,135]);var chosen=chooseBetween(base,multi),usedMulti=(chosen===multi),plan=chosen.plan,page=a.ActivePage,baseLeft=Number(page.CenterX)-W/2,baseBottom=Number(page.CenterY)-H/2,bi,p,sh,left,top,placed=0,usedArea=0;
 doc.BeginCommandGroup('DHL Nameset Layout - Smart Rotation');cmd=true;a.Optimization=true;opt=true;for(bi=0;bi<plan.bins.length;bi++){left=baseLeft+bi*(W+fg);frame(page,left,baseBottom,W,H,bi+1);top=baseBottom+H-mt;for(i=0;i<plan.bins[bi].place.length;i++){p=plan.bins[bi].place[i];sh=p.item.shape;if(p.ang)sh.Rotate(p.ang);sh.CenterX=left+ml+p.x+p.ow/2;sh.CenterY=top-p.y-p.oh/2;placed++;usedArea+=p.ow*p.oh;}}
 a.Optimization=false;opt=false;doc.Unit=oldUnit;doc.EndCommandGroup();cmd=false;try{a.ActiveWindow.Refresh();}catch(rx){}
 var frames=plan.bins.length,pct=frames?Math.round(usedArea/(frames*uw*uh)*1000)/10:0,vi=LANG()==='vi',remain=plan.remaining.length,cm=r2(plan.totalDepth/10),baseCm=r2(base.plan.totalDepth/10),multiCm=r2(multi.plan.totalDepth/10),picked=usedMulti?(vi?'đa góc 0°/45°/90°/135°':'multi-angle 0°/45°/90°/135°'):(vi?'0°/90°':'0°/90°');
 res.setAttribute('data-used','1');res.innerHTML='<span class="v80-modebadge">'+(vi?'Chế độ: AUTO BEST — so sánh 0°/90° với đa góc':'Mode: AUTO BEST — compares 0°/90° against multi-angle')+'</span><br/>'+(remain?(vi?'⚠ Đã xếp '+placed+'/'+items.length+' đối tượng; '+remain+' đối tượng không vừa.':'⚠ Packed '+placed+'/'+items.length+' objects; '+remain+' do not fit.'):(vi?'✓ Đã xếp '+placed+' đối tượng.':'✓ Packed '+placed+' objects.'))+'<span class="v814-plan">'+(vi?'Tool đã chọn: ':'Chosen plan: ')+picked+'<br/>'+(vi?'So sánh chiều dài: 0°/90° = ':'Length comparison: 0°/90° = ')+baseCm+' cm · '+(vi?'đa góc = ':'multi-angle = ')+multiCm+' cm<br/>'+(vi?'Chiều dài dùng: ':'Used length: ')+cm+' cm = '+r2(cm/100)+' m · '+(vi?'Hiệu suất bbox: ':'BBox usage: ')+pct+'%</span>';
 }catch(e){try{if(opt&&a)a.Optimization=false;}catch(x){}try{if(doc&&oldUnit!==undefined)doc.Unit=oldUnit;}catch(x2){}try{if(cmd&&doc)doc.EndCommandGroup();}catch(x3){}if(res){res.setAttribute('data-used','1');res.innerHTML=(LANG()==='vi'?'Không dàn được: ':'Could not nest: ')+esc(e.message);}}}
function run(){if(mode()==='compact'&&E('v77Rotate')&&E('v77Rotate').value==='45'){smartMulti();return;}if(previousNest)previousNest();}
function relabel(){var o=E('v83Rot45'),h=E('v83RotHint');if(o)o.innerHTML=LANG()==='vi'?'AUTO BEST: 0°/90° + thử 45°/135°':'AUTO BEST: 0°/90° + test 45°/135°';if(h)h.innerHTML=LANG()==='vi'?'Tool luôn tính cả phương án 0°/90°. Góc 45°/135° chỉ được chọn nếu chiều dài vật liệu thực sự ngắn hơn — nếu bằng nhau vẫn giữ 0°/90°.':'The tool always computes a 0°/90° baseline. 45°/135° is chosen only when it actually reduces material length; ties keep 0°/90°.';var v=document.getElementsByClassName?document.getElementsByClassName('ver'):[],f=document.getElementsByClassName?document.getElementsByClassName('footer'):[];if(v&&v.length)v[0].innerHTML='v8.14';if(f&&f.length)f[0].innerHTML='DHL Nameset Layout · v8.14 · smart rotation compare · VI / EN';}
function finish(){if(!E('v77NestBtn')){setTimeout(finish,180);return;}previousNest=window.V77NestSelected;window.V77NestSelected=run;E('v77NestBtn').onclick=run;relabel();var old=window.setLanguage;if(old&&!old._v814){var w=function(x){var r=old(x);setTimeout(relabel,60);return r;};w._v814=true;window.setLanguage=w;}}
if(window.addEventListener)window.addEventListener('load',function(){setTimeout(finish,5200);},false);else if(window.attachEvent)window.attachEvent('onload',function(){setTimeout(finish,5200);});else setTimeout(finish,5400);
})();
</script>
