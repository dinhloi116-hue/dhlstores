<style id="dhl-v825-shape-aware-compact-style"></style>
<script id="dhl-v825-shape-aware-compact" type="text/javascript">
(function(){
function E(id){return document.getElementById(id);}
function L(){try{return currentLang==='en'?'en':'vi';}catch(e){return'vi';}}
function N(id,d){var x=E(id),v=x?Number(x.value):d;return isFinite(v)?v:d;}
function app(){if(window.external&&window.external.Application)return window.external.Application;if(typeof corelApp==='function')return corelApp();throw new Error(L()==='vi'?'Không kết nối được CorelDRAW.':'Cannot connect to CorelDRAW.');}
function selected(a){var sr=a.ActiveSelectionRange,out=[],i;if(!sr)return out;for(i=1;i<=sr.Count;i++)out.push(sr.Item(i));return out;}
function rectOf(s){var w=Math.abs(Number(s.SizeWidth)),h=Math.abs(Number(s.SizeHeight)),cx=Number(s.CenterX),cy=Number(s.CenterY);return{l:cx-w/2,r:cx+w/2,b:cy-h/2,t:cy+h/2,w:w,h:h};}
function leaves(s,out,depth){
  var kids=null,i,c=0;
  if(depth>8){out.push(s);return;}
  try{kids=s.Shapes;c=kids?kids.Count:0;}catch(e){c=0;}
  if(c>0){
    for(i=1;i<=c;i++){try{leaves(kids.Item(i),out,depth+1);}catch(x){}}
  }else out.push(s);
}
function footprint(shape){
  var box=rectOf(shape),ls=[],parts=[],i,r;
  leaves(shape,ls,0);
  if(!ls.length)ls=[shape];
  for(i=0;i<ls.length;i++){
    try{
      r=rectOf(ls[i]);
      if(r.w>.01&&r.h>.01)parts.push({x:r.l-box.l,y:box.t-r.t,w:r.w,h:r.h});
    }catch(e){}
  }
  if(!parts.length)parts=[{x:0,y:0,w:box.w,h:box.h}];
  return{shape:shape,w:box.w,h:box.h,parts:parts,area:box.w*box.h};
}
function collideParts(x,y,it,q,gap){
  var i,j,a,b,ax1,ay1,ax2,ay2,bx1,by1,bx2,by2;
  for(i=0;i<it.parts.length;i++){
    a=it.parts[i];ax1=x+a.x;ay1=y+a.y;ax2=ax1+a.w;ay2=ay1+a.h;
    for(j=0;j<q.item.parts.length;j++){
      b=q.item.parts[j];bx1=q.x+b.x;by1=q.y+b.y;bx2=bx1+b.w;by2=by1+b.h;
      if(!(ax2+gap<=bx1+.001||bx2+gap<=ax1+.001||ay2+gap<=by1+.001||by2+gap<=ay1+.001))return true;
    }
  }
  return false;
}
function valid(x,y,it,placed,W,H,gap){
  var i;if(x<-.001||y<-.001||x+it.w>W+.001||y+it.h>H+.001)return false;
  for(i=0;i<placed.length;i++)if(collideParts(x,y,it,placed[i],gap))return false;
  return true;
}
function add(v,a,seen,limit){
  var k;if(!isFinite(v)||v<-.001||v>limit+.001)return;
  v=Math.max(0,Math.min(limit,v));k=Math.round(v*100)/100;
  if(!seen[k]){seen[k]=1;a.push(k);}
}
function candidates(it,placed,W,H,gap){
  var xs=[],ys=[],sx={},sy={},i,j,k,q,b,a;
  add(0,xs,sx,W-it.w);add(W-it.w,xs,sx,W-it.w);
  add(0,ys,sy,H-it.h);add(H-it.h,ys,sy,H-it.h);
  for(i=0;i<placed.length;i++){
    q=placed[i];
    add(q.x,xs,sx,W-it.w);add(q.x+q.item.w+gap,xs,sx,W-it.w);add(q.x-it.w-gap,xs,sx,W-it.w);
    add(q.y,ys,sy,H-it.h);add(q.y+q.item.h+gap,ys,sy,H-it.h);add(q.y-it.h-gap,ys,sy,H-it.h);
    for(j=0;j<q.item.parts.length;j++){
      b=q.item.parts[j];
      for(k=0;k<it.parts.length;k++){
        a=it.parts[k];
        add(q.x+b.x+b.w+gap-a.x,xs,sx,W-it.w);
        add(q.x+b.x-gap-(a.x+a.w),xs,sx,W-it.w);
        add(q.y+b.y+b.h+gap-a.y,ys,sy,H-it.h);
        add(q.y+b.y-gap-(a.y+a.h),ys,sy,H-it.h);
      }
    }
  }
  return{xs:xs,ys:ys};
}
function pack(items,W,H,gap){
  var ord=items.slice(0),placed=[],i,j,k,it,c,best,x,y,depth,right,score;
  ord.sort(function(a,b){return b.area-a.area;});
  for(i=0;i<ord.length;i++){
    it=ord[i];c=candidates(it,placed,W,H,gap);best=null;
    for(j=0;j<c.ys.length;j++)for(k=0;k<c.xs.length;k++){
      x=c.xs[k];y=c.ys[j];
      if(!valid(x,y,it,placed,W,H,gap))continue;
      depth=y+it.h;right=x+it.w;
      score=depth*1000000000+right*100000+x;
      if(!best||score<best.score)best={x:x,y:y,item:it,score:score};
    }
    if(!best)return null;
    placed.push(best);
  }
  placed.sort(function(a,b){return a.item._ord-b.item._ord;});
  return placed;
}
function frameIndexFor(shape,baseLeft,W,fg){
  var cx=Number(shape.CenterX),step=W+fg,idx=Math.round((cx-(baseLeft+W/2))/step);
  return idx<0?0:idx;
}
function tighten(){
  var a=app(),doc=a.ActiveDocument,old=doc.Unit,ss=selected(a),W=N('v77NestW',58)*10,H=N('v77NestH',2000)*10,gap=N('v77NestGap',.5)*10,fg=N('v77FrameGapInput',0)*10,mt=N('v77MarginT',0)*10,mb=N('v77MarginB',0)*10,ml=N('v77MarginL',0)*10,mr=N('v77MarginR',0)*10,uw=W-ml-mr,uh=H-mt-mb,page,baseLeft,baseBottom,bins={},i,idx,it,arr,key,plan,p,left,top,cmd=false,opt=false,moved=0;
  if(ss.length<2||uw<=0||uh<=0)return false;
  try{
    doc.Unit=3;page=a.ActivePage;baseLeft=Number(page.CenterX)-W/2;baseBottom=Number(page.CenterY)-H/2;
    for(i=0;i<ss.length;i++){
      idx=frameIndexFor(ss[i],baseLeft,W,fg);key=String(idx);if(!bins[key])bins[key]=[];
      it=footprint(ss[i]);it._ord=bins[key].length;bins[key].push(it);
    }
    doc.BeginCommandGroup('DHL Nameset Layout - Shape-aware Compact V8.25');cmd=true;
    try{a.Optimization=true;opt=true;}catch(o){}
    for(key in bins)if(bins.hasOwnProperty(key)){
      arr=bins[key];if(arr.length<2)continue;plan=pack(arr,uw,uh,gap);if(!plan)continue;
      idx=parseInt(key,10)||0;left=baseLeft+idx*(W+fg)+ml;top=baseBottom+H-mt;
      for(i=0;i<plan.length;i++){
        p=plan[i];p.item.shape.CenterX=left+p.x+p.item.w/2;p.item.shape.CenterY=top-p.y-p.item.h/2;moved++;
      }
    }
    try{if(opt)a.Optimization=false;}catch(o2){}opt=false;doc.Unit=old;doc.EndCommandGroup();cmd=false;try{a.ActiveWindow.Refresh();}catch(r){}
    return moved>0;
  }catch(e){
    try{if(opt)a.Optimization=false;}catch(x){}
    try{if(cmd){doc.EndCommandGroup();doc.Undo();}}catch(x2){}
    try{doc.Unit=old;}catch(x3){}
    return false;
  }
}
var oldRun=null,oldUndo=null,lastTight=false,hooked=false;
function run(){
  var ok=oldRun?oldRun():false,res;
  if(ok!==false){
    lastTight=tighten();
    if(lastTight){
      res=E('v77NestResult');
      if(res)res.innerHTML+='<br><span class="v815-sub">'+(L()==='vi'?'✓ Đã ép thêm theo hình thực bên trong Group, không còn coi toàn Group là một hình chữ nhật đặc.':'✓ Extra shape-aware compaction applied inside Groups; Groups are no longer treated as solid rectangles.')+'</span>';
    }
  }
  return ok;
}
function undo(){
  var a;if(lastTight){try{a=app();a.ActiveDocument.Undo();}catch(e){}lastTight=false;}
  if(oldUndo)return oldUndo();
}
function finish(){
  var b=E('v77NestBtn'),u=E('v77UndoNest'),v=document.getElementsByClassName?document.getElementsByClassName('ver'):[],f=document.getElementsByClassName?document.getElementsByClassName('footer'):[];
  if(!b){setTimeout(finish,250);return;}
  if(!hooked){oldRun=window.V77NestSelected;oldUndo=window.V77Undo;hooked=true;}
  window.V77NestSelected=run;window.V77Undo=undo;b.onclick=run;if(u)u.onclick=undo;
  if(v&&v.length)v[0].innerHTML='v8.25';
  if(f&&f.length)f[0].innerHTML='DHL Nameset Layout · v8.25 · shape-aware nesting · VI / EN';
}
if(window.addEventListener)window.addEventListener('load',function(){setTimeout(finish,13400);},false);else if(window.attachEvent)window.attachEvent('onload',function(){setTimeout(finish,13400);});else setTimeout(finish,13600);
})();
</script>
