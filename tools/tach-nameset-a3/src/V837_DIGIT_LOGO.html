<style id="dhl-v837-digit-logo-style">

.v837-logo-title{font-size:11px!important;font-weight:800!important;line-height:1.4!important}
.v837-logo-label{display:block!important;margin:6px 0!important;font-size:11px!important;line-height:1.35!important;color:#111!important}
.v837-logo-label input{vertical-align:middle!important;width:auto!important;min-height:0!important;margin-right:5px!important}
.v837-grid{display:table!important;table-layout:fixed!important;width:100%!important;margin:5px 0!important}

</style>
<script id="dhl-v837-digit-logo" type="text/javascript">
(function(){
function E(id){return document.getElementById(id);}
function lang(){try{return currentLang==='en'?'en':'vi';}catch(e){return 'vi';}}
function label(v,e){return lang()==='vi'?v:e;}
function err(v,e){return new Error(label(v,e));}
function app(){if(window.external&&window.external.Application)return window.external.Application;if(typeof corelApp==='function')return corelApp();throw err('Không kết nối được CorelDRAW.','CorelDRAW is not available.');}
function finite(x){return isFinite(Number(x))&&x!==null&&x!=='';}
function bounded(x,lo,hi,n){x=Number(x);return finite(x)&&x>=lo&&x<=hi?x:n;}
var prefs={on:false,pct:9,bottom:2,inset:1,mode:'per'};
var chosen=null,chosenDoc=null,serial=0;
function readSaved(){try{var raw=localStorage.getItem('dhl_v837_logo'),v;if(raw){v=raw.split('|');prefs.on=v[0]==='1';prefs.pct=bounded(v[1],2,30,9);prefs.bottom=bounded(v[2],0,30,2);prefs.inset=bounded(v[3],0,10,1);prefs.mode=v[4]==='whole'?'whole':'per';}}catch(e){}}
function persist(){try{localStorage.setItem('dhl_v837_logo',[prefs.on?'1':'0',prefs.pct,prefs.bottom,prefs.inset,prefs.mode].join('|'));}catch(e){}}
function signature(){return [prefs.on?'1':'0',prefs.pct,prefs.bottom,prefs.inset,prefs.mode,serial,chosen?'selected':'missing'].join('|');}
function selected(a){var sr=a.ActiveSelectionRange,o=[],i;if(sr&&sr.Count)for(i=1;i<=sr.Count;i++)o.push(sr.Item(i));return o;}
function getLogo(){
 if(!chosen||!chosenDoc)throw err('Chưa lấy logo từ đối tượng Corel. Chọn đúng 1 logo và bấm LẤY LOGO trước.','No logo captured. Select one logo shape in Corel and click CAPTURE LOGO.');
 var a=app();if(a.ActiveDocument!==chosenDoc){ // COM wrappers may not use reference equality; validate by document name if possible.
   var same=false;try{same=String(a.ActiveDocument.FullFileName)===String(chosenDoc.FullFileName)&&String(a.ActiveDocument.FullFileName)!=='';}catch(q){}
   if(!same)throw err('Đã đổi tài liệu Corel. Hãy lấy logo lại trong tài liệu hiện tại.','The Corel document changed. Capture the logo again in the current document.');
 }
 var w=Number(chosen.SizeWidth),h=Number(chosen.SizeHeight);
 if(!(w>0&&h>0))throw err('Logo nguồn đã bị xóa hoặc không có kích thước hợp lệ.','The original logo is missing or has invalid dimensions.');
 return chosen;
}
function available(){if(!prefs.on)return null;return getLogo();}
function report(message,bad){var ids=['v837ManualMsg','v837ExcelMsg'],i,x;for(i=0;i<ids.length;i++){x=E(ids[i]);if(x){x.className='v837-msg'+(bad?' error':' ok');x.innerHTML=message;}}}
function redraw(){var ids=['v837Manual','v837Excel'],i,k,p,x;for(i=0;i<ids.length;i++){p=ids[i];x=E(p+'On');if(x)x.checked=prefs.on;x=E(p+'Pct');if(x)x.value=prefs.pct;x=E(p+'Bottom');if(x)x.value=prefs.bottom;x=E(p+'Inset');if(x)x.value=prefs.inset;x=E(p+'Mode');if(x)x.value=prefs.mode;}}
function notify(){serial++;persist();redraw();try{if(typeof window.DHLLogoSettingsChanged==='function')window.DHLLogoSettingsChanged();}catch(e){}}
function capture(){
 try{var a=app(),ss=selected(a);if(ss.length!==1)throw err('Chỉ chọn đúng một logo (có thể là Group) rồi bấm LẤY LOGO.','Select exactly one logo (it may be a group), then click CAPTURE.');
 var s=ss[0];if(!(Number(s.SizeWidth)>0&&Number(s.SizeHeight)>0))throw err('Logo không có kích thước.','The selected logo has no size.');
 chosen=s;chosenDoc=a.ActiveDocument;report(label('✓ Đã lấy logo nguồn. Logo gốc không bị thay đổi.','✓ Logo captured. The original artwork is untouched.'),false);
 notify();return true;
 }catch(e){report(String(e.message||e),true);return false;}
}
function updateFrom(prefix){
 var eOn=E(prefix+'On'),pct=E(prefix+'Pct'),bottom=E(prefix+'Bottom'),inset=E(prefix+'Inset'),mode=E(prefix+'Mode');
 prefs.on=!!(eOn&&eOn.checked);
 prefs.pct=bounded(pct?pct.value:null,2,30,9);
 prefs.bottom=bounded(bottom?bottom.value:null,0,30,2);
 prefs.inset=bounded(inset?inset.value:null,0,10,1);
 prefs.mode=mode&&mode.value==='whole'?'whole':'per';
 notify();
}
function textOf(sh){try{return String(sh.Text.Story.Text).replace(/^\s+|\s+$/g,'');}catch(e){return '';}}
function numberText(s){var t=textOf(s);return /^\d{1,4}$/.test(t)?t:'';}
function glyphWidths(sh,digits){
 var fullW=Math.abs(Number(sh.SizeWidth)),fullH=Math.abs(Number(sh.SizeHeight)),parts=[],sum=0,i,tmp,tw,th,glyph;
 for(i=0;i<digits.length;i++){
  tmp=null;
  try{tmp=sh.Duplicate();tmp.Text.Story.Text=digits.charAt(i);tw=Math.abs(Number(tmp.SizeWidth));th=Math.abs(Number(tmp.SizeHeight));glyph=tw>0&&th>0?tw*(fullH/th):0;}
  catch(e){glyph=0;}
  finally{try{if(tmp)tmp.Delete();}catch(x){}}
  if(!(glyph>0))glyph=fullW/digits.length;
  parts.push(glyph);sum+=glyph;
 }
 if(!(sum>0))throw err('Không đo được chiều rộng chữ số.','Cannot measure the digits.');
 for(i=0;i<parts.length;i++)parts[i]=fullW*parts[i]/sum;
 return parts;
}
function slotsFor(numberShape,digits,mode){
 var w=Math.abs(Number(numberShape.SizeWidth)),l=Number(numberShape.CenterX)-w/2,parts,i,pos,out=[];
 if(!w||!finite(l))throw err('Đối tượng số không có kích thước hợp lệ.','Invalid number dimensions.');
 if(mode==='whole')return [{cx:Number(numberShape.CenterX),width:w,digit:digits}];
 if(digits.length===1)return[{cx:Number(numberShape.CenterX),width:w,digit:digits}];
 parts=glyphWidths(numberShape,digits);pos=l;
 for(i=0;i<parts.length;i++){out.push({cx:pos+parts[i]/2,width:parts[i],digit:digits.charAt(i)});pos+=parts[i];}
 return out;
}
function cloneAt(source,layer,cx,bottomY,slotWidth,height){
 var clone=null,ow,oh,maxWidth,newH,newW,k;
 try{
  clone=source.CopyToLayer(layer);
  if(!clone)throw err('Corel không thể sao chép logo.','CorelDRAW could not copy the logo.');
  ow=Math.abs(Number(clone.SizeWidth));oh=Math.abs(Number(clone.SizeHeight));
  if(!(ow>0&&oh>0))throw err('Logo nguồn có chiều rộng/cao bằng 0.','Logo has zero width/height.');
  maxWidth=slotWidth-2*prefs.inset;
  if(!(maxWidth>0))throw err('Không đủ bề rộng của số để chèn logo. Giảm inset hoặc giảm cỡ logo.','The digit is too narrow. Reduce the horizontal inset or logo size.');
  newH=Math.min(height,maxWidth*oh/ow);
  if(newH<0.5)throw err('Logo quá nhỏ để in rõ ở chân số.','The logo would be too small to print.');
  newW=ow*newH/oh;
  clone.SetSize(newW,newH);
  clone.CenterX=cx;
  clone.CenterY=bottomY+prefs.bottom+newH/2;
  try{clone.Name='DHL_DIGIT_LOGO';}catch(x){}
  try{clone.OrderFrontOne();}catch(y){}
  return clone;
 }catch(e){try{if(clone)clone.Delete();}catch(clean){}throw e;}
}
function intoNumber(sh,digits,layer){
 if(!prefs.on)return[];
 var source=getLogo(),t=String(digits||''),slots,clones=[],i,h,bottomY,desired;
 if(!/^\d{1,4}$/.test(t))return[];
 h=Math.abs(Number(sh.SizeHeight));
 if(!(h>0))throw err('Số không có chiều cao.','The number has no height.');
 slots=slotsFor(sh,t,prefs.mode);desired=h*prefs.pct/100;
 bottomY=Number(sh.CenterY)-h/2;
 try{
  for(i=0;i<slots.length;i++)clones.push(cloneAt(source,layer,slots[i].cx,bottomY,slots[i].width,desired));
  return clones;
 }catch(e){for(i=0;i<clones.length;i++)try{clones[i].Delete();}catch(clean){}throw e;}
}
function onVector(sh,layer){
 if(!prefs.on)return[];
 var source=getLogo(),h=Math.abs(Number(sh.SizeHeight)),w=Math.abs(Number(sh.SizeWidth));
 if(!(h>0&&w>0))throw err('Đối tượng số không có kích thước.','Vector digit has no size.');
 return [cloneAt(source,layer,Number(sh.CenterX),Number(sh.CenterY)-h/2,w,h*prefs.pct/100)];
}
function tagged(root,depth){
 var name='',kids=null,i;
 try{name=String(root.Name||'');}catch(e){}
 if(name.indexOf('DHL_DIGIT_LOGO')===0)return true;
 if(depth>=9)return false;
 try{kids=root.Shapes;}catch(e2){}
 if(kids)try{for(i=1;i<=kids.Count;i++)if(tagged(kids.Item(i),depth+1))return true;}catch(x){}
 return false;
}
function collectNumbers(root,out,depth){
 var kids=null,i,t;if(depth>9)return;
 t=numberText(root);if(t){out.push({shape:root,text:t});return;}
 try{kids=root.Shapes;}catch(e){}
 if(kids)try{for(i=1;i<=kids.Count;i++)collectNumbers(kids.Item(i),out,depth+1);}catch(x){}
}
function manual(){
 var a=null,doc=null,old=null,ss=[],nums=[],logos=[],grouped=null,range,i,j,k,layer,cmd=false,source;
 try{
  if(!prefs.on)throw err('Hãy bật CHÈN LOGO trước.','Enable INSERT LOGO first.');
  source=getLogo();a=app();ss=selected(a);
  if(!ss.length)throw err('Chọn số hoặc Group nameset cần chèn logo.','Select a number or nameset Group.');
  if(ss.length===1&&ss[0]===source)throw err('Đang chọn logo nguồn, hãy chọn số trước.','You selected the source logo. Select the number instead.');
  for(i=0;i<ss.length;i++)if(tagged(ss[i],0))throw err('Group đã có logo. Không chèn lặp; hãy hoàn tác/xóa logo cũ trước.','This Group already has digit logos. Remove the existing logos first.');
  for(i=0;i<ss.length;i++)collectNumbers(ss[i],nums,0);
  if(!nums.length){
   if(ss.length>3)throw err('Không tìm thấy chữ số. Với font số đã convert, chỉ chọn trực tiếp từng digit (tối đa 3), không chọn cả nameset.','No digit text found. For curves, select individual digit shapes (up to 3), not the entire nameset.');
   for(i=0;i<ss.length;i++){
    try{if(ss[i].Shapes&&ss[i].Shapes.Count>0)throw err('Group curve chưa thể nhận biết ranh giới từng digit. Chọn từng digit riêng.','For grouped curves, select separate digit shapes.');}catch(check){if(check.message&&check.message.indexOf('digit')>=0)throw check;}
   }
  }
  doc=a.ActiveDocument;old=doc.Unit;doc.Unit=3;doc.BeginCommandGroup('DHL Number Logo V8.37');cmd=true;
  if(nums.length){
   for(i=0;i<nums.length;i++){
    layer=nums[i].shape.Layer;
    var made=intoNumber(nums[i].shape,nums[i].text,layer);
    for(j=0;j<made.length;j++)logos.push(made[j]);
   }
  }else{
   for(i=0;i<ss.length;i++){
    var each=onVector(ss[i],ss[i].Layer);
    for(j=0;j<each.length;j++)logos.push(each[j]);
   }
  }
  range=a.CreateShapeRange();
  for(i=0;i<ss.length;i++)range.Add(ss[i]);
  for(i=0;i<logos.length;i++)range.Add(logos[i]);
  grouped=range.Group();try{grouped.Name='DHL_NAMESET_WITH_DIGIT_LOGO';}catch(n){}
  doc.EndCommandGroup();cmd=false;doc.Unit=old;
  try{grouped.CreateSelection();}catch(x){}
  try{a.ActiveWindow.Refresh();}catch(x2){}
  report(label('✓ Đã chèn '+logos.length+' logo và Group cùng số; có thể dàn/tách trang.','✓ Inserted '+logos.length+' logo(s), grouped with the number, ready for layout/pages.'),false);
  return true;
 }catch(e){
  try{if(cmd&&doc){doc.EndCommandGroup();doc.Undo();}}catch(revert){}
  try{if(doc&&old!==null)doc.Unit=old;}catch(restore){}
  report(String(e.message||e),true);return false;
 }
}
function panel(prefix){
 var isExcel=prefix==='v837Excel',box=document.createElement('div');
 box.id=prefix+'Panel';box.className='v837-logo-panel';
 box.innerHTML='<div class="v837-logo-title">'+label('LOGO Ở CHÂN TỪNG CHỮ SỐ','LOGO AT THE FOOT OF EACH DIGIT')+'</div>'
 +'<label class="v837-logo-label"><input id="'+prefix+'On" type="checkbox"/>'+label('Bật chèn logo vào số','Insert logo into number')+'</label>'
 +'<div class="v837-grid"><div><span class="v837-mini">'+label('Cỡ logo (% cao số)','Logo (% number height)')+'</span><input id="'+prefix+'Pct" type="number" min="2" max="30" step="0.5"/></div>'
 +'<div><span class="v837-mini">'+label('Cách đáy (mm)','Bottom offset (mm)')+'</span><input id="'+prefix+'Bottom" type="number" min="0" max="30" step="0.5"/></div>'
 +'<div><span class="v837-mini">'+label('Lề ngang (mm)','Side inset (mm)')+'</span><input id="'+prefix+'Inset" type="number" min="0" max="10" step="0.5"/></div></div>'
 +'<div><span class="v837-mini">'+label('Áp dụng logo','Logo placement')+'</span><select id="'+prefix+'Mode"><option value="per">'+label('Mỗi chữ số 1 logo','One logo per digit')+'</option><option value="whole">'+label('Một logo cho cả cụm số','One logo for whole number')+'</option></select></div>'
 +'<div class="v837-actions"><div><button type="button" id="'+prefix+'Capture">'+label('LẤY LOGO ĐANG CHỌN','CAPTURE SELECTED LOGO')+'</button></div>'
 +(isExcel?'':'<div><button type="button" id="'+prefix+'Apply">'+label('CHÈN VÀO SỐ ĐÃ CHỌN','INSERT INTO SELECTED NUMBER')+'</button></div>')+'</div>'
 +'<div class="v837-note">'+(isExcel?label('Chọn 1 logo trong Corel → LẤY LOGO → bật checkbox → tạo bộ Excel. Dòng COACH không có số sẽ bỏ qua.','Capture a Corel logo first, then enable and create Excel namesets. COACH without a number is skipped.'):label('Chọn logo rồi LẤY LOGO; tiếp tục chọn số hoặc Group nameset và bấm CHÈN. Với số đã convert curve, chọn từng digit riêng.','Capture logo first, select number text or a nameset Group and INSERT. For converted curves, select each digit separately.'))+'</div>'
 +'<div id="'+prefix+'Msg" class="v837-msg"></div>';
 return box;
}
function hookPanel(prefix,el){
 var box=panel(prefix),controls=['On','Pct','Bottom','Inset','Mode'],i,node,cap;
 el.parentNode.insertBefore(box,el);
 for(i=0;i<controls.length;i++){node=E(prefix+controls[i]);if(node)node.onchange=(function(p){return function(){updateFrom(p);};})(prefix);}
 cap=E(prefix+'Capture');if(cap)cap.onclick=capture;
 if(prefix==='v837Manual'){node=E(prefix+'Apply');if(node)node.onclick=manual;}
}
function mount(){
 var m=E('run'),x=E('v86MakeGroups'),mf=E('v837ManualPanel'),xf=E('v837ExcelPanel');
 if(m&&!mf)hookPanel('v837Manual',m.parentNode);
 if(x&&!xf)hookPanel('v837Excel',x);
 redraw();
 return !!(E('v837ManualPanel')&&E('v837ExcelPanel'));
}
function start(){var tries=0;function tick(){if(mount()||++tries>=35)return;setTimeout(tick,300);}tick();}
readSaved();
window.DHLNumberLogo={capture:capture,manual:manual,intoNumber:intoNumber,on: function(){return prefs.on;},available:available,settings:function(){return{on:prefs.on,pct:prefs.pct,bottom:prefs.bottom,inset:prefs.inset,mode:prefs.mode};},signature:signature};
if(window.addEventListener)window.addEventListener('load',function(){setTimeout(start,1000);},false);
else if(window.attachEvent)window.attachEvent('onload',function(){setTimeout(start,1000);});
else setTimeout(start,1200);
})();
</script>
