function topSelection(a){var sr=a.ActiveSelectionRange,out=[],i;for(i=1;i<=sr.Count;i++)out.push(sr.Item(i));return out;}
function rectOf(s,id){return {id:id,shape:s,w:Math.abs(Number(s.SizeWidth)),h:Math.abs(Number(s.SizeHeight))};}
function intersects(a,b){return !(b.x>=a.x+a.w||b.x+b.w<=a.x||b.y>=a.y+a.h||b.y+b.h<=a.y);}
function splitFree(f,p,out){var r=f.x+f.w,b=f.y+f.h,pr=p.x+p.w,pb=p.y+p.h;if(!intersects(f,p)){out.push(f);return;}if(p.x>f.x)out.push({x:f.x,y:f.y,w:p.x-f.x,h:f.h});if(pr<r)out.push({x:pr,y:f.y,w:r-pr,h:f.h});if(p.y>f.y)out.push({x:f.x,y:f.y,w:f.w,h:p.y-f.y});if(pb<b)out.push({x:f.x,y:pb,w:f.w,h:b-pb});}

function packWithOrder(items,W,H,gap,rot,orderFn){var sorted=items.slice(0),free=[{x:0,y:0,w:W,h:H}],place=[],i,j,k,it,opts,best,fr,o,sw,sh,area,shortv,newFree,q;sorted.sort(orderFn);for(i=0;i<sorted.length;i++){it=sorted[i];opts=[{w:it.w,h:it.h,ang:0}];if(rot!=='none'&&Math.abs(it.w-it.h)>0.01)opts.push({w:it.h,h:it.w,ang:90});best=null;for(j=0;j<free.length;j++){fr=free[j];for(k=0;k<opts.length;k++){o=opts[k];sw=o.w+gap;sh=o.h+gap;if(sw<=fr.w+0.001&&sh<=fr.h+0.001){area=(fr.w*fr.h)-(sw*sh);shortv=Math.min(fr.w-sw,fr.h-sh);if(!best||area<best.area-0.001||(Math.abs(area-best.area)<0.001&&shortv<best.shortv)){best={fi:j,x:fr.x,y:fr.y,w:sw,h:sh,ow:o.w,oh:o.h,ang:o.ang,area:area,shortv:shortv,item:it};}}}}if(!best)continue;place.push(best);newFree=[];for(q=0;q<free.length;q++)splitFree(free[q],best,newFree);free=pruneFree(newFree);}var usedBottom=0,usedRight=0,usedArea=0;for(i=0;i<place.length;i++){usedBottom=Math.max(usedBottom,place[i].y+place[i].oh);usedRight=Math.max(usedRight,place[i].x+place[i].ow);usedArea+=place[i].ow*place[i].oh;}return {place:place,count:place.length,usedBottom:usedBottom,usedRight:usedRight,usedArea:usedArea};}

function V76NestSelected(){var a,doc,oldUnit,opt=false,cmd=false,res=el('v76NestResult');try{saveV76Settings();a=corelApp();doc=a.ActiveDocument;var selected=topSelection(a);if(!selected.length)throw new Error(lang()==='vi'?'Chưa chọn đối tượng.':'No objects selected.');oldUnit=doc.Unit;doc.Unit=3;var W=nval('v76NestW',600),H=nval('v76NestH',1000),gap=nval('v76NestGap',5),mt=nval('v76MarginT',5),mb=nval('v76MarginB',5),ml=nval('v76MarginL',5),mr=nval('v76MarginR',5),usableW=W-ml-mr,usableH=H-mt-mb;if(W<=0||H<=0||gap<0||usableW<=0||usableH<=0)throw new Error(lang()==='vi'?'Khổ/lề không hợp lệ.':'Invalid area/margins.');var items=[],i;for(i=0;i<selected.length;i++)items.push(rectOf(selected[i],i));var plan=choosePack(items,usableW,usableH,gap,el('v76Rotate').value);doc.BeginCommandGroup('DHL Nameset Layout - Optimal Nesting');cmd=true;a.Optimization=true;opt=true;if(el('v76ResizePage').checked)a.ActivePage.SetSize(W,H);var page=a.ActivePage,left=Number(page.CenterX)-W/2+ml,top=Number(page.CenterY)+H/2-mt,p,sh;for(i=0;i<plan.place.length;i++){p=plan.place[i];sh=p.item.shape;if(p.ang)sh.Rotate(p.ang);sh.CenterX=left+p.x+p.ow/2;sh.CenterY=top-p.y-p.oh/2;}a.Optimization=false;opt=false;doc.Unit=oldUnit;doc.EndCommandGroup();cmd=false;try{a.ActiveWindow.Refresh();}catch(rx){}var pct=Math.round((plan.usedArea/(usableW*usableH))*1000)/10;res.setAttribute('data-used','1');res.innerHTML=fmt(plan.count===items.length?T('nestDone'):T('nestPartial'),{a:plan.count,b:items.length,p:pct});}catch(e){try{if(opt&&a)a.Optimization=false;}catch(x){}try{if(doc&&oldUnit!==undefined)doc.Unit=oldUnit;}catch(x2){}try{if(cmd&&doc)doc.EndCommandGroup();}catch(x3){}res.setAttribute('data-used','1');res.innerHTML=T('nestErr')+esc(e.message);}}

function V76CreateOutline(){var a,doc,oldUnit,opt=false,cmd=false,res=el('v76OutlineResult');try{saveV76Settings();a=corelApp();doc=a.ActiveDocument;var ss=topSelection(a);if(!ss.length)throw new Error(lang()==='vi'?'Chưa chọn ảnh/vector.':'No image/vector selected.');oldUnit=doc.Unit;doc.Unit=3;var off=nval('v76OutlineOffset',2),stroke=nval('v76OutlineStroke',0.2),out=el('v76OutlineOutput').value;if(off<0||stroke<=0)throw new Error(lang()==='vi'?'Thông số đường bao không hợp lệ.':'Invalid outline settings.');doc.BeginCommandGroup('DHL Nameset Layout - Image Outline');cmd=true;a.Optimization=true;opt=true;var i,base,cut,white,count=0;for(i=0;i<ss.length;i++){base=boundaryForShape(a,ss[i]);base=offsetBoundary(a,base,off);if(out==='white'||out==='both'){white=base.Duplicate();styleWhite(white,ss[i]);}if(out==='cut'||out==='both'){cut=base;styleCutline(cut,stroke);}else{try{base.Delete();}catch(dd){}}count++;}a.Optimization=false;opt=false;doc.Unit=oldUnit;doc.EndCommandGroup();cmd=false;try{a.ActiveWindow.Refresh();}catch(rx){}res.setAttribute('data-used','1');res.innerHTML=fmt(T('outlineDone'),{n:count});}catch(e){try{if(opt&&a)a.Optimization=false;}catch(x){}try{if(doc&&oldUnit!==undefined)doc.Unit=oldUnit;}catch(x2){}try{if(cmd&&doc)doc.EndCommandGroup();}catch(x3){}res.setAttribute('data-used','1');res.innerHTML=T('outlineErr')+esc(e.message);}}
