<style id="dhl-v832-safe-selection-style">
#v832Safety{border:1px solid #aaa;border-left:3px solid #333;border-radius:5px;padding:8px;margin:8px 0;background:#fff;color:#151515;font-size:11px;line-height:1.45}
#v832SafetyTitle{font-weight:800;margin-bottom:5px}
#v832Safety label{display:block;margin:5px 0;color:#151515!important;font-size:11px}
#v832Safety input[type=checkbox]{width:auto!important;height:auto!important;min-height:0!important;margin-right:5px!important}
#v832GroupBtn{min-height:31px!important;margin-top:5px;font-weight:800;width:100%}
#v832SafetyHint{font-size:10px!important;color:#333!important;margin-top:5px}
#v832SafetyError{font-size:11px!important;color:#860000!important;font-weight:700!important;margin-top:5px;white-space:normal}
</style>
<script id="dhl-v832-safe-selection" type="text/javascript">
(function(){
function E(id){return document.getElementById(id);}
function en(){try{return currentLang==='en';}catch(e){return false;}}
function msg(vi,english){return en()?english:vi;}
function number(id,d){var e=E(id),n=e?Number(e.value):d;return isFinite(n)?n:d;}
function selection(a){var s=a.ActiveSelectionRange,o=[],i;if(s)for(i=1;i<=s.Count;i++)o.push(s.Item(i));return o;}
function groupLike(s){try{return s.Shapes&&Number(s.Shapes.Count)>0;}catch(e){return false;}}
function allGroups(shapes){var i;for(i=0;i<shapes.length;i++)if(!groupLike(shapes[i]))return false;return true;}
function dims(s){return {w:Math.abs(Number(s.SizeWidth)),h:Math.abs(Number(s.SizeHeight))};}
function sourceTarget(s){
 var q=dims(s),w=number('v85Width',0)*10,h=number('v85Height',0)*10,locked=E('v85Lock')&&E('v85Lock').checked;
 if(w>0){h=locked?w*q.h/q.w:(h>0?h:q.h);q={w:w,h:h};}
 else if(!locked&&h>0)q={w:q.w,h:h};
 return q;
}
function fits(q,W,H){return(q.w<=W+.001&&q.h<=H+.001)||(q.h<=W+.001&&q.w<=H+.001);}
function preflight(a,shapes){
 var checkbox=E('v832AllowLoose'),allow=!!(checkbox&&checkbox.checked),w=number('v77NestW',58)*10,h=number('v77NestH',2000)*10,uw=w-(number('v77MarginL',0)+number('v77MarginR',0))*10,uh=h-(number('v77MarginT',0)+number('v77MarginB',0))*10,d=a.ActiveDocument,old=d.Unit,i,q,amount;
 if(!shapes.length)throw new Error(msg('Chưa chọn đối tượng.','No objects selected.'));
 if(uw<=0||uh<=0)throw new Error(msg('Khổ dàn hoặc lề không hợp lệ.','Invalid material dimensions or margins.'));
 if(shapes.length>1&&!allGroups(shapes)&&!allow){
  show(msg('Đang chọn '+shapes.length+' object RỜI. Tool sẽ tách chữ/số/logo nếu dàn ngay. Hãy bấm GOM VÙNG CHỌN → 1 GROUP; hoặc tích cho phép dàn object rời nếu đó thật sự là các sản phẩm độc lập.','You selected '+shapes.length+' LOOSE objects. Packing now would separate text/numbers/logos. GROUP the selection first, or explicitly permit individual-object packing.'));
  throw new Error(msg('ĐÃ CHẶN DÀN để không làm vỡ bộ nameset.','NESTING BLOCKED to protect the nameset.'));
 }
 try{
  d.Unit=3;
  for(i=0;i<shapes.length;i++){
   q=shapes.length===1?sourceTarget(shapes[i]):dims(shapes[i]);
   if(!(q.w>0&&q.h>0))throw new Error(msg('Object có kích thước không hợp lệ.','An object has invalid dimensions.'));
   if(!fits(q,uw,uh)){
    amount=Math.round(Math.min(q.w,q.h)/10*100)/100;
    throw new Error(msg('Object '+(i+1)+' không vừa khổ: cạnh ngắn nhất '+amount+' cm, bề ngang in '+Math.round(uw/10*100)/100+' cm. Cần đổi khổ hoặc giảm kích thước mẫu; tool KHÔNG tự cắt/xé hay thu nhỏ bản in.','Object '+(i+1)+' does not fit the material: shortest side '+amount+' cm, available width '+Math.round(uw/10*100)/100+' cm. Change material size or explicitly resize; the tool will not split/scale it silently.'));
   }
  }
 }finally{try{d.Unit=old;}catch(restore){}}
 show('');
 return true;
}
function show(s){var b=E('v832SafetyError');if(b)b.innerHTML=s;}
function groupSelected(){
 var a=null,d=null,old=null,cmd=false,sr=null,g=null;
 try{
  if(window.external&&window.external.Application)a=window.external.Application;
  else if(typeof corelApp==='function')a=corelApp();
  if(!a)throw new Error(msg('Không kết nối CorelDRAW.','Cannot connect to CorelDRAW.'));
  var ss=selection(a);
  if(ss.length<2)throw new Error(msg('Chọn từ 2 object trở lên rồi bấm gom.','Select at least two objects to group.'));
  d=a.ActiveDocument;old=d.Unit;
  d.BeginCommandGroup('DHL - Group selected nameset elements');cmd=true;
  sr=a.CreateShapeRange();for(var i=0;i<ss.length;i++)sr.Add(ss[i]);
  g=sr.Group();try{g.Name='DHL_NAMESET_GROUP';}catch(n){}
  d.EndCommandGroup();cmd=false;g.CreateSelection();
  show(msg('✓ Đã gom '+ss.length+' chi tiết thành một Group. Nếu Group không vừa khổ, nhập Ngang mục kích thước để chủ động thu nhỏ hoặc chọn khổ lớn hơn.','✓ Grouped '+ss.length+' elements. If the group is too wide, explicitly resize it or select wider material.'));
  if(E('v832AllowLoose'))E('v832AllowLoose').checked=false;
  try{a.ActiveWindow.Refresh();}catch(r){}
 }catch(e){
  try{if(cmd&&d){d.EndCommandGroup();d.Undo();}}catch(u){}
  show(msg('Không gom được: ','Could not group: ')+String(e.message||e));
 }finally{try{if(d&&old!==null)d.Unit=old;}catch(r2){}}
}
function relabel(){
 var t=E('v832SafetyTitle'),l=E('v832LooseLabel'),b=E('v832GroupBtn'),h=E('v832SafetyHint');
 if(t)t.innerHTML=msg('BẢO VỆ BỘ NAMESET','PROTECT NAMESET GROUPS');
 if(l)l.innerHTML=msg('Tôi muốn dàn từng object rời (chữ/logo/số có thể tách nhau)','I want to pack individual loose objects (names/logos/numbers may separate)');
 if(b)b.innerHTML=msg('GOM VÙNG CHỌN → 1 GROUP','GROUP SELECTION → 1 OBJECT');
 if(h)h.innerHTML=msg('Mặc định tool chỉ dàn nhiều Group độc lập. Các chi tiết rời phải được gom thành 1 Group trước khi nhân bản/xếp.','By default, multiple independent groups are safe. Loose components must be grouped before copying/nesting.');
}
function install(){
 var card=E('v77NestCard'),prep=E('v85Prep'),box,label,input,title,btn,hint,err;
 if(!card){setTimeout(install,300);return;}
 if(E('v832Safety')){relabel();return;}
 box=document.createElement('div');box.id='v832Safety';
 title=document.createElement('div');title.id='v832SafetyTitle';box.appendChild(title);
 label=document.createElement('label');input=document.createElement('input');input.id='v832AllowLoose';input.type='checkbox';input.checked=false;label.appendChild(input);
 var l=document.createElement('span');l.id='v832LooseLabel';label.appendChild(l);box.appendChild(label);
 btn=document.createElement('button');btn.type='button';btn.id='v832GroupBtn';btn.onclick=groupSelected;box.appendChild(btn);
 hint=document.createElement('div');hint.id='v832SafetyHint';box.appendChild(hint);
 err=document.createElement('div');err.id='v832SafetyError';box.appendChild(err);
 if(prep&&prep.parentNode)prep.parentNode.insertBefore(box,prep);
 else {var btnNest=E('v77NestBtn');if(btnNest&&btnNest.parentNode)card.insertBefore(box,btnNest.parentNode);else card.appendChild(box);}
 relabel();
}
window.DHLNestPreflight=preflight;
if(window.addEventListener)window.addEventListener('load',function(){setTimeout(install,500);},false);
else if(window.attachEvent)window.attachEvent('onload',function(){setTimeout(install,500);});
else setTimeout(install,700);
})();
</script>
