<title>Nameset A3</title>
<!-- DHL_UI_VERSION=7.0 -->
<style>
*{box-sizing:border-box!important}
html,body{margin:0!important;min-height:100%!important;background:#f3f5f7!important;color:#24303a!important;font:11px "Segoe UI",Arial,sans-serif!important;line-height:1.35!important}
body{padding:7px!important;background:#f3f5f7!important}
b,strong{background:transparent!important;color:inherit!important}
.card{background:#fff!important;border:1px solid #d8dee5!important;border-radius:7px!important;padding:9px!important;margin:0 0 8px!important;box-shadow:none!important}
.top{display:table!important;width:100%!important;table-layout:auto!important;margin-bottom:7px!important;background:#fff!important}

.title{font-size:15px!important;font-weight:800!important;color:#c92d3b!important;white-space:nowrap!important;background:#fff!important}

.langwrap{display:inline-block!important;vertical-align:middle!important;margin-right:4px!important;border:1px solid #cfd8df!important;border-radius:5px!important;overflow:hidden!important;background:#fff!important}
.langbtn{width:auto!important;min-width:27px!important;padding:5px 6px!important;margin:0!important;background:#fff!important;color:#475467!important;font:700 9px "Segoe UI",Arial,sans-serif!important;border:0!important;border-radius:0!important;white-space:nowrap!important}
.langbtn+ .langbtn{border-left:1px solid #d8dee5!important}
.langbtn.active{background:#344054!important;color:#fff!important}
.gitbtn{display:inline-block!important;vertical-align:middle!important;width:auto!important;padding:5px 8px!important;margin:0!important;background:#475467!important;color:#fff!important;font:700 10px "Segoe UI",Arial,sans-serif!important;border-radius:5px!important;white-space:nowrap!important;border:0!important}
.gitbtn:hover{background:#344054!important}
.status,.note{border:1px solid #d6dde3!important;border-left:4px solid #98a2ad!important;border-radius:5px!important;padding:6px 8px!important;background:#f8fafb!important;line-height:1.35!important;margin:6px 0!important;font-size:10px!important;min-height:28px!important;color:#344054!important;white-space:normal!important;word-wrap:break-word!important}
.status.ok,.note.ok{border-left-color:#2f9e5b!important;background:#f0faf4!important;color:#1f6b3e!important}
.status.bad,.note.bad{border-left-color:#d9414f!important;background:#fff4f5!important;color:#9b2731!important}
.label{display:block!important;font-weight:700!important;margin:7px 0 3px!important;color:#344054!important;font-size:11px!important;background:#fff!important;padding:0!important;line-height:1.3!important}
.mini{display:block!important;font-size:9px!important;color:#667085!important;margin:0 0 3px!important;background:#fff!important;padding:0!important;line-height:1.25!important}
select,input[type=file],input[type=number]{width:100%!important;min-height:30px!important;padding:4px 6px!important;border:1px solid #c7d0d9!important;border-radius:5px!important;background:#fff!important;color:#17212b!important;font:11px "Segoe UI",Arial,sans-serif!important;box-shadow:none!important}
select:focus,input[type=file]:focus,input[type=number]:focus{border-color:#8da2b3!important;outline:none!important}
input[type=file]{height:auto!important;min-height:31px!important;padding:4px!important}
.radios{display:block!important;background:#f8fafb!important;border:1px solid #dce2e7!important;border-radius:5px!important;padding:7px 8px!important;line-height:1.5!important;font-size:10px!important;color:#344054!important;white-space:normal!important}
.radios label{display:inline-block!important;margin:0 14px 0 0!important;white-space:nowrap!important;color:#344054!important;background:transparent!important;line-height:1.5!important}
.radios input{vertical-align:middle!important;margin:0 4px 0 0!important;width:auto!important;height:auto!important}
.check{display:block!important;background:#fff7f8!important;border:1px solid #f0d0d4!important;border-radius:5px!important;padding:7px 8px!important;margin-top:6px!important;cursor:pointer!important;font-size:10px!important;color:#344054!important;line-height:1.35!important;white-space:normal!important}
.check input{vertical-align:middle!important;margin:0 5px 0 0!important;width:auto!important;height:auto!important}
button{width:100%!important;border:0!important;border-radius:5px!important;padding:7px 5px!important;font:700 11px "Segoe UI",Arial,sans-serif!important;cursor:pointer!important;line-height:1.25!important}
.buttons{display:table!important;width:100%!important;table-layout:fixed!important;margin-top:7px!important;border-collapse:separate!important;border-spacing:0!important}
.buttons>div{display:table-cell!important;padding-right:5px!important;background:transparent!important}
.buttons>div:last-child{padding-right:0!important}
#run{background:#cf3140!important;color:#fff!important}
#run:hover{background:#b92937!important}
#undo{background:#eef1f4!important;color:#344054!important;border:1px solid #d7dde3!important}
#undo:hover{background:#e2e7eb!important}
.excel{border-top:4px solid #2f9557!important;background:#fff!important}
.sectionbar{display:table!important;width:100%!important;table-layout:auto!important;background:#f0f9f4!important;border:1px solid #d9efe2!important;border-radius:5px!important;margin:0 0 7px!important}
.sectionbar>div{display:table-cell!important;vertical-align:middle!important;background:transparent!important;padding:6px 7px!important}
.sectionname{font-size:13px!important;font-weight:800!important;color:#157347!important;white-space:nowrap!important}
.sectionaction{text-align:right!important;width:1%!important;white-space:nowrap!important}
.collapsebtn{width:auto!important;padding:4px 7px!important;background:#fff!important;color:#475467!important;border:1px solid #cfd8df!important;font-size:9px!important;white-space:nowrap!important}
.collapsebtn:hover{background:#f5f7f9!important}
.muted{font-size:9px!important;color:#667085!important;line-height:1.35!important;margin-top:4px!important;background:#fff!important;padding:0!important;white-space:normal!important;word-wrap:break-word!important}
.quickbar{display:table!important;width:100%!important;table-layout:fixed!important;margin-top:5px!important;border-collapse:separate!important;border-spacing:0!important}
.quickbar>div{display:table-cell!important;padding-right:4px!important;background:transparent!important}
.quickbar>div:last-child{padding-right:0!important}
.quickbtn{padding:6px 3px!important;background:#f1f4f6!important;color:#344054!important;border:1px solid #d4dce3!important;font-size:9px!important}
.quickbtn:hover{background:#e8edf1!important}
.quickbtn.active{background:#eaf7ef!important;color:#1f6b3e!important;border-color:#b9dfc8!important}
.params{display:table!important;width:100%!important;table-layout:fixed!important;margin-top:6px!important;border-collapse:separate!important;border-spacing:0!important}
.params>div{display:table-cell!important;vertical-align:top!important;padding-right:5px!important;background:#fff!important}
.params>div:last-child{padding-right:0!important}
.params .mini{margin-bottom:2px!important}
.toolsrow{display:table!important;width:100%!important;table-layout:fixed!important;margin-top:6px!important;border-collapse:separate!important;border-spacing:0!important}
.toolsrow>div{display:table-cell!important;padding-right:5px!important;background:transparent!important}
.toolsrow>div:last-child{padding-right:0!important}
.smallbtn{padding:6px 3px!important;background:#f4f6f8!important;color:#344054!important;border:1px solid #d6dde3!important;font-size:9px!important}
.smallbtn:hover{background:#e9edf1!important}
#excelRun{background:#2f9557!important;color:#fff!important;margin-top:7px!important}
#excelRun:hover{background:#287f4b!important}
.hidden{display:none!important}
.saved{font-size:9px!important;color:#2f9557!important;margin-top:4px!important;min-height:12px!important;background:#fff!important;line-height:1.25!important}
.footer{font-size:9px!important;color:#7b8792!important;text-align:center!important;padding:3px 2px 2px!important;background:#f3f5f7!important;border:0!important}

<body>
<div class="card">
  <div class="top">
    <div><span class="title">NAMESET A3</span><span class="ver">v7.0</span></div>
    <div class="topactions">
      <span class="langwrap"><button id="langVI" class="langbtn" type="button" onclick="setLanguage('vi')">VI</button><button id="langEN" class="langbtn" type="button" onclick="setLanguage('en')">EN</button></span>
      <button class="gitbtn" id="reloadGit" type="button" onclick="reloadFromGit()" data-i18n="reload">↻ CẬP NHẬT</button>
    </div>
  </div>

  <div id="selectionStatus" class="status">Đang đọc vùng chọn…</div>

  <label class="label" for="mode" data-i18n="groupMode">CHẾ ĐỘ NHẬN BỘ</label>
  <select id="mode">
    <option value="auto" data-i18n="modeAuto">Tự ghép: tên trên + số dưới</option>
    <option value="group" data-i18n="modeGroup">Mỗi Group = một nameset</option>
  </select>

  <span class="label" data-i18n="a3Layout">KHỔ A3</span>
  <div class="radios">
    <label><input type="radio" name="orientation" value="portrait" checked="checked"/><span data-i18n="portrait"> Dọc 297×420</span></label>
    <label><input type="radio" name="orientation" value="landscape"/><span data-i18n="landscape"> Ngang 420×297</span></label>
  </div>

  <label class="check" for="mirror"><input id="mirror" type="checkbox"/><b data-i18n="mirror">Lật gương ngang</b></label>

  <div class="buttons">
    <div><button id="run" type="button" data-i18n="createA3">TẠO TRANG A3</button></div>
    <div><button id="undo" type="button" data-i18n="undo">HOÀN TÁC</button></div>
  </div>
  <div id="result" class="note">A3 bắt đầu từ Page 1. Trang nguồn giữ ở cuối.</div>
</div>

<div class="card excel">
  <div class="sectionbar">
    <div class="sectionname" data-i18n="fromExcel">TỪ EXCEL</div>
    <div class="sectionaction"><button id="toggleExcel" class="collapsebtn" type="button" onclick="toggleExcelPanel()">THU GỌN</button></div>
  </div>

  <div id="excelBody">
    <label class="label" for="excelFile" data-i18n="sourceFile">FILE DỮ LIỆU</label>
    <input id="excelFile" type="file" accept=".xlsx,.xls,.csv,.txt"/>
    <div class="muted" id="columnHint">Cột: <b>Họ tên</b> | <b>Số áo</b> · mỗi dòng = một nameset.</div>

    <span class="label" data-i18n="sheetPreset">KHỔ IN NHANH</span>
    <div class="quickbar">
      <div><button class="quickbtn" type="button" onclick="setPreset(580,2000,10,this)">580×2000</button></div>
      <div><button class="quickbtn" type="button" onclick="setPreset(600,2000,10,this)">600×2000</button></div>
      <div><button class="quickbtn" type="button" onclick="setPreset(297,420,8,this)">A3</button></div>
    </div>

    <div class="params">
      <div><span class="mini" data-i18n="width">Rộng (mm)</span><input id="sheetWidth" type="number" value="580" min="50"/></div>
      <div><span class="mini" data-i18n="height">Cao (mm)</span><input id="sheetHeight" type="number" value="2000" min="50"/></div>
      <div><span class="mini" data-i18n="gap">Cách (mm)</span><input id="sheetGap" type="number" value="10" min="0"/></div>
    </div>

    <label class="check" for="excelMirror"><input id="excelMirror" type="checkbox"/><b data-i18n="mirrorSheet">Lật gương cả trang in</b></label>

    <div class="toolsrow">
      <div><button class="smallbtn" type="button" onclick="resetSettings()" data-i18n="reset">ĐẶT LẠI</button></div>
      <div><button class="smallbtn" type="button" onclick="saveSettings(true)" data-i18n="save">LƯU THÔNG SỐ</button></div>
    </div>
    <div id="savedState" class="saved"></div>

    <button id="excelRun" type="button" data-i18n="buildExcel">ĐỌC EXCEL + DÀN TRANG</button>
    <div id="excelResult" class="note">Chọn 1 bộ mẫu tên + số còn là Text trước khi chạy.</div>
  </div>
</div>

<div class="footer" id="footerText">DHL Nameset A3 · v7.0 · VI / EN</div>

<script src="main.js" type="text/javascript"></script>
<script type="text/javascript">
function byId(id){return document.getElementById(id);}
var currentLang='vi';

var I18N={
  vi:{reload:'↻ CẬP NHẬT',groupMode:'CHẾ ĐỘ NHẬN BỘ',modeAuto:'Tự ghép: tên trên + số dưới',modeGroup:'Mỗi Group = một nameset',a3Layout:'KHỔ A3',portrait:' Dọc 297×420',landscape:' Ngang 420×297',mirror:'Lật gương ngang',createA3:'TẠO TRANG A3',undo:'HOÀN TÁC',fromExcel:'TỪ EXCEL',sourceFile:'FILE DỮ LIỆU',sheetPreset:'KHỔ IN NHANH',width:'Rộng (mm)',height:'Cao (mm)',gap:'Cách (mm)',mirrorSheet:'Lật gương cả trang in',reset:'ĐẶT LẠI',save:'LƯU THÔNG SỐ',buildExcel:'ĐỌC EXCEL + DÀN TRANG',hide:'THU GỌN',show:'MỞ RỘNG',saved:'✓ Đã lưu thông số.',columnHint:'Cột: <b>Họ tên</b> | <b>Số áo</b> · mỗi dòng = một nameset.',resultDefault:'A3 bắt đầu từ Page 1. Trang nguồn giữ ở cuối.',excelDefault:'Chọn 1 bộ mẫu tên + số còn là Text trước khi chạy.',loading:'ĐANG TẢI…',reloadFail:'Cập nhật thất bại. Mã lỗi: ',reloadError:'Không cập nhật được: '},
  en:{reload:'↻ RELOAD',groupMode:'GROUPING MODE',modeAuto:'Auto: name above + number below',modeGroup:'Each Group = one nameset',a3Layout:'A3 LAYOUT',portrait:' Portrait 297×420',landscape:' Landscape 420×297',mirror:'Mirror horizontally',createA3:'CREATE A3',undo:'UNDO',fromExcel:'FROM EXCEL',sourceFile:'SOURCE FILE',sheetPreset:'SHEET PRESET',width:'W (mm)',height:'H (mm)',gap:'Gap',mirrorSheet:'Mirror output sheet',reset:'RESET',save:'SAVE SETTINGS',buildExcel:'BUILD FROM EXCEL',hide:'HIDE',show:'SHOW',saved:'✓ Settings saved.',columnHint:'Columns: <b>Name</b> | <b>Number</b> · one row = one nameset.',resultDefault:'New A3 pages start at Page 1. Source page stays last.',excelDefault:'Select one sample nameset with editable Text before running.',loading:'LOADING…',reloadFail:'Reload failed. Error code: ',reloadError:'Reload failed: '}
};

var runtimePairs=[
  ['Chưa mở file CorelDRAW.','No CorelDRAW document open.'],
  ['Chưa chọn tên số nào.','No nameset selected.'],
  ['Đang đọc vùng chọn…','Reading selection...'],
  ['Đã hoàn tác lượt vừa tạo.','Last action undone.'],
  ['Không hoàn tác được:','Undo failed:'],
  ['Hãy chọn file Excel hoặc CSV.','Choose an Excel or CSV file.'],
  ['Không tìm thấy cột Tên và Số trong hàng tiêu đề.','Could not find Name and Number columns in the header row.'],
  ['File không có dòng dữ liệu hợp lệ.','No valid data rows found.'],
  ['Khổ dàn hoặc khoảng cách không hợp lệ.','Invalid sheet size or gap.'],
  ['Hãy chọn đúng một bộ mẫu gồm tên ở trên và số ở dưới.','Select exactly one sample: name above and number below.'],
  ['Bộ mẫu phải là chữ Text, chưa Convert to Curves.','Sample must remain editable Text, not converted to curves.'],
  ['Nếu Excel không đọc được, hãy lưu file thành CSV UTF-8 rồi chọn lại.','If Excel cannot be read, save it as UTF-8 CSV and try again.'],
  ['Hãy quét chọn các bộ tên số trước.','Select the nameset objects first.'],
  ['Đã chọn','Selected'],
  ['đối tượng','objects'],
  ['Đã chọn 1 Group lớn','Selected 1 large Group'],
  ['bên trong có','containing'],
  ['Tool ghép được','Tool matched'],
  ['bộ nhưng còn','sets, but'],
  ['đối tượng chưa khớp','objects unmatched'],
  ['Hãy Group từng bộ rồi chọn chế độ ‘Mỗi Group’.','Group each nameset and choose “Each Group”.'],
  ['Lỗi tại bước','Error at step'],
  ['Lỗi:','Error:'],
  ['Đã tạo xong','Created'],
  ['Đã tạo và dàn','Created and arranged'],
  ['trang A3 từ Page 1','A3 pages from Page 1'],
  ['bộ nameset','namesets'],
  ['trang nguồn được giữ ở cuối','source page kept last'],
  ['Đã lật gương ngang','mirrored horizontally'],
  ['không lật gương','not mirrored'],
  ['Khổ hiện tại chỉ xếp được','Current sheet only fits'],
  ['Hãy tăng chiều cao trang.','Increase sheet height.']
];

function replaceAllText(s,from,to){
  if(!s){return s;}
  while(s.indexOf(from)>=0){s=s.replace(from,to);}
  return s;
}

function translateRuntimeString(s,lang){
  var i;
  if(!s){return s;}
  for(i=0;i<runtimePairs.length;i++){
    if(lang==='en'){s=replaceAllText(s,runtimePairs[i][0],runtimePairs[i][1]);}
    else{s=replaceAllText(s,runtimePairs[i][1],runtimePairs[i][0]);}
  }
  return s;
}

function translateRuntime(){
  var ids=['selectionStatus','result','excelResult'],i,node,out;
  for(i=0;i<ids.length;i++){
    node=byId(ids[i]);
    if(node){
      out=translateRuntimeString(node.innerHTML,currentLang);
      if(out!==node.innerHTML){node.innerHTML=out;}
    }
  }
}

function setLanguage(lang){
  var nodes,i,key,dict=I18N[lang]||I18N.vi;
  currentLang=(lang==='en')?'en':'vi';
  try{window.localStorage.setItem('dhl_nameset_a3_lang',currentLang);}catch(ignoreStore){}
  document.documentElement.lang=currentLang;
  nodes=document.getElementsByTagName('*');
  for(i=0;i<nodes.length;i++){
    key=nodes[i].getAttribute?nodes[i].getAttribute('data-i18n'):null;
    if(key&&dict[key]!==undefined){nodes[i].innerHTML=dict[key];}
  }
  byId('columnHint').innerHTML=dict.columnHint;
  byId('langVI').className='langbtn'+(currentLang==='vi'?' active':'');
  byId('langEN').className='langbtn'+(currentLang==='en'?' active':'');
  updateCollapseText();
  translateRuntime();
}

function loadLanguage(){
  var lang='vi';
  try{lang=window.localStorage.getItem('dhl_nameset_a3_lang')||'vi';}catch(ignore){}
  setLanguage(lang==='en'?'en':'vi');
}

function setPreset(w,h,g,btn){
  byId('sheetWidth').value=w;byId('sheetHeight').value=h;byId('sheetGap').value=g;
  var list=document.getElementsByTagName('button'),i;
  for(i=0;i<list.length;i++){
    if((' '+list[i].className+' ').indexOf(' quickbtn ')>=0){list[i].className='quickbtn';}
  }
  if(btn){btn.className='quickbtn active';}
  saveSettings(false);
}

function resetSettings(){
  byId('sheetWidth').value=580;byId('sheetHeight').value=2000;byId('sheetGap').value=10;
  byId('excelMirror').checked=false;byId('mirror').checked=false;byId('mode').value='auto';
  var radios=document.getElementsByName('orientation'),i;
  for(i=0;i<radios.length;i++){radios[i].checked=(radios[i].value==='portrait');}
  saveSettings(true);
}

function saveSettings(show){
  try{
    var radios=document.getElementsByName('orientation'),ori='portrait',i;
    for(i=0;i<radios.length;i++){if(radios[i].checked){ori=radios[i].value;}}
    var data=[byId('sheetWidth').value,byId('sheetHeight').value,byId('sheetGap').value,byId('excelMirror').checked?'1':'0',byId('mirror').checked?'1':'0',byId('mode').value,ori].join('|');
    window.localStorage.setItem('dhl_nameset_a3_settings',data);
    if(show){
      byId('savedState').innerHTML=I18N[currentLang].saved;
      setTimeout(function(){byId('savedState').innerHTML='';},1800);
    }
  }catch(ignore){}
}

function loadSettings(){
  try{
    var data=window.localStorage.getItem('dhl_nameset_a3_settings');if(!data){return;}
    var p=data.split('|');if(p.length<7){return;}
    byId('sheetWidth').value=p[0];byId('sheetHeight').value=p[1];byId('sheetGap').value=p[2];
    byId('excelMirror').checked=(p[3]==='1');byId('mirror').checked=(p[4]==='1');byId('mode').value=p[5];
    var radios=document.getElementsByName('orientation'),i;
    for(i=0;i<radios.length;i++){radios[i].checked=(radios[i].value===p[6]);}
  }catch(ignore){}
}

function updateCollapseText(){
  var body=byId('excelBody'),btn=byId('toggleExcel');
  if(!body||!btn){return;}
  btn.innerHTML=(body.className==='hidden')?I18N[currentLang].show:I18N[currentLang].hide;
}

function toggleExcelPanel(){
  var body=byId('excelBody');
  body.className=(body.className==='hidden')?'':'hidden';
  updateCollapseText();
}

function hookAutoSave(){
  var ids=['sheetWidth','sheetHeight','sheetGap','excelMirror','mirror','mode'],i,el;
  for(i=0;i<ids.length;i++){
    el=byId(ids[i]);
    if(el){el.onchange=function(){saveSettings(false);};}
  }
  var radios=document.getElementsByName('orientation');
  for(i=0;i<radios.length;i++){radios[i].onclick=function(){saveSettings(false);};}
}

function reloadFromGit(){
  var btn=byId('reloadGit'),dict=I18N[currentLang];
  try{
    if(btn){btn.disabled=true;btn.innerHTML=dict.loading;}
    var sh=new ActiveXObject('WScript.Shell');
    var stamp=(new Date()).getTime();
    var ps="powershell -NoProfile -ExecutionPolicy Bypass -Command \"$u='https://raw.githubusercontent.com/dinhloi116-hue/dhlstores/main/tools/tach-nameset-a3/CAI_TOOL_TACH_NAMESET_A3.bat?v="+stamp+"';$p=Join-Path $env:TEMP 'CAI_TOOL_TACH_NAMESET_A3_LATEST.bat';try{Invoke-WebRequest -UseBasicParsing -Uri $u -OutFile $p;cmd.exe /d /c ('\"'+$p+'\" --reload-ui');exit $LASTEXITCODE}catch{Write-Host $_.Exception.Message;exit 1}\"";
    var rc=sh.Run(ps,1,true);
    if(rc===0){
      var base=window.location.href.split('?')[0];
      window.location.replace(base+'?v='+(new Date()).getTime());
    }else{
      alert(dict.reloadFail+rc);
    }
  }catch(e){
    alert(dict.reloadError+e.message);
  }finally{
    if(btn){btn.disabled=false;btn.innerHTML=I18N[currentLang].reload;}
  }
}

try{
  loadSettings();
  hookAutoSave();
  loadLanguage();
  translateRuntime();
  setInterval(translateRuntime,700);
}catch(ignoreInit){}
</script>
