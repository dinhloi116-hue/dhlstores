<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta http-equiv="MSThemeCompatible" content="yes" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Tách Nameset A3</title>
<!-- DHL_UI_VERSION=6.8 -->
<style>
*{box-sizing:border-box!important}
html,body{margin:0!important;min-height:100%!important;background:#f3f5f7!important;color:#24303a!important;font:11px "Segoe UI",Arial,sans-serif!important}
body{padding:6px!important;background:#f3f5f7!important}
.card{background:#ffffff!important;border:1px solid #d9dfe5!important;border-radius:7px!important;padding:8px!important;margin:0 0 7px!important;box-shadow:none!important}
.top{display:table!important;width:100%!important;table-layout:auto!important;margin-bottom:6px!important;background:#ffffff!important}
.top>div{display:table-cell!important;vertical-align:middle!important;background:#ffffff!important}
.title{font-size:15px!important;font-weight:800!important;color:#c62836!important;white-space:nowrap!important;background:#ffffff!important}
.ver{font-size:9px!important;color:#7b8792!important;margin-left:4px!important;background:#ffffff!important}
.gitcell{text-align:right!important;width:1%!important;white-space:nowrap!important;background:#ffffff!important}
.gitbtn{width:auto!important;padding:5px 8px!important;margin:0!important;background:#475467!important;color:#ffffff!important;font:700 10px "Segoe UI",Arial,sans-serif!important;border-radius:5px!important;white-space:nowrap!important;border:0!important}
.gitbtn:hover{background:#344054!important}
.section-title{font-size:13px!important;font-weight:800!important;margin:0 0 6px!important;color:#157347!important;background:#f0f9f4!important;border:1px solid #d9efe2!important;border-radius:5px!important;padding:6px 7px!important;line-height:1.2!important;overflow:hidden!important}
.status,.note{border:1px solid #d6dde3!important;border-left:4px solid #98a2ad!important;border-radius:5px!important;padding:6px 7px!important;background:#f8fafb!important;line-height:1.3!important;margin:5px 0!important;font-size:10px!important;min-height:26px!important;color:#344054!important}
.status.ok,.note.ok{border-left-color:#2f9e5b!important;background:#f0faf4!important;color:#1f6b3e!important}
.status.bad,.note.bad{border-left-color:#d9414f!important;background:#fff4f5!important;color:#9b2731!important}
.row{display:table!important;width:100%!important;table-layout:fixed!important;margin-top:5px!important;background:transparent!important}
.cell{display:table-cell!important;vertical-align:top!important;padding-right:5px!important;background:transparent!important}
.cell:last-child{padding-right:0!important}
.label{display:block!important;font-weight:700!important;margin:0 0 3px!important;color:#344054!important;font-size:11px!important;background:#ffffff!important;padding:0!important}
.mini{display:block!important;font-size:9px!important;color:#667085!important;margin-bottom:2px!important;background:#ffffff!important;padding:0!important}
select,input[type=file],input[type=number]{width:100%!important;min-height:28px!important;padding:4px 6px!important;border:1px solid #c7d0d9!important;border-radius:5px!important;background:#ffffff!important;color:#17212b!important;font:11px "Segoe UI",Arial,sans-serif!important;box-shadow:none!important}
select:focus,input[type=file]:focus,input[type=number]:focus{border-color:#8da2b3!important;outline:none!important}
input[type=file]{height:auto!important;min-height:29px!important}
.radios{background:#f8fafb!important;border:1px solid #dce2e7!important;border-radius:5px!important;padding:6px 7px!important;line-height:1.45!important;font-size:10px!important;white-space:nowrap!important;color:#344054!important}
.radios label{margin-right:9px!important;white-space:nowrap!important;color:#344054!important;background:transparent!important}
.check{display:block!important;background:#fff7f8!important;border:1px solid #f0d0d4!important;border-radius:5px!important;padding:6px 7px!important;margin-top:5px!important;cursor:pointer!important;font-size:10px!important;color:#344054!important}
.check b{color:#344054!important;background:transparent!important}
.check input{vertical-align:middle!important;margin:0 4px 0 0!important}
button{width:100%!important;border:0!important;border-radius:5px!important;padding:7px 5px!important;font:700 11px "Segoe UI",Arial,sans-serif!important;cursor:pointer!important}
.buttons{display:table!important;width:100%!important;table-layout:fixed!important;margin-top:6px!important;background:transparent!important}
.buttons>div{display:table-cell!important;padding-right:5px!important;background:transparent!important}
.buttons>div:last-child{padding-right:0!important}
#run{background:#cf3140!important;color:#ffffff!important}
#run:hover{background:#b92937!important}
#undo{background:#eef1f4!important;color:#344054!important;border:1px solid #d7dde3!important}
#undo:hover{background:#e2e7eb!important}
#excelRun{background:#2f9557!important;color:#ffffff!important;margin-top:6px!important}
#excelRun:hover{background:#287f4b!important}
.excel{border-top:4px solid #2f9557!important;background:#ffffff!important}
.muted{font-size:9px!important;color:#667085!important;line-height:1.3!important;margin-top:3px!important;background:#ffffff!important;padding:0!important}
.footer{font-size:9px!important;color:#7b8792!important;text-align:center!important;padding:3px 2px 2px!important;background:#f3f5f7!important;border:0!important}
.quickbar{display:table!important;width:100%!important;table-layout:fixed!important;margin-top:5px!important;background:transparent!important}
.quickbar>div{display:table-cell!important;padding-right:4px!important;background:transparent!important}.quickbar>div:last-child{padding-right:0!important}
.quickbtn{padding:6px 3px!important;background:#f1f4f6!important;color:#344054!important;border:1px solid #d4dce3!important;font-size:9px!important}
.quickbtn:hover{background:#e8edf1!important}
.quickbtn.active{background:#eaf7ef!important;color:#1f6b3e!important;border-color:#b9dfc8!important}
.toolsrow{display:table!important;width:100%!important;table-layout:fixed!important;margin-top:5px!important;background:transparent!important}
.toolsrow>div{display:table-cell!important;padding-right:4px!important;background:transparent!important}.toolsrow>div:last-child{padding-right:0!important}
.smallbtn{padding:6px 3px!important;background:#f4f6f8!important;color:#344054!important;border:1px solid #d6dde3!important;font-size:9px!important}
.smallbtn:hover{background:#e9edf1!important}
.collapsebtn{width:auto!important;padding:4px 7px!important;background:#ffffff!important;color:#475467!important;border:1px solid #cfd8df!important;font-size:9px!important;float:right!important}
.collapsebtn:hover{background:#f5f7f9!important}
.hidden{display:none!important}
.saved{font-size:9px!important;color:#2f9557!important;margin-top:3px!important;min-height:12px!important;background:#ffffff!important}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div><span class="title">TÁCH NAMESET A3</span><span class="ver">v6.8</span></div>
    <div class="gitcell"><button class="gitbtn" id="reloadGit" type="button" onclick="reloadFromGit()">↻ RELOAD GIT</button></div>
  </div>
  <div id="selectionStatus" class="status">Đang đọc vùng chọn…</div>
  <label class="label" for="mode">Nhận từng bộ</label>
  <select id="mode">
    <option value="auto">Tự ghép tên trên + số dưới</option>
    <option value="group">Mỗi Group là một bộ</option>
  </select>
  <div class="row">
    <div class="cell">
      <span class="label">Giấy A3</span>
      <div class="radios">
        <label><input type="radio" name="orientation" value="portrait" checked="checked"/> Dọc 297×420</label>
        <label><input type="radio" name="orientation" value="landscape"/> Ngang 420×297</label>
      </div>
    </div>
    <div class="cell">
      <span class="label">Tùy chọn</span>
      <label class="check" for="mirror" style="margin-top:0!important"><input id="mirror" type="checkbox"/><b>Lật gương ngang</b></label>
    </div>
  </div>
  <div class="buttons"><div><button id="run" type="button">TẠO TRANG A3</button></div><div><button id="undo" type="button">HOÀN TÁC</button></div></div>
  <div id="result" class="note">A3 từ Page 1 · trang nguồn giữ ở cuối.</div>
</div>

<div class="card excel">
  <div class="section-title">NAMESET TỪ EXCEL <button id="toggleExcel" class="collapsebtn" type="button" onclick="toggleExcelPanel()">Thu gọn</button></div>
  <div id="excelBody">
    <label class="label" for="excelFile">Excel / CSV / TXT</label>
    <input id="excelFile" type="file" accept=".xlsx,.xls,.csv,.txt"/>
    <div class="muted">Cột: <b>Họ tên</b> | <b>Số áo</b> · mỗi dòng = 1 bộ nameset.</div>

    <div class="label" style="margin-top:6px!important">Khổ in nhanh</div>
    <div class="quickbar">
      <div><button class="quickbtn" type="button" onclick="setPreset(580,2000,10,this)">580×2000</button></div>
      <div><button class="quickbtn" type="button" onclick="setPreset(600,2000,10,this)">600×2000</button></div>
      <div><button class="quickbtn" type="button" onclick="setPreset(297,420,8,this)">A3</button></div>
    </div>

    <div class="row">
      <div class="cell"><span class="mini">Rộng (mm)</span><input id="sheetWidth" type="number" value="580" min="50"/></div>
      <div class="cell"><span class="mini">Cao (mm)</span><input id="sheetHeight" type="number" value="2000" min="50"/></div>
      <div class="cell"><span class="mini">Cách (mm)</span><input id="sheetGap" type="number" value="10" min="0"/></div>
    </div>

    <label class="check" for="excelMirror"><input id="excelMirror" type="checkbox"/><b>Lật gương cả trang in</b></label>
    <div class="toolsrow">
      <div><button class="smallbtn" type="button" onclick="resetSettings()">RESET THÔNG SỐ</button></div>
      <div><button class="smallbtn" type="button" onclick="saveSettings(true)">LƯU THÔNG SỐ</button></div>
    </div>
    <div id="savedState" class="saved"></div>
    <button id="excelRun" type="button">ĐỌC EXCEL + DÀN TRANG</button>
    <div id="excelResult" class="note">Chọn 1 bộ mẫu tên+số còn Text trước khi chạy.</div>
  </div>
</div>
<div class="footer">DHL Nameset A3 · v6.8 · giao diện sáng</div>
<script src="main.js" type="text/javascript"></script>
<script type="text/javascript">
function byId(id){return document.getElementById(id);}
function setPreset(w,h,g,btn){
  byId('sheetWidth').value=w;byId('sheetHeight').value=h;byId('sheetGap').value=g;
  var list=document.getElementsByTagName('button'),i;
  for(i=0;i<list.length;i++){if((' '+list[i].className+' ').indexOf(' quickbtn ')>=0){list[i].className='quickbtn';}}
  if(btn){btn.className='quickbtn active';}
  saveSettings(false);
}
function resetSettings(){
  byId('sheetWidth').value=580;byId('sheetHeight').value=2000;byId('sheetGap').value=10;
  byId('excelMirror').checked=false;byId('mirror').checked=false;byId('mode').value='auto';
  var radios=document.getElementsByName('orientation'),i;for(i=0;i<radios.length;i++){radios[i].checked=(radios[i].value==='portrait');}
  saveSettings(true);
}
function saveSettings(show){
  try{
    var radios=document.getElementsByName('orientation'),ori='portrait',i;
    for(i=0;i<radios.length;i++){if(radios[i].checked){ori=radios[i].value;}}
    var data=[byId('sheetWidth').value,byId('sheetHeight').value,byId('sheetGap').value,byId('excelMirror').checked?'1':'0',byId('mirror').checked?'1':'0',byId('mode').value,ori].join('|');
    window.localStorage.setItem('dhl_nameset_a3_settings',data);
    if(show){byId('savedState').innerHTML='✓ Đã lưu thông số này cho lần mở sau.';setTimeout(function(){byId('savedState').innerHTML='';},1800);}
  }catch(ignore){}
}
function loadSettings(){
  try{
    var data=window.localStorage.getItem('dhl_nameset_a3_settings');if(!data){return;}
    var p=data.split('|');if(p.length<7){return;}
    byId('sheetWidth').value=p[0];byId('sheetHeight').value=p[1];byId('sheetGap').value=p[2];
    byId('excelMirror').checked=(p[3]==='1');byId('mirror').checked=(p[4]==='1');byId('mode').value=p[5];
    var radios=document.getElementsByName('orientation'),i;for(i=0;i<radios.length;i++){radios[i].checked=(radios[i].value===p[6]);}
  }catch(ignore){}
}
function toggleExcelPanel(){
  var body=byId('excelBody'),btn=byId('toggleExcel');
  if(body.className==='hidden'){body.className='';btn.innerHTML='Thu gọn';}
  else{body.className='hidden';btn.innerHTML='Mở rộng';}
}
function hookAutoSave(){
  var ids=['sheetWidth','sheetHeight','sheetGap','excelMirror','mirror','mode'],i,el;
  for(i=0;i<ids.length;i++){el=byId(ids[i]);if(el){el.onchange=function(){saveSettings(false);};}}
  var radios=document.getElementsByName('orientation');for(i=0;i<radios.length;i++){radios[i].onclick=function(){saveSettings(false);};}
}
function reloadFromGit(){
  var btn=byId('reloadGit');
  try{
    if(btn){btn.disabled=true;btn.innerHTML='ĐANG TẢI…';}
    var sh=new ActiveXObject('WScript.Shell');
    var stamp=(new Date()).getTime();
    var ps="powershell -NoProfile -ExecutionPolicy Bypass -Command \"$u='https://raw.githubusercontent.com/dinhloi116-hue/dhlstores/main/tools/tach-nameset-a3/CAI_TOOL_TACH_NAMESET_A3.bat?v="+stamp+"';$p=Join-Path $env:TEMP 'CAI_TOOL_TACH_NAMESET_A3_LATEST.bat';try{Invoke-WebRequest -UseBasicParsing -Uri $u -OutFile $p;cmd.exe /d /c ('\"'+$p+'\" --reload-ui');exit $LASTEXITCODE}catch{Write-Host $_.Exception.Message;exit 1}\"";
    var rc=sh.Run(ps,1,true);
    if(rc===0){var base=window.location.href.split('?')[0];window.location.replace(base+'?v='+(new Date()).getTime());}
    else{alert('Reload Git chưa xong. Mã lỗi: '+rc);}
  }catch(e){alert('Không chạy được Reload Git: '+e.message);}
  finally{if(btn){btn.disabled=false;btn.innerHTML='↻ RELOAD GIT';}}
}
try{loadSettings();hookAutoSave();}catch(ignoreInit){}
</script>
</body>
</html>
