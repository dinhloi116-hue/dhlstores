<script id="dhl-v83-roll45" type="text/javascript">
(function(){
function E(id){return document.getElementById(id);}function LANG(){try{return currentLang==='en'?'en':'vi';}catch(e){return 'vi';}}function N(id,d){var v=Number(E(id).value);return isFinite(v)?v:d;}function r2(v){return Math.round(v*100)/100;}function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
var previousNest=null;
function mode(){try{return localStorage.getItem('dhl_v80_mode')||'compact';}catch(e){return 'compact';}}
function saveDefaults(){try{localStorage.setItem('dhl_v77_nest',['58','2000','1.5','0','0','0','0','0',E('v77Rotate')?E('v77Rotate').value:'90'].join('|'));localStorage.setItem('dhl_v79_cm','1');localStorage.setItem('dhl_v83_defaults','1');}catch(e){}}
function forceRequestedDefaultsOnce(){var done=false;try{done=localStorage.getItem('dhl_v83_defaults')==='1';}catch(e){}if(done)return;if(E('v77NestW'))E('v77NestW').value='58';if(E('v77NestH'))E('v77NestH').value='2000';if(E('v77NestGap'))E('v77NestGap').value='1.5';if(E('v77FrameGapInput'))E('v77FrameGapInput').value='0';if(E('v77MarginT'))E('v77MarginT').value='0';if(E('v77MarginB'))E('v77MarginB').value='0';if(E('v77MarginL'))E('v77MarginL').value='0';if(E('v77MarginR'))E('v77MarginR').value='0';saveDefaults();}
function fixPresets(){var b=document.getElementsByClassName?document.getElementsByClassName('v77-preset'):[];if(b.length>=4){b[0].onclick=function(){V77SetPreset(21,29.7,this);};b[1].onclick=function(){V77SetPreset(29.7,42,this);};b[2].onclick=function(){V77SetPreset(60,100,this);};b[3].innerHTML='58×20 m';b[3].onclick=function(){V77SetPreset(58,2000,this);};}}
function add45Option(){var s=E('v77Rotate'),o,h;if(!s)return;if(!document.getElementById('v83Rot45')){o=document.createElement('option');o.id='v83Rot45';o.value='45';s.appendChild(o);}o=E('v83Rot45');if(o)o.innerHTML=LANG()==='vi'?'Tối ưu 0° / 45° / 90° / 135°':'Optimize 0° / 45° / 90° / 135°';if(!E('v83RotHint')){h=document.createElement('div');h.id='v83RotHint';h.className='v83-rot-hint';s.parentNode.insertBefore(h,s.nextSibling);}E('v83RotHint').innerHTML=LANG()==='vi'?'Xoay 45° chỉ dùng cho chế độ TỐI ƯU DIỆN TÍCH. Chế độ Dễ cắt vẫn ưu tiên 0°/90°.':'45° rotation is used only in MAXIMUM COMPACTNESS mode. Cut-friendly mode still favors 0°/90°.';}
function sel(a){var sr=a.ActiveSelectionRange,out=[],i;for(i=1;i<=sr.Count;i++)out.push(sr.Item(i));return out;}
function measureAt(shape,ang){var d,w,h;if(ang===0)return{w:Math.abs(Number(shape.SizeWidth)),h:Math.abs(Number(shape.SizeHeight)),ang:0};try{d=shape.Duplicate();d.Rotate(ang);w=Math.abs(Number(d.SizeWidth));h=Math.abs(Number(d.SizeHeight));d.Delete();return{w:w,h:h,ang:ang};}catch(e){try{if(d)d.Delete();}catch(x){}var rad=ang*Math.PI/180,c=Math.abs(Math.cos(rad)),s=Math.abs(Math.sin(rad)),bw=Math.abs(Number(shape.SizeWidth)),bh=Math.abs(Number(shape.SizeHeight));return{w:bw*c+bh*s,h:bw*s+bh*c,ang:ang};}}
function itemOf(shape,id){var base=measureAt(shape,0);return{id:id,shape:shape,w:base.w,h:base.h,area:base.w*base.h,opts:[base,measureAt(shape,45),measureAt(shape,90),measureAt(shape,135)]};}
function intersects(a,b){return !(b.x>=a.x+a.w||b.x+b.w<=a.x||b.y>=a.y+a.h||b.y+b.h<=a.y);}function contained(a,b){return a.x>=b.x&&a.y>=b.y&&a.x+a.w<=b.x+b.w&&a.y+a.h<=b.y+b.h;}
function splitFree(fr,p,out){var r=fr.x+fr.w,b=fr.y+fr.h,pr=p.x+p.w,pb=p.y+p.h;if(!intersects(fr,p)){out.push(fr);return;}if(p.x>fr.x)out.push({x:fr.x,y:fr.y,w:p.x-fr.x,h:fr.h});if(pr<r)out.push({x:pr,y:fr.y,w:r-pr,h:fr.h});if(p.y>fr.y)out.push({x:fr.x,y:fr.y,w:fr.w,h:p.y-fr.y});if(pb<b)out.push({x:fr.x,y:pb,w:fr.w,h:b-pb});}
function prune(a){var out=[],i,j,keep;for(i=0;i<a.length;i++){if(a[i].w<=.001||a[i].h<=.001)continue;keep=true;for(j=0;j<a.length;j++){if(i!==j&&contained(a[i],a[j])){keep=false;break;}}if(keep)out.push(a[i]);}return out;}
function sorted(items,kind){var a=items.slice(0);if(kind==='area')a.sort(function(x,y){return y.area-x.area;});else if(kind==='max')a.sort(function(x,y){return Math.max(y.w,y.h)-Math.max(x.w,x.h);});else if(kind==='height')a.sort(function(x,y){return y.h-x.h;});else if(kind==='width')a.sort(function(x,y){return y.w-x.w;});else a.sort(function(x,y){return Math.abs((y.w/y.h)-1)-Math.abs((x.w/x.h)-1);});return a;}
function oneBin(items,W,H,gap,kind){var ord=sorted(items,kind),free=[{x:0,y:0,w:W,h:H}],placed=[],used={},i,j,k,it,op,fr,pw,ph,waste,ss,best,nf,q,area=0,depth=0,right=0;for(i=0;i<ord.length;i++){it=ord[i];best=null;for(j=0;j<free.length;j++){fr=free[j];for(k=0;k<it.opts.length;k++){op=it.opts[k];pw=op.w+gap;ph=op.h+gap;if(pw<=fr.w+.001&&ph<=fr.h+.001){waste=fr.w*fr.h-pw*ph;ss=Math.min(fr.w-pw,fr.h-ph);var score=waste*1000+ss+(op.ang===0?0:(op.ang===90?.05:.2));if(!best||score<best.score)best={x:fr.x,y:fr.y,w:pw,h:ph,ow:op.w,oh:op.h,ang:op.ang,item:it,score:score};}}}if(!best)continue;placed.push(best);used[it.id]=1;area+=best.ow*best.oh;depth=Math.max(depth,best.y+best.oh);right=Math.max(right,best.x+best.ow);nf=[];for(q=0;q<free.length;q++)splitFree(free[q],best,nf);free=prune(nf);}var rem=[];for(i=0;i<items.length;i++)if(!used[items[i].id])rem.push(items[i]);return{place:placed,remaining:rem,area:area,depth:depth,right:right};}
function allBins(items,W,H,gap,kind){var rem=items.slice(0),bins=[],guard=0,b,total=0;while(rem.length&&guard++<500){b=oneBin(rem,W,H,gap,kind);if(!b.place.length)break;bins.push(b);total+=b.area;rem=b.remaining;}return{bins:bins,remaining:rem,totalArea:total};}
function choose(items,W,H,gap){var kinds=['area','max','height','width','square'],best=null,i,p,lastDepth,score;for(i=0;i<kinds.length;i++){p=allBins(items,W,H,gap,kinds[i]);lastDepth=p.bins.length?p.bins[p.bins.length-1].depth:1e20;score=p.remaining.length*1e12+p.bins.length*1e9+lastDepth*1e3+(p.bins.length?p.bins[p.bins.length-1].right:0);if(!best||score<best.score)best={plan:p,kind:kinds[i],score:score};}return best;}
function frame(page,left,bottom,w,h,idx){var f=page.ActiveLayer.CreateRectangle2(left,bottom,w,h);try{f.Fill.ApplyNoFill();}catch(e){}try{f.Outline.Width=.2;f.Outline.Color.CMYKAssign(0,0,0,100);}catch(e2){}try{f.Name='DHL_COMPACT45_FRAME_'+idx;}catch(e3){}try{f.OrderToBack();}catch(e4){}return f;}
function compact45(){var a,doc,oldUnit,opt=false,cmd=false,res=E('v77NestResult');try{a=corelApp();doc=a.ActiveDocument;var ss=sel(a);if(!ss.length)throw new Error(LANG()==='vi'?'Chưa chọn đối tượng.':'No objects selected.');var W=N('v77NestW',58)*10,H=N('v77NestH',2000)*10,gap=N('v77NestGap',1.5)*10,fg=N('v77FrameGapInput',0)*10,mt=N('v77MarginT',0)*10,mb=N('v77MarginB',0)*10,ml=N('v77MarginL',0)*10,mr=N('v77MarginR',0)*10,uw=W-ml-mr,uh=H-mt-mb;if(W<=0||H<=0||gap<0||uw<=0||uh<=0)throw new Error(LANG()==='vi'?'Khổ/lề không hợp lệ.':'Invalid frame/margins.');oldUnit=doc.Unit;doc.Unit=3;var items=[],i;for(i=0;i<ss.length;i++)items.push(itemOf(ss[i],i));var chosen=choose(items,uw,uh,gap),plan=chosen.plan,page=a.ActivePage,baseLeft=Number(page.CenterX)-W/2,baseBottom=Number(page.CenterY)-H/2,bi,p,sh,left,top,placed=0,usedArea=0,usedCm=0;doc.BeginCommandGroup('DHL Nameset Layout - Compact 45');cmd=true;a.Optimization=true;opt=true;for(bi=0;bi<plan.bins.length;bi++){left=baseLeft+bi*(W+fg);frame(page,left,baseBottom,W,H,bi+1);top=baseBottom+H-mt;usedCm+=plan.bins[bi].depth/10;for(i=0;i<plan.bins[bi].place.length;i++){p=plan.bins[bi].place[i];sh=p.item.shape;if(p.ang)sh.Rotate(p.ang);sh.CenterX=left+ml+p.x+p.ow/2;sh.CenterY=top-p.y-p.oh/2;placed++;usedArea+=p.ow*p.oh;}}a.Optimization=false;opt=false;doc.Unit=oldUnit;doc.EndCommandGroup();cmd=false;try{a.ActiveWindow.Refresh();}catch(rx){}var frames=plan.bins.length,pct=frames?Math.round(usedArea/(frames*uw*uh)*1000)/10:0,vi=LANG()==='vi',remain=plan.remaining.length;res.setAttribute('data-used','1');res.innerHTML='<span class="v80-modebadge">'+(vi?'Chế độ: Tối ưu diện tích + xoay 45°':'Mode: Maximum compactness + 45° rotation')+'</span><br/>'+(remain?(vi?'⚠ Đã xếp '+placed+'/'+items.length+' đối tượng vào '+frames+' khung; '+remain+' đối tượng không vừa.':'⚠ Packed '+placed+'/'+items.length+' objects into '+frames+' frame(s); '+remain+' do not fit.'):(vi?'✓ Đã xếp '+placed+' đối tượng vào '+frames+' khung.':'✓ Packed '+placed+' objects into '+frames+' frame(s).'))+'<br/>'+(vi?'Hiệu suất diện tích: ':'Area usage: ')+pct+'%<span class="v79-total">'+(vi?'Chiều dài thực dùng khoảng: ':'Approx. used roll length: ')+r2(usedCm)+' cm = '+r2(usedCm/100)+' m</span>';
}catch(e){try{if(opt&&a)a.Optimization=false;}catch(x){}try{if(doc&&oldUnit!==undefined)doc.Unit=oldUnit;}catch(x2){}try{if(cmd&&doc)doc.EndCommandGroup();}catch(x3){}if(res){res.setAttribute('data-used','1');res.innerHTML=(LANG()==='vi'?'Không dàn được: ':'Could not nest: ')+esc(e.message);}}}
function V83Nest(){if(mode()==='compact'&&E('v77Rotate')&&E('v77Rotate').value==='45'){compact45();return;}if(previousNest)previousNest();}
function relabel(){add45Option();fixPresets();var v=document.getElementsByClassName?document.getElementsByClassName('ver'):[],f=document.getElementsByClassName?document.getElementsByClassName('footer'):[];if(v&&v.length)v[0].innerHTML='v8.3';if(f&&f.length)f[0].innerHTML='DHL Nameset Layout · v8.3 · tabs · cm · VI / EN';}
function finish(){if(!E('v77NestCard')||!E('v77NestBtn')){setTimeout(finish,150);return;}forceRequestedDefaultsOnce();fixPresets();add45Option();previousNest=window.V77NestSelected;window.V77NestSelected=V83Nest;E('v77NestBtn').onclick=V83Nest;relabel();var old=window.setLanguage;if(old&&!old._v83){var wrap=function(x){old(x);setTimeout(relabel,30);};wrap._v83=true;window.setLanguage=wrap;}}
if(window.addEventListener)window.addEventListener('load',function(){setTimeout(finish,1100);},false);else if(window.attachEvent)window.attachEvent('onload',function(){setTimeout(finish,1100);});else setTimeout(finish,1300);
})();
