<style id="dhl-v82-tabs-style">
.v82-tabs{display:table!important;width:100%!important;table-layout:fixed!important;margin:8px 0 4px!important;border:1px solid #aaa!important;border-radius:6px!important;overflow:hidden!important;background:#fff!important}
.v82-tabs>div{display:table-cell!important;border-right:1px solid #cfcfcf!important}.v82-tabs>div:last-child{border-right:0!important}
.v82-tabbtn{width:100%!important;border:0!important;border-radius:0!important;background:#fff!important;color:#111!important;padding:8px 2px 7px!important;font:700 10.5px "Segoe UI",Arial,sans-serif!important;line-height:1.15!important;box-shadow:none!important;white-space:nowrap!important}
.v82-tabbtn:hover{background:#f5f5f5!important}.v82-tabbtn:active{background:#e9e9e9!important;transform:translateY(1px)}
.v82-tabbtn.selected{background:#eceff1!important;font-weight:800!important;box-shadow:inset 0 -3px 0 #111!important}
.v82-panel{display:none}.v82-panel.active{display:block!important}
.v82-shell{margin-bottom:7px!important}.v82-shell .top{margin-bottom:4px!important}
#v82PanelNameset{padding-top:2px!important}
#v82PanelExcel,#v77NestCard,#v77OutlineCard{margin-top:0!important}
</style>
<script id="dhl-v82-tabs" type="text/javascript">
(function(){
function E(id){return document.getElementById(id);}function LANG(){try{return currentLang==='en'?'en':'vi';}catch(e){return 'vi';}}
var active='nameset',mainCard=null,excelCard=null,nestCard=null,outlineCard=null,namesetPanel=null;
function labels(){return LANG()==='vi'?{nameset:'NAMESET',excel:'EXCEL',nest:'DÀN FILE',outline:'ĐƯỜNG BAO',tn:'Ghép tên + số / A3',te:'Dữ liệu Excel / dàn trang',td:'Dàn tối ưu / dễ cắt',to:'Tạo viền / cutline'}:{nameset:'NAMESET',excel:'EXCEL',nest:'LAYOUT',outline:'OUTLINE',tn:'Name + number / A3',te:'Excel data / sheet layout',td:'Optimal / cut-friendly layout',to:'Border / cutline'};}
function setLabel(id,text,title){var b=E(id);if(b){b.innerHTML=text;b.title=title||text;}}
function refreshLabels(){var t=labels();setLabel('v82TabNameset',t.nameset,t.tn);setLabel('v82TabExcel',t.excel,t.te);setLabel('v82TabNest',t.nest,t.td);setLabel('v82TabOutline',t.outline,t.to);}
function markButtons(){var map={nameset:'v82TabNameset',excel:'v82TabExcel',nest:'v82TabNest',outline:'v82TabOutline'},k,b;for(k in map){b=E(map[k]);if(b)b.className='v82-tabbtn'+(k===active?' selected':'');}}
function hideAll(){if(namesetPanel)namesetPanel.className='v82-panel';if(excelCard)excelCard.className=excelCard.className.replace(/\s*active\b/g,'').replace(/\s*v82-panel\b/g,'')+' v82-panel';if(nestCard)nestCard.className=nestCard.className.replace(/\s*active\b/g,'').replace(/\s*v82-panel\b/g,'')+' v82-panel';if(outlineCard)outlineCard.className=outlineCard.className.replace(/\s*active\b/g,'').replace(/\s*v82-panel\b/g,'')+' v82-panel';}
function showTab(name,save){active=(name==='excel'||name==='nest'||name==='outline')?name:'nameset';hideAll();if(active==='nameset'&&namesetPanel)namesetPanel.className='v82-panel active';if(active==='excel'&&excelCard)excelCard.className=excelCard.className.replace(/\s*active\b/g,'')+' active';if(active==='nest'&&nestCard)nestCard.className=nestCard.className.replace(/\s*active\b/g,'')+' active';if(active==='outline'&&outlineCard)outlineCard.className=outlineCard.className.replace(/\s*active\b/g,'')+' active';markButtons();if(save!==false)try{localStorage.setItem('dhl_v82_tab',active);}catch(e){}try{document.body.scrollTop=0;document.documentElement.scrollTop=0;}catch(x){}
}
window.V82ShowTab=function(name){showTab(name,true);};
function moveNamesetContent(tabbar){var nodes=[],n=tabbar.nextSibling,next,i;while(n){next=n.nextSibling;nodes.push(n);n=next;}namesetPanel=document.createElement('div');namesetPanel.id='v82PanelNameset';namesetPanel.className='v82-panel';for(i=0;i<nodes.length;i++)namesetPanel.appendChild(nodes[i]);mainCard.appendChild(namesetPanel);}
function build(){var cards=document.getElementsByClassName?document.getElementsByClassName('card'):[],top,bar,t,stored;if(cards.length<2||!E('v77NestCard')||!E('v77OutlineCard'))return false;mainCard=cards[0];excelCard=cards[1];nestCard=E('v77NestCard');outlineCard=E('v77OutlineCard');if(E('v82Tabs'))return true;mainCard.className+=' v82-shell';top=mainCard.getElementsByClassName('top')[0];if(!top)return false;bar=document.createElement('div');bar.id='v82Tabs';bar.className='v82-tabs';bar.innerHTML='<div><button id="v82TabNameset" class="v82-tabbtn" type="button" onclick="V82ShowTab(\'nameset\')">NAMESET</button></div><div><button id="v82TabExcel" class="v82-tabbtn" type="button" onclick="V82ShowTab(\'excel\')">EXCEL</button></div><div><button id="v82TabNest" class="v82-tabbtn" type="button" onclick="V82ShowTab(\'nest\')">DÀN FILE</button></div><div><button id="v82TabOutline" class="v82-tabbtn" type="button" onclick="V82ShowTab(\'outline\')">ĐƯỜNG BAO</button></div>';if(top.nextSibling)mainCard.insertBefore(bar,top.nextSibling);else mainCard.appendChild(bar);moveNamesetContent(bar);excelCard.id='v82PanelExcel';excelCard.className+=' v82-panel';nestCard.className+=' v82-panel';outlineCard.className+=' v82-panel';refreshLabels();try{stored=localStorage.getItem('dhl_v82_tab')||'nameset';}catch(e){stored='nameset';}showTab(stored,false);return true;}
function finish(){if(!build()){setTimeout(finish,150);return;}var old=window.setLanguage;if(old&&!old._v82){var wrap=function(x){old(x);setTimeout(refreshLabels,30);};wrap._v82=true;window.setLanguage=wrap;}refreshLabels();var v=document.getElementsByClassName?document.getElementsByClassName('ver'):[],f=document.getElementsByClassName?document.getElementsByClassName('footer'):[];if(v&&v.length)v[0].innerHTML='v8.2';if(f&&f.length)f[0].innerHTML='DHL Nameset Layout · v8.2 · tabs · cm · VI / EN';}
if(window.addEventListener)window.addEventListener('load',function(){setTimeout(finish,950);},false);else if(window.attachEvent)window.attachEvent('onload',function(){setTimeout(finish,950);});else setTimeout(finish,1200);
})();
</script>
