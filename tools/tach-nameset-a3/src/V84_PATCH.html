<style id="dhl-v84-excel-style">
#v84ExcelPreview,#v84TemplateStatus{border:1px solid #cfcfcf!important;border-radius:5px!important;padding:7px 8px!important;margin:6px 0!important;background:#fff!important;font-size:11px!important;line-height:1.4!important;min-height:30px!important}
#v84ExcelPreview.ok,#v84TemplateStatus.ok{border-left:4px solid #2e8b57!important}
#v84ExcelPreview.bad,#v84TemplateStatus.bad{border-left:4px solid #c53b45!important}
#v84ExcelPreview.busy{border-left:4px solid #b58a00!important}
#excelRun.v84-busy{background:#f3f3f3!important;color:#666!important}
.v84-head{font-weight:800!important}.v84-small{font-size:10px!important;color:#555!important}
</style>
<script id="dhl-v84-excel" type="text/javascript">
(function(){
function E(id){return document.getElementById(id);}function LANG(){try{return currentLang==='en'?'en':'vi';}catch(e){return 'vi';}}
function esc(s){return String(s===undefined||s===null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function txt(v){return String(v===undefined||v===null?'':v).replace(/^\s+|\s+$/g,'');}
function head(v){return txt(v).toLowerCase().replace(/[\s_\-\.\/\\]+/g,'');}
function isNameHeader(h){return h==='tênináo'||h==='teninao'||h==='tênáo'||h==='tenao'||h==='họtên'||h==='hoten'||h==='tên'||h==='ten'||h==='name'||h==='player'||h==='playername';}
function isNumberHeader(h){return h==='sốáo'||h==='soao'||h==='số'||h==='so'||h==='number'||h==='no'||h==='shirtno'||h==='shirtnumber';}
function status(msg,kind){var x=E('excelResult');if(x){x.className='note'+(kind?' '+kind:'');x.innerHTML=msg;}}
function previewStatus(msg,kind){var x=E('v84ExcelPreview');if(x){x.className=kind||'';x.innerHTML=msg;}}
function selectionStatus(msg,kind){var x=E('v84TemplateStatus');if(x){x.className=kind||'';x.innerHTML=msg;}}
function cellText(cell){var t='',v='';try{t=String(cell.Text);}catch(e){}try{v=cell.Value2;}catch(e2){}if((!t||/^#+$/.test(t))&&v!==undefined&&v!==null)t=String(v);return txt(t);}
function rowsFromMatrix(m){var nc=-1,sc=-1,c,r,h,out=[];if(!m||!m.length)throw new Error(LANG()==='vi'?'File Excel không có dữ liệu.':'Excel file has no data.');for(c=0;c<m[0].length;c++){h=head(m[0][c]);if(nc<0&&isNameHeader(h))nc=c;if(sc<0&&isNumberHeader(h))sc=c;}if(nc<0||sc<0){throw new Error(LANG()==='vi'?'Không tìm thấy cột “Tên in áo/Họ tên” và “Số áo” ở hàng đầu.':'Could not find “Print name/Name” and “Shirt number” columns in the first row.');}for(r=1;r<m.length;r++){var n=txt(m[r][nc]),s=txt(m[r][sc]);if(n&&s)out.push({name:n,number:s,row:r+1});}if(!out.length)throw new Error(LANG()==='vi'?'Không có dòng nào đủ cả Tên in áo và Số áo.':'No row contains both name and shirt number.');return out;}
function readWorkbook(path){var xl=null,book=null,sheet=null,used=null,m=[],r,c;try{xl=new ActiveXObject('Excel.Application');xl.Visible=false;xl.DisplayAlerts=false;book=xl.Workbooks.Open(path);sheet=book.Worksheets(1);used=sheet.UsedRange;for(r=1;r<=used.Rows.Count;r++){var row=[];for(c=1;c<=used.Columns.Count;c++)row.push(cellText(used.Cells(r,c)));m.push(row);}return rowsFromMatrix(m);}finally{try{if(book)book.Close(false);}catch(e){}try{if(xl)xl.Quit();}catch(e2){}}}
function corel(){if(window.external&&window.external.Application)return window.external.Application;throw new Error(LANG()==='vi'?'Không kết nối được với CorelDRAW.':'Cannot connect to CorelDRAW.');}
function selected(a){var sr=a.ActiveSelectionRange,out=[],i;if(!sr)return out;for(i=1;i<=sr.Count;i++)out.push(sr.Item(i));if(out.length===1){try{var ch=out[0].Shapes;if(ch&&ch.Count>1){out=[];for(i=1;i<=ch.Count;i++)out.push(ch.Item(i));}}catch(e){}}return out;}
function textValue(sh){try{return txt(sh.Text.Story.Text);}catch(e){return null;}}
function templatePair(){var a=corel(),ss=selected(a),i,t;if(ss.length!==2)throw new Error(LANG()==='vi'?'Hãy chọn đúng 2 đối tượng Text mẫu: 1 tên + 1 số áo.':'Select exactly 2 Text objects: one name + one shirt number.');for(i=0;i<2;i++){t=textValue(ss[i]);if(t===null)throw new Error(LANG()==='vi'?'Bộ mẫu phải còn là Text, chưa Convert to Curves.':'Template must still be Text, not converted to curves.');}var n0=textValue(ss[0]),n1=textValue(ss[1]),num0=/^\s*\d{1,3}\s*$/.test(n0),num1=/^\s*\d{1,3}\s*$/.test(n1),nameShape,numberShape;if(num0&&!num1){numberShape=ss[0];nameShape=ss[1];}else if(num1&&!num0){numberShape=ss[1];nameShape=ss[0];}else{nameShape=Number(ss[0].CenterY)>Number(ss[1].CenterY)?ss[0]:ss[1];numberShape=nameShape===ss[0]?ss[1]:ss[0];}return{a:a,name:nameShape,number:numberShape};}
function replaceText(sh,v){try{sh.Text.Story.Text=String(v);}catch(e){throw new Error(LANG()==='vi'?'Không thay được Text mẫu. Hãy kiểm tra tên và số vẫn là Text.':'Could not replace template Text.');}}
function geom(sh){return{w:Math.abs(Number(sh.SizeWidth)),h:Math.abs(Number(sh.SizeHeight))};}
function groupPair(a,page,n,d,mirror){var r=a.CreateShapeRange(),g;r.Add(n);r.Add(d);g=r.Group();if(mirror)g.Flip(1);return g;}
function layoutRows(rows){var p=templatePair(),a=p.a,doc=a.ActiveDocument,w=Number(E('sheetWidth').value),h=Number(E('sheetHeight').value),gap=Number(E('sheetGap').value),mirror=!!E('excelMirror').checked,margin=Math.max(gap,5),oldUnit=doc.Unit,page=null,name=p.name,number=p.number,templateGap,opt=false,cmd=false,x,top,rowH=0,i,n,d,g,gg;if(!(w>0&&h>0&&gap>=0))throw new Error(LANG()==='vi'?'Khổ in hoặc khoảng cách không hợp lệ.':'Invalid sheet size or gap.');try{oldUnit=doc.Unit;doc.Unit=3;if(typeof normalizeSelectedPair==='function'){try{normalizeSelectedPair(false);}catch(nx){}}p=templatePair();name=p.name;number=p.number;templateGap=(Number(name.CenterY)-Math.abs(Number(name.SizeHeight))/2)-(Number(number.CenterY)+Math.abs(Number(number.SizeHeight))/2);doc.BeginCommandGroup('DHL Nameset Layout - Excel V8.4');cmd=true;a.Optimization=true;opt=true;page=doc.AddPagesEx(1,w,h);page.MoveTo(1);try{page.Name='DHL Excel Nameset';}catch(ne){}x=margin;top=h-margin;for(i=0;i<rows.length;i++){n=name.CopyToLayer(page.ActiveLayer);d=number.CopyToLayer(page.ActiveLayer);replaceText(n,rows[i].name);replaceText(d,rows[i].number);n.CenterX=d.CenterX;n.CenterY=d.CenterY+Math.abs(Number(d.SizeHeight))/2+templateGap+Math.abs(Number(n.SizeHeight))/2;g=groupPair(a,page,n,d,mirror);gg=geom(g);if(x+gg.w>w-margin&&x>margin){x=margin;top-=rowH+gap;rowH=0;}if(top-gg.h<margin){try{g.Delete();}catch(de){}throw new Error((LANG()==='vi'?'Khổ hiện tại chỉ xếp được ':'Current sheet only fits ')+i+'/'+rows.length+(LANG()==='vi'?' bộ. Hãy tăng chiều cao trang hoặc giảm khoảng cách.':' sets. Increase sheet height or reduce spacing.'));}g.CenterX=x+gg.w/2;g.CenterY=top-gg.h/2;x+=gg.w+gap;rowH=Math.max(rowH,gg.h);}page.Activate();a.Optimization=false;opt=false;doc.Unit=oldUnit;doc.EndCommandGroup();cmd=false;try{a.ActiveWindow.Refresh();}catch(rx){}return{count:rows.length,width:w,height:h};}catch(e){try{if(opt)a.Optimization=false;}catch(x1){}try{doc.Unit=oldUnit;}catch(x2){}try{if(cmd)doc.EndCommandGroup();}catch(x3){}throw e;}}
var cachePath='',cacheRows=null;
function showRows(rows){var vi=LANG()==='vi',parts=[],i,max=Math.min(rows.length,5);for(i=0;i<max;i++)parts.push(esc(rows[i].name)+' — '+esc(rows[i].number));previewStatus('<span class="v84-head">'+(vi?'✓ Đã đọc ':'✓ Read ')+rows.length+(vi?' dòng hợp lệ':' valid rows')+'</span><br><span class="v84-small">'+parts.join(' · ')+(rows.length>max?' …':'')+'</span>','ok');}
function previewFile(){var input=E('excelFile'),path=input?input.value:'',vi=LANG()==='vi';cacheRows=null;cachePath='';if(!path){previewStatus(vi?'Chưa chọn file Excel.':'No Excel file selected.','bad');return;}previewStatus(vi?'Đang đọc file…':'Reading file…','busy');setTimeout(function(){try{cacheRows=readWorkbook(path);cachePath=path;showRows(cacheRows);}catch(e){previewStatus('<b>'+(vi?'Lỗi đọc file: ':'File error: ')+'</b>'+esc(e.message),'bad');}},40);}
function updateTemplate(){var vi=LANG()==='vi';try{var p=templatePair(),nv=textValue(p.name),sv=textValue(p.number);selectionStatus('<b>'+(vi?'✓ Mẫu đã chọn: ':'✓ Template selected: ')+'</b>'+esc(nv)+' / '+esc(sv)+'<br><span class="v84-small">'+(vi?'Có thể bấm ĐỌC EXCEL + DÀN TRANG.':'Ready to build Excel layout.')+'</span>','ok');}catch(e){selectionStatus('<b>'+(vi?'Mẫu: ':'Template: ')+'</b>'+esc(e.message),'bad');}}
function run(){var b=E('excelRun'),input=E('excelFile'),path=input?input.value:'',vi=LANG()==='vi',old=b?b.innerHTML:'';if(!path){status(vi?'Hãy chọn file Excel trước.':'Select an Excel file first.','bad');return;}try{templatePair();}catch(te){status('<b>'+(vi?'Chưa có bộ mẫu: ':'No template: ')+'</b>'+esc(te.message),'bad');updateTemplate();return;}if(b){b.disabled=true;b.className=(b.className||'')+' v84-busy';b.innerHTML=vi?'ĐANG ĐỌC + DÀN…':'READING + LAYOUT…';}status(vi?'Đang đọc dữ liệu và tạo nameset…':'Reading data and creating namesets…','');setTimeout(function(){try{var rows=(cacheRows&&cachePath===path)?cacheRows:readWorkbook(path);cacheRows=rows;cachePath=path;showRows(rows);var out=layoutRows(rows);status('<b>'+(vi?'✓ Hoàn tất: ':'✓ Done: ')+'</b>'+(vi?'đã tạo ':'created ')+out.count+(vi?' bộ nameset trên khổ ':' namesets on ')+out.width+' × '+out.height+' mm.','ok');}catch(e){status('<b>'+(vi?'Lỗi: ':'Error: ')+'</b>'+esc(e.message),'bad');}finally{if(b){b.disabled=false;b.className=(b.className||'').replace(/\s*v84-busy\b/g,'');b.innerHTML=old|| (vi?'ĐỌC EXCEL + DÀN TRANG':'READ EXCEL + LAYOUT');}}},50);}
function relabel(){var vi=LANG()==='vi',hint=E('columnHint'),v=document.getElementsByClassName?document.getElementsByClassName('ver'):[],f=document.getElementsByClassName?document.getElementsByClassName('footer'):[];if(hint)hint.innerHTML=vi?'Cột chuẩn: <b>Tên in áo</b> (hoặc Họ tên/Tên/Name) | <b>Số áo</b>.':'Columns: <b>Print name</b> (or Name/Player) | <b>Shirt number</b>.';if(v&&v.length)v[0].innerHTML='v8.4';if(f&&f.length)f[0].innerHTML='DHL Nameset Layout · v8.4 · Excel preview · VI / EN';}
function build(){var input=E('excelFile'),runBtn=E('excelRun'),body=E('excelBody'),p,s;if(!input||!runBtn||!body)return false;if(!E('v84ExcelPreview')){p=document.createElement('div');p.id='v84ExcelPreview';p.className='bad';p.innerHTML=LANG()==='vi'?'Chọn file để tool tự kiểm tra dữ liệu.':'Choose a file to validate data.';if(input.nextSibling)input.parentNode.insertBefore(p,input.nextSibling);else input.parentNode.appendChild(p);}if(!E('v84TemplateStatus')){s=document.createElement('div');s.id='v84TemplateStatus';s.className='bad';s.innerHTML=LANG()==='vi'?'Mẫu: hãy chọn đúng 2 Text (tên + số).':'Template: select exactly 2 Text objects (name + number).';runBtn.parentNode.insertBefore(s,runBtn);}input.onchange=previewFile;runBtn.onclick=run;setInterval(updateTemplate,800);relabel();return true;}
function finish(){if(!build()){setTimeout(finish,180);return;}var old=window.setLanguage;if(old&&!old._v84){var wrap=function(x){old(x);setTimeout(function(){relabel();updateTemplate();if(cacheRows)showRows(cacheRows);},40);};wrap._v84=true;window.setLanguage=wrap;}updateTemplate();}
if(window.addEventListener)window.addEventListener('load',function(){setTimeout(finish,1350);},false);else if(window.attachEvent)window.attachEvent('onload',function(){setTimeout(finish,1350);});else setTimeout(finish,1500);
})();
</script>
