<style id="dhl-v88-font-fix-style">
#v86Status.v88-font-ok{border-left:4px solid #2e8b57!important}
#v86Status.v88-font-bad{border-left:4px solid #c53b45!important}
</style>
<script id="dhl-v88-font-fix" type="text/javascript">
(function(){
function E(id){return document.getElementById(id);}function L(){try{return currentLang==='en'?'en':'vi';}catch(e){return 'vi';}}function norm(s){return String(s||'').replace(/^\s+|\s+$/g,'').toLowerCase();}function esc(s){return String(s===undefined||s===null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function corel(){if(window.external&&window.external.Application)return window.external.Application;if(typeof corelApp==='function')return corelApp();throw new Error(L()==='vi'?'Không kết nối được CorelDRAW.':'Cannot connect to CorelDRAW.');}
function sameFont(a,b){a=norm(a);b=norm(b);if(!a||!b)return false;return a===b||a.indexOf(b)>=0||b.indexOf(a)>=0;}
function applyOne(sh,font){var got='',ok=false,e1='',e2='';
 try{sh.Text.Story.Font=font;got=String(sh.Text.Story.Font||'');if(sameFont(got,font))ok=true;}catch(e){e1=e.message||String(e);}
 if(!ok){try{sh.Text.FontProperties.Name=font;got=String(sh.Text.Story.Font||'');if(sameFont(got,font))ok=true;}catch(e){e2=e.message||String(e);}}
 if(!ok){try{var tr=sh.Text.Story;tr.Font=font;got=String(tr.Font||'');if(sameFont(got,font))ok=true;}catch(e3){}}
 if(!ok){throw new Error((L()==='vi'?'Corel không áp được font “':'Corel could not apply font “')+font+'”. '+(got?(L()==='vi'?'Font thực tế đang là “':'Actual font is “')+got+'”. ':'')+(e1||e2));}
 return true;
}
function robustApplyFontRecursive(s,font){var i,hasText=false;if(!font)return true;
 try{if(s&&s.Text&&s.Text.Story){hasText=true;return applyOne(s,font);}}catch(e){if(hasText)throw e;}
 try{if(s&&s.Shapes&&s.Shapes.Count){for(i=1;i<=s.Shapes.Count;i++)robustApplyFontRecursive(s.Shapes.Item(i),font);return true;}}catch(e2){throw e2;}
 throw new Error(L()==='vi'?'Đối tượng không phải Text nên không thể áp font.':'Object is not text; font cannot be applied.');
}
window.applyFontRecursive=robustApplyFontRecursive;
function fillSelect(sel,fonts,keep){var i;while(sel.options.length>1)sel.remove(1);for(i=0;i<fonts.length;i++)sel.options.add(new Option(fonts[i],fonts[i]));if(keep)sel.value=keep;}
window.loadInstalledFonts=function(){var a,fl,fonts=[],seen={},i,n,nf=E('nameFont'),df=E('numberFont'),keepN=nf?nf.value:'',keepD=df?df.value:'',status=E('fontStatus');try{
 if(status)status.innerHTML=L()==='vi'?'Đang đọc danh sách font trực tiếp từ CorelDRAW...':'Reading font list directly from CorelDRAW...';
 a=corel();fl=a.FontList;for(i=1;i<=fl.Count;i++){n=String(fl.Item(i)||'').replace(/^\s+|\s+$/g,'');if(n&&!seen[n.toLowerCase()]){seen[n.toLowerCase()]=1;fonts.push(n);}}
 fonts.sort(function(x,y){x=x.toLowerCase();y=y.toLowerCase();return x<y?-1:(x>y?1:0);});if(nf)fillSelect(nf,fonts,keepN);if(df)fillSelect(df,fonts,keepD);
 try{if(nf&&!nf.value)nf.value=localStorage.getItem('dhl_nameset_name_font')||'';if(df&&!df.value)df.value=localStorage.getItem('dhl_nameset_number_font')||'';}catch(se){}
 try{if(typeof setKeepFontLabels==='function')setKeepFontLabels();}catch(sl){}
 if(status)status.innerHTML=(L()==='vi'?'✓ Đã nạp ':'✓ Loaded ')+fonts.length+(L()==='vi'?' font trực tiếp từ CorelDRAW.':' fonts directly from CorelDRAW.');
 try{var b=E('v86LoadFonts');if(b&&typeof b.onclick==='function')setTimeout(function(){try{b.onclick();}catch(x){}},20);}catch(xx){}
 return fonts.length;
 }catch(e){if(status)status.innerHTML=(L()==='vi'?'Không nạp được font từ CorelDRAW: ':'Could not load fonts from CorelDRAW: ')+esc(e.message);throw e;}}
function testSelectedFont(){var st=E('v86Status'),nf=E('v86NameFont'),df=E('v86NoFont'),a,doc,old,s1=null,s2=null;try{if(!st||!nf||!df||!nf.value||!df.value)return;a=corel();doc=a.ActiveDocument;old=doc.Unit;doc.Unit=3;s1=a.ActivePage.ActiveLayer.CreateArtisticText(0,0,'FONT TEST');s2=a.ActivePage.ActiveLayer.CreateArtisticText(0,0,'88');robustApplyFontRecursive(s1,nf.value);robustApplyFontRecursive(s2,df.value);var g1=String(s1.Text.Story.Font||''),g2=String(s2.Text.Story.Font||'');s1.Delete();s2.Delete();doc.Unit=old;st.className='v86-note v88-font-ok';st.innerHTML=(L()==='vi'?'✓ Font hợp lệ trong Corel: ':'✓ Corel font OK: ')+esc(g1)+' / '+esc(g2);}catch(e){try{if(s1)s1.Delete();}catch(x1){}try{if(s2)s2.Delete();}catch(x2){}try{if(doc&&old!==undefined)doc.Unit=old;}catch(x3){}if(st){st.className='v86-note v88-font-bad';st.innerHTML=(L()==='vi'?'Lỗi font: ':'Font error: ')+esc(e.message);}}}
function hook(){var b=E('v86LoadFonts'),nf=E('v86NameFont'),df=E('v86NoFont'),v=document.getElementsByClassName?document.getElementsByClassName('ver'):[],f=document.getElementsByClassName?document.getElementsByClassName('footer'):[];if(!b||!nf||!df){setTimeout(hook,180);return;}b.onclick=function(){try{loadInstalledFonts();var src=E('nameFont'),i,wantN=nf.value,wantD=df.value;while(nf.options.length>1)nf.remove(1);while(df.options.length>1)df.remove(1);if(src){for(i=1;i<src.options.length;i++){nf.options.add(new Option(src.options[i].text,src.options[i].value));df.options.add(new Option(src.options[i].text,src.options[i].value));}}if(wantN)nf.value=wantN;if(wantD)df.value=wantD;testSelectedFont();}catch(e){}};nf.onchange=function(){testSelectedFont();try{localStorage.setItem('dhl_v88_name_font',nf.value);}catch(e){}};df.onchange=function(){testSelectedFont();try{localStorage.setItem('dhl_v88_no_font',df.value);}catch(e){}};try{var sn=localStorage.getItem('dhl_v88_name_font'),sd=localStorage.getItem('dhl_v88_no_font');if(sn)nf.value=sn;if(sd)df.value=sd;}catch(e){}if(v&&v.length)v[0].innerHTML='v8.8';if(f&&f.length)f[0].innerHTML='DHL Nameset Layout · v8.8 · Corel font fix · VI / EN';}
if(window.addEventListener)window.addEventListener('load',function(){setTimeout(hook,2750);},false);else if(window.attachEvent)window.attachEvent('onload',function(){setTimeout(hook,2750);});else setTimeout(hook,2900);
})();
</script>
