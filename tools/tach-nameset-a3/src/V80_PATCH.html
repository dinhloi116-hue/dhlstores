<style id="dhl-v80-style">

<script id="dhl-v80-modes" type="text/javascript">
(function(){
function E(id){return document.getElementById(id);}function L(){try{return currentLang==='en'?'en':'vi';}catch(e){return 'vi';}}function N(id,d){var v=Number(E(id).value);return isFinite(v)?v:d;}function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
var mode='compact',compactNest=null;
function text(){return L()==='vi'?{label:'CHẾ ĐỘ DÀN',compact:'TỐI ƯU DIỆN TÍCH',cut:'DỄ CẮT / KHUNG BAO',hc:'Nhét gọn nhất có thể; ưu tiên tiết kiệm vật liệu.',ht:'Xếp theo hàng và khung bao để có các đường cắt thẳng, dễ chia thành phẩm.',badgeC:'Chế độ: Tối ưu diện tích',badgeT:'Chế độ: Dễ cắt theo khung bao',done:'✓ Đã xếp {a} đối tượng vào {f} khung theo chế độ DỄ CẮT.',remain:'⚠ Đã xếp {a}/{b} đối tượng vào {f} khung. Có {r} vật không vừa khung.',err:'Không dàn được: '}:{label:'LAYOUT MODE',compact:'MAXIMUM COMPACTNESS',cut:'CUT-FRIENDLY / BOUNDING BOX',hc:'Pack as tightly as possible to save material.',ht:'Arrange in straight rows by bounding boxes for easier cutting.',badgeC:'Mode: Maximum compactness',badgeT:'Mode: Cut-friendly bounding boxes',done:'✓ Packed {a} objects into {f} frame(s) in CUT-FRIENDLY mode.',remain:'⚠ Packed {a}/{b} objects into {f} frame(s). {r} object(s) do not fit.',err:'Could not nest: '};}
function fmt(s,m){var k;for(k in m)if(m.hasOwnProperty(k))s=s.replace('{'+k+'}',m[k]);return s;}
function setMode(m,save){mode=m==='cut'?'cut':'compact';var a=E('v80Compact'),b=E('v80Cut'),h=E('v80Hint'),t=text();if(a)a.className='v80-modebtn'+(mode==='compact'?' selected':'');if(b)b.className='v80-modebtn'+(mode==='cut'?' selected':'');if(h)h.innerHTML=mode==='compact'?t.hc:t.ht;if(save!==false)try{localStorage.setItem('dhl_v80_mode',mode);}catch(e){}}
window.V80SetMode=function(m){setMode(m,true);};
function installUI(){var card=E('v77NestCard'),rot=E('v77RotateLabel');if(!card||!rot||E('v80ModeWrap'))return false;var t=text(),w=document.createElement('div');w.id='v80ModeWrap';w.innerHTML='<span class="label" id="v80ModeLabel">'+t.label+'</span><div class="v80-modebar"><div><button id="v80Compact" class="v80-modebtn" type="button" onclick="V80SetMode(\'compact\')">'+t.compact+'</button></div><div><button id="v80Cut" class="v80-modebtn" type="button" onclick="V80SetMode(\'cut\')">'+t.cut+'</button></div></div><div id="v80Hint" class="v80-modehint"></div>';rot.parentNode.insertBefore(w,rot);try{mode=localStorage.getItem('dhl_v80_mode')||'compact';}catch(e){mode='compact';}setMode(mode,false);return true;}
function refreshLanguage(){var t=text();if(E('v80ModeLabel'))E('v80ModeLabel').innerHTML=t.label;if(E('v80Compact'))E('v80Compact').innerHTML=t.compact;if(E('v80Cut'))E('v80Cut').innerHTML=t.cut;setMode(mode,false);}
function topSelection(a){var sr=a.ActiveSelectionRange,out=[],i;for(i=1;i<=sr.Count;i++)out.push(sr.Item(i));return out;}
function makeFrame(page,left,bottom,W,H,index){var f=page.ActiveLayer.CreateRectangle2(left,bottom,W,H);try{f.Fill.ApplyNoFill();}catch(e){}try{f.Outline.Width=0.2;f.Outline.Color.CMYKAssign(0,0,0,100);}catch(e2){}try{f.Name='DHL_NEST_FRAME_'+index;}catch(e3){}try{f.OrderToBack();}catch(e4){}return f;}
function chooseOrientation(it,maxW,maxH,rowX,rowH,allowRotate){var opts=[{w:it.w,h:it.h,ang:0}],i,best=null,o,score;if(allowRotate&&Math.abs(it.w-it.h)>.01)opts.push({w:it.h,h:it.w,ang:90});for(i=0;i<opts.length;i++){o=opts[i];if(o.w>maxW+.001||o.h>maxH+.001)continue;score=0;if(rowX+o.w<=maxW+.001)score=(Math.max(rowH,o.h)*maxW)-(rowX+o.w)*Math.max(rowH,o.h);else score=1000000+o.h*maxW;if(!best||score<best.score)best={w:o.w,h:o.h,ang:o.ang,score:score};}return best;}
function cutFriendly(){var a,doc,oldUnit,opt=false,cmd=false,res=E('v77NestResult'),selected,items=[],i,W,H,gap,fg,mt,mb,ml,mr,uw,uh,allowRotate,page,baseLeft,baseBottom,frame=0,rowX,rowY,rowH,placed=0,remain=0,usedBottom=0,totalArea=0,frameArea=0,it,o,sh,frameLeft,top,t=text();try{
 a=corelApp();doc=a.ActiveDocument;selected=topSelection(a);if(!selected.length)throw new Error(L()==='vi'?'Chưa chọn đối tượng.':'No objects selected.');
 W=N('v77NestW',58)*10;H=N('v77NestH',200)*10;gap=N('v77NestGap',1.5)*10;fg=N('v77FrameGapInput',0)*10;mt=N('v77MarginT',0)*10;mb=N('v77MarginB',0)*10;ml=N('v77MarginL',0)*10;mr=N('v77MarginR',0)*10;uw=W-ml-mr;uh=H-mt-mb;if(W<=0||H<=0||gap<0||uw<=0||uh<=0)throw new Error(L()==='vi'?'Khổ/lề không hợp lệ.':'Invalid frame/margins.');
 oldUnit=doc.Unit;doc.Unit=3;for(i=0;i<selected.length;i++)items.push({shape:selected[i],w:Math.abs(Number(selected[i].SizeWidth)),h:Math.abs(Number(selected[i].SizeHeight)),area:Math.abs(Number(selected[i].SizeWidth))*Math.abs(Number(selected[i].SizeHeight))});items.sort(function(x,y){return Math.max(y.h,y.w)-Math.max(x.h,x.w);});allowRotate=E('v77Rotate').value!=='none';page=a.ActivePage;baseLeft=Number(page.CenterX)-W/2;baseBottom=Number(page.CenterY)-H/2;
 doc.BeginCommandGroup('DHL Nameset Layout - Cut Friendly');cmd=true;a.Optimization=true;opt=true;
 function newFrame(){frame++;frameLeft=baseLeft+(frame-1)*(W+fg);makeFrame(page,frameLeft,baseBottom,W,H,frame);top=baseBottom+H-mt;rowX=0;rowY=0;rowH=0;}
 newFrame();
 for(i=0;i<items.length;i++){it=items[i];o=chooseOrientation(it,uw,uh,rowX,rowH,allowRotate);if(!o){remain++;continue;}if(rowX>0&&rowX+o.w>uw+.001){rowY+=rowH+gap;rowX=0;rowH=0;o=chooseOrientation(it,uw,uh,rowX,rowH,allowRotate);}if(!o){remain++;continue;}if(rowY+o.h>uh+.001){newFrame();o=chooseOrientation(it,uw,uh,0,0,allowRotate);if(!o){remain++;continue;}}sh=it.shape;if(o.ang)sh.Rotate(o.ang);sh.CenterX=frameLeft+ml+rowX+o.w/2;sh.CenterY=top-rowY-o.h/2;rowX+=o.w+gap;rowH=Math.max(rowH,o.h);usedBottom=Math.max(usedBottom,rowY+rowH);totalArea+=o.w*o.h;placed++;}
 a.Optimization=false;opt=false;doc.Unit=oldUnit;doc.EndCommandGroup();cmd=false;try{a.ActiveWindow.Refresh();}catch(rx){}frameArea=frame*uw*uh;var pct=frameArea>0?Math.round(totalArea/frameArea*1000)/10:0,cm=Math.round(frame*H/10*100)/100,m=Math.round(cm/100*100)/100,html='<span class="v80-modebadge">'+t.badgeT+'</span><br/>'+(remain?fmt(t.remain,{a:placed,b:items.length,f:frame,r:remain}):fmt(t.done,{a:placed,f:frame}))+'<br/>'+(L()==='vi'?'Hiệu suất diện tích: ':'Area usage: ')+pct+'%<span class="v79-total">'+(L()==='vi'?'Tổng chiều dài vật liệu: ':'Total material length: ')+cm+' cm = '+m+' m ('+frame+' × '+N('v77NestH',200)+' cm)</span>';res.setAttribute('data-used','1');res.innerHTML=html;
 }catch(e){try{if(opt&&a)a.Optimization=false;}catch(x){}try{if(doc&&oldUnit!==undefined)doc.Unit=oldUnit;}catch(x2){}try{if(cmd&&doc)doc.EndCommandGroup();}catch(x3){}if(res){res.setAttribute('data-used','1');res.innerHTML=t.err+esc(e.message);}}
}
function V80Nest(){var r=E('v77NestResult'),t=text();if(mode==='cut'){cutFriendly();return;}if(compactNest){compactNest();if(r&&r.innerHTML){r.innerHTML='<span class="v80-modebadge">'+t.badgeC+'</span><br/>'+r.innerHTML;}}}
function finish(){if(!installUI()){setTimeout(finish,150);return;}compactNest=window.V77NestSelected;window.V77NestSelected=V80Nest;var b=E('v77NestBtn');if(b)b.onclick=V80Nest;var v=document.getElementsByClassName?document.getElementsByClassName('ver'):[],f=document.getElementsByClassName?document.getElementsByClassName('footer'):[];if(v&&v.length)v[0].innerHTML='v8.0';if(f&&f.length)f[0].innerHTML='DHL Nameset Layout · v8.0 · cm · VI / EN';var oldLang=window.setLanguage;if(oldLang&&!oldLang._v80){var wrap=function(x){oldLang(x);setTimeout(refreshLanguage,20);};wrap._v80=true;window.setLanguage=wrap;}refreshLanguage();}
if(window.addEventListener)window.addEventListener('load',function(){setTimeout(finish,650);},false);else if(window.attachEvent)window.attachEvent('onload',function(){setTimeout(finish,650);});else setTimeout(finish,850);
})();
</script>
