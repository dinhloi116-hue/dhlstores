<style id="dhl-v853-logo-safe-style">
/* CorelDRAW 2021 MSHTML: compact logo workflow, no extra tab. */
#v82PanelNameset > #v853LogoPanel{display:block!important}
#v853LogoPanel{background:#fff!important;color:#17324f!important;border:1px solid #cbd8e9!important;border-radius:8px!important;padding:10px!important;margin:9px 0!important}
#v853LogoPanel .v853-title{font-size:13px!important;font-weight:800!important;color:#123b69!important;margin-bottom:5px!important}
#v853LogoPanel .v853-note{font-size:10px!important;color:#4b6175!important;line-height:1.4!important;margin:4px 0 8px!important}
#v853LogoPanel .v853-grid{display:table!important;width:100%!important;table-layout:fixed!important;border-spacing:3px 0!important}
#v853LogoPanel .v853-grid>div{display:table-cell!important;vertical-align:bottom!important}
#v853LogoPanel label{font-size:10px!important;color:#25496b!important;display:block!important;margin:6px 0 3px!important}
#v853LogoPanel .v853-enable{font-weight:700!important}
#v853LogoPanel .v853-enable input{width:auto!important;vertical-align:middle!important}
#v853LogoPanel input[type=number],#v853LogoPanel select{box-sizing:border-box!important;width:100%!important;min-height:32px!important;border:1px solid #afc3d9!important;background:#fff!important;color:#17324f!important;border-radius:5px!important;padding:4px!important;font-size:11px!important}
#v853LogoPanel button{box-sizing:border-box!important;min-height:35px!important;width:100%!important;margin-top:5px!important;font-weight:700!important;font-size:10px!important;border-radius:5px!important;border:1px solid #abc7e4!important;background:#eef5ff!important;color:#174c83!important;padding:5px!important}
#v853LogoPanel #v853Apply{background:#176bd1!important;color:#fff!important;border-color:#145aad!important}
#v853LogoPanel button:disabled{opacity:.5!important}
#v853LogoPanel #v853Report{border:1px solid #d1dfed!important;background:#f5f9fe!important;padding:8px!important;border-radius:5px!important;font-size:10px!important;line-height:1.45!important;margin-top:8px!important;word-wrap:break-word!important}
#v853LogoPanel #v853Report.v853-bad{border-color:#dda9a7!important;color:#8d2a20!important}
#v853LogoPanel #v853Report.v853-ok{border-color:#abd4b9!important;color:#17603c!important}
</style>
<script id="dhl-v853-logo-safe" type="text/javascript">
(function(){
 var ready=false,plan=null;
 function E(id){return document.getElementById(id);}
 function T(v,en){try{return currentLang==='en'?en:v;}catch(e){return v;}}
 function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
 function engine(){if(!window.DHLNumberLogo)throw new Error(T('Bộ logo chưa sẵn sàng.','Logo engine unavailable.'));return window.DHLNumberLogo;}
 function msg(s,bad){var x=E('v853Report');if(x){x.className=bad?'v853-bad':'v853-ok';x.innerHTML=s;}}
 function clear(){plan=null;var b=E('v853Apply');if(b)b.disabled=true;}
 function settings(){
  var e=engine();
  return e.configure({on:!!E('v853On').checked,pct:E('v853Pct').value,
   bottom:E('v853Bottom').value,inset:E('v853Inset').value,mode:E('v853Mode').value});
 }
 function changed(){
  clear();
  try{settings();msg(T('Thông số đã lưu. Lấy logo nguồn, chọn số rồi kiểm tra.','Settings saved. Capture a logo, select numbers, then inspect.'),false);}
  catch(e){msg('⚠ '+escapeHtml(e.message||e),true);}
 }
 function capture(){
  clear();
  try{
   settings();
   if(!engine().capture())throw new Error(T('Chưa lấy được logo. Chỉ chọn 1 đối tượng logo.','Could not capture a logo. Select only one source shape.'));
   msg(T('✓ Đã lấy logo. Bây giờ chọn số hoặc Group nameset, rồi KIỂM TRA.','✓ Logo captured. Select digit text or a nameset Group, then INSPECT.'),false);return true;
  }catch(e){msg('⚠ '+escapeHtml(e.message||e),true);return false;}
 }
 function inspect(){
  clear();
  try{
   settings();
   var r=engine().inspectManual();plan={signature:r.signature};
   var txt=T('✓ Dự kiến ','✓ Expected ')+r.logos+T(' logo cho ',' logo(s) across ')+r.targets+
    T(' đối tượng đang chọn.',' selected target(s).')+
    '<div>'+escapeHtml(r.summary)+'</div><div>'+T('Chỉ kiểm tra, chưa sửa file.','Read-only. Artwork unchanged.')+'</div>';
   if(r.logos>1)txt+='<div>'+T('Số nhiều digit: vị trí logo cần kiểm tra lại sau khi chèn.','Multi-digit numbers: verify placement visually after insertion.')+'</div>';
   E('v853Apply').disabled=false;msg(txt,false);return r;
  }catch(e){msg('⚠ '+escapeHtml(e.message||e),true);return null;}
 }
 function apply(){
  try{
   if(!plan)throw new Error(T('Hãy KIỂM TRA trước khi chèn.','Inspect before inserting.'));
   var current=engine().inspectManual();
   if(current.signature!==plan.signature)throw new Error(T('Vùng chọn hoặc thông số đã đổi. Hãy KIỂM TRA lại.','Selection or settings changed. Inspect again.'));
   clear();
   if(!engine().manual())throw new Error(T('Corel báo lỗi khi chèn logo. Hãy kiểm tra đối tượng.','CorelDRAW failed to insert logo. Check the artwork.'));
   msg(T('✓ Đã chèn logo và gom Group với số. Ctrl+Z để hoàn tác. Kiểm tra vị trí trước in.','✓ Logo inserted and grouped with number. Ctrl+Z to undo. Verify position before printing.'),false);return true;
  }catch(e){clear();msg('⚠ '+escapeHtml(e.message||e),true);return false;}
 }
 function labels(){
  var a=[
   ['v853Title','LOGO CHÂN SỐ','DIGIT-FOOT LOGO'],
   ['v853Intro','1. Chọn 1 logo và LẤY LOGO. 2. Chọn số hoặc Group nameset. 3. KIỂM TRA rồi CHÈN.','1. Select and capture one logo. 2. Select digits or a nameset Group. 3. Inspect, then insert.'],
   ['v853EnableText','Bật chèn logo','Enable logo insertion'],
   ['v853PctText','Cỡ (% cao số)','Height (%)'],
   ['v853BottomText','Cách đáy (mm)','Bottom (mm)'],
   ['v853InsetText','Lề ngang (mm)','Side inset (mm)'],
   ['v853ModeText','Vị trí logo','Logo placement'],
   ['v853Capture','1. LẤY LOGO','1. CAPTURE LOGO'],
   ['v853Inspect','2. KIỂM TRA','2. INSPECT'],
   ['v853Apply','3. CHÈN VÀO SỐ','3. INSERT LOGO']
  ],i,x;
  for(i=0;i<a.length;i++){x=E(a[i][0]);if(x)x.innerHTML=T(a[i][1],a[i][2]);}
  var sel=E('v853Mode');if(sel&&sel.options&&sel.options.length===2){
   sel.options[0].text=T('1 logo mỗi digit','One per digit');
   sel.options[1].text=T('1 logo cả cụm số','One per number');}
 }
 function mount(){
  var p=E('v82PanelNameset'),n,x,s;
  if(ready)return true;
  if(!p||!E('v851PairPanel')||!window.DHLNumberLogo)return false;
  n=E('v853LogoPanel');
  if(!n){
   n=document.createElement('div');n.id='v853LogoPanel';
   n.innerHTML='<div class="v853-title" id="v853Title"></div><div class="v853-note" id="v853Intro"></div>'
     +'<label class="v853-enable"><input type="checkbox" id="v853On"/> <span id="v853EnableText"></span></label>'
     +'<div class="v853-grid"><div><label id="v853PctText"></label><input type="number" id="v853Pct" min="2" max="30" step="0.5"/></div>'
     +'<div><label id="v853BottomText"></label><input type="number" id="v853Bottom" min="0" max="30" step="0.5"/></div>'
     +'<div><label id="v853InsetText"></label><input type="number" id="v853Inset" min="0" max="10" step="0.5"/></div></div>'
     +'<label id="v853ModeText"></label><select id="v853Mode"><option value="per"></option><option value="whole"></option></select>'
     +'<button id="v853Capture" type="button"></button>'
     +'<div class="v853-grid"><div><button id="v853Inspect" type="button"></button></div><div><button id="v853Apply" type="button" disabled="disabled"></button></div></div>'
     +'<div id="v853Report"></div>';
   p.appendChild(n);
  }
  s=engine().settings();E('v853On').checked=s.on;E('v853Pct').value=s.pct;
  E('v853Bottom').value=s.bottom;E('v853Inset').value=s.inset;E('v853Mode').value=s.mode;
  E('v853On').onchange=changed;E('v853Pct').onchange=changed;E('v853Bottom').onchange=changed;
  E('v853Inset').onchange=changed;E('v853Mode').onchange=changed;
  E('v853Capture').onclick=capture;E('v853Inspect').onclick=inspect;E('v853Apply').onclick=apply;
  labels();msg(T('Logo nguồn vẫn là đối tượng gốc. Tool chỉ tạo bản sao khi CHÈN.','Source logo remains in your file; copies are created only when inserting.'),false);
  var old=window.setLanguage;
  if(typeof old==='function'&&!old._v853){
   var wrapped=function(v){var ret=old(v);setTimeout(labels,80);return ret;};
   wrapped._v853=true;window.setLanguage=wrapped;
  }
  ready=true;return true;
 }
 function boot(){var i=0;function run(){if(mount()||i++>=65)return;setTimeout(run,250);}run();}
 window.DHLLogoSafe={mount:mount,capture:capture,inspect:inspect,apply:apply,version:'8.53'};
 if(window.addEventListener)window.addEventListener('load',function(){setTimeout(boot,1600);},false);
 else if(window.attachEvent)window.attachEvent('onload',function(){setTimeout(boot,1600);});
 else setTimeout(boot,1750);
})();
</script>
