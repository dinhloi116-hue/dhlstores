<style id="dhl-v81-style">
.v81-cutinfo{display:block;margin-top:5px;font-size:12px!important;font-weight:700!important;line-height:1.45!important}
</style>
<script id="dhl-v81-guillotine" type="text/javascript">
(function(){
function E(id){return document.getElementById(id);}function LANG(){try{return currentLang==='en'?'en':'vi';}catch(e){return 'vi';}}function N(id,d){var v=Number(E(id).value);return isFinite(v)?v:d;}function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}function r2(v){return Math.round(v*100)/100;}
var previousNest=null;
function currentMode(){try{return localStorage.getItem('dhl_v80_mode')||'compact';}catch(e){return 'compact';}}
function selection(a){var sr=a.ActiveSelectionRange,out=[],i;for(i=1;i<=sr.Count;i++)out.push(sr.Item(i));return out;}
function frame(page,left,bottom,w,h,idx){var f=page.ActiveLayer.CreateRectangle2(left,bottom,w,h);try{f.Fill.ApplyNoFill();}catch(e){}try{f.Outline.Width=0.2;f.Outline.Color.CMYKAssign(0,0,0,100);}catch(e2){}try{f.Name='DHL_GUILLOTINE_FRAME_'+idx;}catch(e3){}try{f.OrderToBack();}catch(e4){}return f;}
function itemOf(s,id){var w=Math.abs(Number(s.SizeWidth)),h=Math.abs(Number(s.SizeHeight));return{id:id,shape:s,w:w,h:h,area:w*h};}
function opts(it,rot){var a=[{w:it.w,h:it.h,ang:0}];if(rot&&Math.abs(it.w-it.h)>.01)a.push({w:it.h,h:it.w,ang:90});return a;}
function splitRect(fr,pw,ph,method){var out=[],rw=fr.w-pw,bh=fr.h-ph;if(method==='H'){if(rw>.001)out.push({x:fr.x+pw,y:fr.y,w:rw,h:ph});if(bh>.001)out.push({x:fr.x,y:fr.y+ph,w:fr.w,h:bh});}else{if(rw>.001)out.push({x:fr.x+pw,y:fr.y,w:rw,h:fr.h});if(bh>.001)out.push({x:fr.x,y:fr.y+ph,w:pw,h:bh});}return out;}
function sortItems(items,kind){var a=items.slice(0);if(kind==='area')a.sort(function(x,y){return y.area-x.area;});else if(kind==='max')a.sort(function(x,y){return Math.max(y.w,y.h)-Math.max(x.w,x.h);});else if(kind==='height')a.sort(function(x,y){return y.h-x.h;});else a.sort(function(x,y){return y.w-x.w;});return a;}
function oneBin(items,W,H,gap,rot,kind,splitMethod){var ordered=sortItems(items,kind),free=[{x:0,y:0,w:W,h:H}],placed=[],used={},i,j,k,it,op,fr,pw,ph,waste,shortSide,score,best,newRects,q,placedArea=0,maxY=0,maxX=0;
 for(i=0;i<ordered.length;i++){it=ordered[i];best=null;var oo=opts(it,rot);for(j=0;j<free.length;j++){fr=free[j];for(k=0;k<oo.length;k++){op=oo[k];pw=op.w+gap;ph=op.h+gap;if(pw<=fr.w+.001&&ph<=fr.h+.001){waste=fr.w*fr.h-pw*ph;shortSide=Math.min(fr.w-pw,fr.h-ph);score=waste*1000+shortSide+(op.ang?0.25:0);if(!best||score<best.score)best={fi:j,x:fr.x,y:fr.y,w:op.w,h:op.h,pw:pw,ph:ph,ang:op.ang,item:it,score:score};}}}
  if(!best)continue;placed.push(best);used[it.id]=1;placedArea+=best.w*best.h;maxX=Math.max(maxX,best.x+best.w);maxY=Math.max(maxY,best.y+best.h);fr=free[best.fi];free.splice(best.fi,1);newRects=splitRect(fr,best.pw,best.ph,splitMethod);for(q=0;q<newRects.length;q++)free.push(newRects[q]);
 }
 var remaining=[];for(i=0;i<items.length;i++)if(!used[items[i].id])remaining.push(items[i]);return{place:placed,remaining:remaining,area:placedArea,maxX:maxX,maxY:maxY};
}
function allBins(items,W,H,gap,rot,kind,splitMethod){var rem=items.slice(0),bins=[],guard=0,b,totalArea=0;while(rem.length&&guard++<1000){b=oneBin(rem,W,H,gap,rot,kind,splitMethod);if(!b.place.length)break;bins.push(b);totalArea+=b.area;rem=b.remaining;}return{bins:bins,remaining:rem,totalArea:totalArea};}
function choosePlan(items,W,H,gap,rot){var kinds=['area','max','height','width'],splits=['H','V'],best=null,i,j,p,lastDepth,score;for(i=0;i<kinds.length;i++){for(j=0;j<splits.length;j++){p=allBins(items,W,H,gap,rot,kinds[i],splits[j]);lastDepth=p.bins.length?p.bins[p.bins.length-1].maxY:1e20;score=(p.remaining.length*1000000000)+(p.bins.length*1000000)+lastDepth;if(!best||score<best.score)best={plan:p,kind:kinds[i],split:splits[j],score:score};}}return best;}
function guillotineNest(){var a,doc,oldUnit,opt=false,cmd=false,res=E('v77NestResult');try{a=corelApp();doc=a.ActiveDocument;var ss=selection(a);if(!ss.length)throw new Error(LANG()==='vi'?'Chưa chọn đối tượng.':'No objects selected.');
 var W=N('v77NestW',58)*10,H=N('v77NestH',200)*10,gap=N('v77NestGap',1.5)*10,fg=N('v77FrameGapInput',0)*10,mt=N('v77MarginT',0)*10,mb=N('v77MarginB',0)*10,ml=N('v77MarginL',0)*10,mr=N('v77MarginR',0)*10,uw=W-ml-mr,uh=H-mt-mb,rot=E('v77Rotate').value!=='none';if(W<=0||H<=0||gap<0||uw<=0||uh<=0)throw new Error(LANG()==='vi'?'Khổ/lề không hợp lệ.':'Invalid frame/margins.');
 oldUnit=doc.Unit;doc.Unit=3;var items=[],i;for(i=0;i<ss.length;i++)items.push(itemOf(ss[i],i));var chosen=choosePlan(items,uw,uh,gap,rot),plan=chosen.plan,page=a.ActivePage,baseLeft=Number(page.CenterX)-W/2,baseBottom=Number(page.CenterY)-H/2,bi,p,sh,left,top,placed=0,usedArea=0;
 doc.BeginCommandGroup('DHL Nameset Layout - Guillotine Cut');cmd=true;a.Optimization=true;opt=true;
 for(bi=0;bi<plan.bins.length;bi++){left=baseLeft+bi*(W+fg);frame(page,left,baseBottom,W,H,bi+1);top=baseBottom+H-mt;for(i=0;i<plan.bins[bi].place.length;i++){p=plan.bins[bi].place[i];sh=p.item.shape;if(p.ang)sh.Rotate(90);sh.CenterX=left+ml+p.x+p.w/2;sh.CenterY=top-p.y-p.h/2;placed++;usedArea+=p.w*p.h;}}
 a.Optimization=false;opt=false;doc.Unit=oldUnit;doc.EndCommandGroup();cmd=false;try{a.ActiveWindow.Refresh();}catch(rx){}
 var frames=plan.bins.length,pct=frames?Math.round(usedArea/(frames*uw*uh)*1000)/10:0,totalCm=r2(frames*N('v77NestH',200)),meters=r2(totalCm/100),vi=LANG()==='vi',remain=plan.remaining.length;
 res.setAttribute('data-used','1');res.innerHTML='<span class="v80-modebadge">'+(vi?'Chế độ: Dễ cắt / cắt thẳng':'Mode: Cut-friendly / guillotine')+'</span><br/>'+(remain?(vi?'⚠ Đã xếp '+placed+'/'+items.length+' đối tượng vào '+frames+' khung; '+remain+' đối tượng không vừa.':'⚠ Packed '+placed+'/'+items.length+' objects into '+frames+' frame(s); '+remain+' do not fit.'):(vi?'✓ Đã xếp '+placed+' đối tượng vào '+frames+' khung.':'✓ Packed '+placed+' objects into '+frames+' frame(s).'))+'<span class="v81-cutinfo">'+(vi?'Nguyên tắc: mỗi vùng được chia theo đường cắt thẳng ngang/dọc; vẫn thử nhiều phương án để giảm số khung.':'Rule: every region is split by straight horizontal/vertical cuts; multiple plans are tested to reduce frame count.')+'<br/>'+(vi?'Hiệu suất diện tích: ':'Area usage: ')+pct+'%</span><span class="v79-total">'+(vi?'Tổng chiều dài vật liệu: ':'Total material length: ')+totalCm+' cm = '+meters+' m ('+frames+' × '+N('v77NestH',200)+' cm)</span>';
 }catch(e){try{if(opt&&a)a.Optimization=false;}catch(x){}try{if(doc&&oldUnit!==undefined)doc.Unit=oldUnit;}catch(x2){}try{if(cmd&&doc)doc.EndCommandGroup();}catch(x3){}if(res){res.setAttribute('data-used','1');res.innerHTML=(LANG()==='vi'?'Không dàn được: ':'Could not nest: ')+esc(e.message);}}
}
function V81Nest(){if(currentMode()==='cut'){guillotineNest();return;}if(previousNest)previousNest();}
function finish(){if(!E('v80ModeWrap')||!E('v77NestBtn')){setTimeout(finish,150);return;}previousNest=window.V77NestSelected;window.V77NestSelected=V81Nest;E('v77NestBtn').onclick=V81Nest;var cut=E('v80Cut'),hint=E('v80Hint');if(cut)cut.innerHTML=LANG()==='vi'?'DỄ CẮT / CẮT THẲNG':'CUT-FRIENDLY / GUILLOTINE';if(hint&&currentMode()==='cut')hint.innerHTML=LANG()==='vi'?'Vẫn tối ưu diện tích, nhưng vùng dàn được chia theo các đường cắt thẳng ngang/dọc để dễ tách thành phẩm.':'Still optimizes area, but partitions are guillotine-cuttable with straight horizontal/vertical cuts.';var v=document.getElementsByClassName?document.getElementsByClassName('ver'):[],f=document.getElementsByClassName?document.getElementsByClassName('footer'):[];if(v&&v.length)v[0].innerHTML='v8.1';if(f&&f.length)f[0].innerHTML='DHL Nameset Layout · v8.1 · cm · VI / EN';
 var oldSet=window.V80SetMode;if(oldSet&&!oldSet._v81){var wrap=function(m){oldSet(m);setTimeout(function(){if(E('v80Cut'))E('v80Cut').innerHTML=LANG()==='vi'?'DỄ CẮT / CẮT THẲNG':'CUT-FRIENDLY / GUILLOTINE';if(E('v80Hint')&&m==='cut')E('v80Hint').innerHTML=LANG()==='vi'?'Vẫn tối ưu diện tích, nhưng vùng dàn được chia theo các đường cắt thẳng ngang/dọc để dễ tách thành phẩm.':'Still optimizes area, but partitions are guillotine-cuttable with straight horizontal/vertical cuts.';},20);};wrap._v81=true;window.V80SetMode=wrap;}
}
if(window.addEventListener)window.addEventListener('load',function(){setTimeout(finish,800);},false);else if(window.attachEvent)window.attachEvent('onload',function(){setTimeout(finish,800);});else setTimeout(finish,1000);
})();
</script>
