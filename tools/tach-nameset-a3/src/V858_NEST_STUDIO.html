<script id="dhl-v858-nest-studio" type="text/javascript">
(function(){

function docId(d){try{return String(d.FullFileName||d.Name||'');}catch(e){try{return String(d.Name||'');}catch(f){return '';}}}

}
function rectFootprint(sh,d){

  bb:{l:0,t:0,r:d.w,b:d.h,w:d.w,h:d.h}};

function footprint(sh,d){

}

  for(j=0;j<l.loops.length;j++){
   pts=l.loops[j].pts;arr.push(pts.length,l.loops[j].closed?1:0);
   step=Math.max(1,Math.floor(pts.length/6));
   for(k=0;k<pts.length;k+=step){p=pts[k];arr.push(rnd(p.x),rnd(p.y));}

function capture(){
 var a=app(),doc=a.ActiveDocument,old=doc.Unit,sel=a.ActiveSelectionRange,
     rows=[],i,sh,d,fp;

 if(n(sel.Count)>400)throw err('Tối đa 400 đối tượng mỗi lượt. Chia vùng chọn thành nhiều đợt.','Limit 400 objects per run; split the selection.');
 try{
  doc.Unit=3;
  for(i=1;i<=sel.Count;i++){
   sh=sel.Item(i);

   // loose individual curves/text are valid material pieces in Nest Studio.
   d=shapeDims(sh);fp=footprint(sh,d);
   rows.push({shape:sh,index:i-1,w:d.w,h:d.h,area:d.w*d.h,
    snapshot:d,fp:fp,signature:signature(fp),grouped:grouped(sh)});

function configFromDock(){
 function cm(id,def){var x=E(id),v=x?n(x.value):def;return finite(v)&&v>=0?v:def;}
 var W=cm('v846W',58)*10,H=cm('v846H',200)*10,g=cm('v846Gap',.3)*10;
 var margin=Math.max(cm('v849Top',0),cm('v849Bottom',0),cm('v849Left',0),cm('v849Right',0))*10;
 // New studio uses one symmetric safety margin (as shown in the large window).

 ml:margin,mr:margin,
 frameGap:cm('v849FrameGap',1)*10,

 contour:!!(E('v846Contour')&&E('v846Contour').checked),

function normalize(c){
 var k,nonneg=['gap','mt','mb','ml','mr','frameGap'];

 if(!finite(c.W)||c.W<=0||(!c.roll&&(!finite(c.H)||c.H<=0)))
  throw err('Khổ vật liệu phải lớn hơn 0.','Material dimensions must be positive.');
 for(k=0;k<nonneg.length;k++)if(!finite(c[nonneg[k]])||c[nonneg[k]]<0)
  throw err('Khoảng cách và lề không hợp lệ.','Invalid margins or spacing.');
 c.usableW=c.W-c.ml-c.mr;
 if(c.usableW<=0)throw err('Lề ngang lớn hơn chiều rộng vật liệu.','Side margins exceed material width.');
 if(c.roll){
  // No fixed height exists in roll mode: use a computed search height only.
  c.H=0;c.usableH=0;
  if(c.mt+c.mb>=30000)throw err('Lề đầu/cuối cuộn vượt giới hạn 30 m.','Roll top/bottom margins exceed 30 m limit.');
 }else{
  c.usableH=c.H-c.mt-c.mb;
  if(c.usableH<=0)throw err('Lề lớn hơn chiều cao tấm.','Margins exceed material height.');
 }
 if(c.W>20000||(!c.roll&&c.H>30000)||c.gap>300)
  throw err('Khổ hoặc khoảng cách quá lớn.','Material dimensions or spacing too large.');

}
function rollDepth(plan){
 if(!plan||!plan.bins||plan.bins.length!==1)return -1;

 for(i=0;i<p.length;i++)d=Math.max(d,p[i].y+p[i].h);
 return d;
}
function rollLength(plan,c){
 var d=rollDepth(plan);

}
function workingConfig(state,c){
 if(!c.roll)return c;
 // Conservative one-column bound, calculated from real selected objects.
 // This is a search capacity, never the delivered roll length.
 var i,x,limit=c.usableW,stack=0,minHeight,height;
 for(i=0;i<state.items.length;i++){
  x=state.items[i];minHeight=1e30;
  if(x.w<=limit+.001)minHeight=Math.min(minHeight,x.h);
  if(c.rotate&&x.h<=limit+.001)minHeight=Math.min(minHeight,x.w);
  if(minHeight===1e30)throw err('Có chi tiết rộng hơn cuộn PET, kể cả khi xoay.','A piece exceeds the PET roll width, even after allowed rotation.');
  stack+=minHeight+c.gap;
 }
 height=Math.min(30000,Math.ceil(stack+c.mt+c.mb+2));
 var w={roll:true,W:c.W,H:height,gap:c.gap,mt:c.mt,mb:c.mb,
 ml:c.ml,mr:c.mr,frameGap:c.frameGap,rotate:c.rotate,
 contour:c.contour,mirror:c.mirror,effort:c.effort,seconds:c.seconds,
 usableW:c.usableW,usableH:height-c.mt-c.mb};
 if(!(w.usableH>0))throw err('Không còn chiều dài cuộn khả dụng.','No usable roll length.');

}
function verticalFallback(state,c,work){
 // Guaranteed conservative single-column fallback, if it fits within 30 m.
 var y=0,places=[],i,it,angle,w,h,p;
 for(i=0;i<state.items.length;i++){
  it=state.items[i];angle=0;w=it.w;h=it.h;
  if(c.rotate&&it.h<=c.usableW+.001&&(it.w>c.usableW+.001||it.w<it.h)){
   angle=90;w=it.h;h=it.w;
  }
  if(w>c.usableW+.001)return null;
  if(y+h>work.usableH+.001)return null;
  p={item:it,x:0,y:y,w:w,h:h,angle:angle};places.push(p);
  y+=h+c.gap;
 }

        total:Math.max(0,y-c.gap),kind:'vertical-safe'};
}
function readPopup(){
 if(!popup||popup.closed)throw err('Cửa sổ xem trước đã đóng.','Preview window is closed.');
 var d=popup.document;
 function val(id){var x=d.getElementById(id);return x?x.value:'';}
 function chk(id){var x=d.getElementById(id);return !!(x&&x.checked);}
 var roll=val('nsMaterialMode')==='roll';
 var c={roll:roll,W:n(val('nsW')),H:roll?0:n(val('nsH')),gap:n(val('nsGap')),
 mt:n(val('nsMargin')),mb:n(val('nsMargin')),ml:n(val('nsMargin')),mr:n(val('nsMargin')),
 frameGap:n(val('nsFrameGap')),rotate:chk('nsRotate'),contour:chk('nsContour'),

}
function snapshotValid(state){
 var a=app(),doc=a.ActiveDocument,old=doc.Unit,i,d,s,v,sh;
 if(state.document!==doc&&state.identity!==docId(doc))throw err('Bạn đang mở tài liệu Corel khác. Hãy đọc lại vùng chọn.','Corel document changed. Re-read selected shapes.');
 try{
  doc.Unit=3;
  for(i=0;i<state.items.length;i++){
   sh=state.items[i].shape;d=shapeDims(sh);s=state.items[i].snapshot;
   if(Math.abs(d.w-s.w)>.2||Math.abs(d.h-s.h)>.2||Math.abs(d.x-s.x)>.2||Math.abs(d.y-s.y)>.2)
    throw err('Có đối tượng đã thay đổi vị trí hoặc kích thước. Hãy tính lại.','Artwork moved or resized after preview. Recalculate.');
   var currentFp=footprint(sh,d);
   if(signature(currentFp)!==state.items[i].signature)
    throw err('Đường bao đã bị chỉnh sửa. Hãy tính lại để tránh dùng bản xem trước cũ.','Contours changed after preview. Recalculate.');
  }
  return true;
 }finally{try{doc.Unit=old;}catch(e){}}
}
function transform(fp,angle){
 if(!angle)return fp;
 var w=fp.w,h=fp.h,nw=h,nh=w,leaves=[],anchors=[],i,j,k,leaf,loop,pts,bb,minX,maxX,minY,maxY,p;
 function rot(p){return{x:h-p.y,y:p.x};}
 for(i=0;i<fp.leaves.length;i++){
  leaf=fp.leaves[i];var loops=[];
  minX=1e30;maxX=-1e30;minY=1e30;maxY=-1e30;
  for(j=0;j<leaf.loops.length;j++){
   loop=leaf.loops[j];pts=[];
   var lx=1e30,rx=-1e30,ty=1e30,by=-1e30;
   for(k=0;k<loop.pts.length;k++){
    p=rot(loop.pts[k]);pts.push(p);
    lx=Math.min(lx,p.x);rx=Math.max(rx,p.x);ty=Math.min(ty,p.y);by=Math.max(by,p.y);
   }
   loops.push({closed:loop.closed,pts:pts,bb:{l:lx,r:rx,t:ty,b:by,w:rx-lx,h:by-ty}});
   minX=Math.min(minX,lx);maxX=Math.max(maxX,rx);minY=Math.min(minY,ty);maxY=Math.max(maxY,by);
  }
  leaves.push({loops:loops,bb:{l:minX,r:maxX,t:minY,b:maxY,w:maxX-minX,h:maxY-minY}});
 }
 for(i=0;i<fp.anchors.length;i++)anchors.push(rot(fp.anchors[i]));
 return{shape:fp.shape,ang:90,w:nw,h:nh,area:fp.area,leaves:leaves,anchors:anchors,rectangle:fp.rectangle};
}
function footFor(item,angle){return angle?transform(item.fp,90):item.fp;}
function safePlan(plan,state,c,contour){
 if(!plan||!plan.bins||!plan.bins.length||!state.items.length)return false;
 if(c.roll&&plan.bins.length!==1)return false;
 var seen={},total=0,bin,i,j,p,id,fp,placed,G=window.DHLContourGeometry,gap=c.gap,
     limitH=c.roll?30000-c.mt-c.mb:c.usableH;
 if(!(limitH>0))return false;
 for(i=0;i<plan.bins.length;i++){
  bin=plan.bins[i];placed=[];
  for(j=0;j<bin.places.length;j++){
   p=bin.places[j];id=p.item&&p.item.index;
   if(!finite(id)||Math.floor(id)!==id||id<0||id>=state.items.length||
      (p.angle!==0&&p.angle!==90))return false;
   fp=footFor(state.items[id],p.angle||0);
   if(seen[id]||!finite(p.x)||!finite(p.y)||p.x<-.01||p.y<-.01||
      p.x+fp.w>c.usableW+.01||p.y+fp.h>limitH+.01||
      Math.abs(p.w-fp.w)>.4||Math.abs(p.h-fp.h)>.4)return false;
   if(contour&&(!G||typeof G.valid!=='function'))return false;
   if(contour&&G&&typeof G.valid==='function'){
    if(!G.valid(p.x,p.y,fp,placed,c.usableW,limitH,gap))return false;
   }else{
    for(var k=0;k<placed.length;k++){
     var q=placed[k],ax=p.x,ay=p.y,bx=q.x,by=q.y;
     if(ax<bx+q.item.w+gap-.01&&ax+fp.w+gap>bx+.01&&
        ay<by+q.item.h+gap-.01&&ay+fp.h+gap>by+.01)return false;
    }
   }
   placed.push({x:p.x,y:p.y,item:fp});seen[id]=1;total++;

function contourPack(source,c,items,order,globalDeadline){
 var G=window.DHLContourGeometry,deadline=window.DHL_SEARCH_DEADLINE,sort=window.DHL_ORDER,arr=[],i,item,placed,places=[],depth=0;
 if(globalDeadline&&(new Date()).getTime()>=globalDeadline)return null;
 if(!G||!G.pack||!G.valid||!G.footprintAt)return null;
 for(i=0;i<items.length;i++){item=items[i];var fp=footFor(item,item._angle||0);
  if(fp.w>c.usableW+.01||fp.h>c.usableH+.01)return null;
  var cp={shape:item.shape,w:fp.w,h:fp.h,area:fp.area,leaves:fp.leaves,anchors:fp.anchors,
          ang:item._angle||0,_ord:item.index};

 try{

  window.DHL_ORDER=order;

 finally{window.DHL_SEARCH_DEADLINE=deadline;window.DHL_ORDER=sort;}

  var p=placed[i],fp=p.item;

function variants(state,c,round){
 var engine=window.DHLDirectGroups,items=state.items,plans=[],keyed={},kinds=['area','height','width','visual'],i,j,config,plan,t,elapsed,begin=(new Date()).getTime(),best,sorted,
     work=workingConfig(state,c);

 function key(plan){var seq=[],i,j,p;for(i=0;i<plan.bins.length;i++)for(j=0;j<plan.bins[i].places.length;j++){
  p=plan.bins[i].places[j];seq.push(p.item.index+':'+i+':'+rnd(p.x)+':'+rnd(p.y)+':'+(p.angle||0));
 }seq.sort();return seq.join('|');}

  var score=c.roll?length*100:plan.bins.length*1e7+plan.total*100;

 for(i=0;i<kinds.length;i++){
  plan=engine.runPlan(items,work,kinds[(i+round)%kinds.length]);
  if(plan)add(plan,false,T('Xếp '+kinds[(i+round)%kinds.length],'Layout '+kinds[(i+round)%kinds.length]));
 }

  // Always offer a safe vertical one-roll baseline if greedy algorithms fail.
  var fallback=verticalFallback(state,c,work);
  if(fallback)add(fallback,false,T('Xếp dọc an toàn','Safe vertical layout'));

  // rectangular plans. The second pass matters when >1 sheet is required.
  var orders=['area','height','width','visual'],cutoff=begin+c.seconds*1000;

   sorted=items.slice(0);
   if(orders[i]==='area')sorted.sort(function(a,b){return b.area-a.area;});
   if(orders[i]==='height')sorted.sort(function(a,b){return b.h-a.h;});
   if(orders[i]==='width')sorted.sort(function(a,b){return b.w-a.w;});
   if(c.rotate&&i===3)for(j=0;j<sorted.length;j++)sorted[j]._angle=(sorted[j].w>sorted[j].h)?90:0;
   var one=contourPack(state,work,sorted,orders[i],cutoff);
   if(c.rotate&&i===3)for(j=0;j<sorted.length;j++)sorted[j]._angle=0;
   if(one)add({bins:[one],total:one.depth},true,T('Theo đường bao '+(i+1),'Contour '+(i+1)));
  }
  // Keep a copy of the rectangular seeds before appending contour candidates.
  var seeds=plans.slice(0,Math.min(2,plans.length)),seedIndex,seed,bIndex,sourceBin,
      contourBins,improved,subset,p,baseItem,rebuilt,newTotal;
  for(seedIndex=0;seedIndex<seeds.length;seedIndex++){
   if((new Date()).getTime()>=cutoff||plans.length>=7)break;
   seed=seeds[seedIndex];contourBins=[];improved=false;
   for(bIndex=0;bIndex<seed.plan.bins.length;bIndex++){
    sourceBin=seed.plan.bins[bIndex];
    if((new Date()).getTime()>=cutoff){contourBins.push(sourceBin);continue;}
    if(sourceBin.places.length>80){contourBins.push(sourceBin);continue;}
    subset=[];
    for(j=0;j<sourceBin.places.length;j++){
     p=sourceBin.places[j];baseItem=state.items[p.item.index];
     subset.push({shape:baseItem.shape,index:baseItem.index,w:baseItem.w,h:baseItem.h,
       area:baseItem.area,fp:baseItem.fp,_angle:p.angle||0});

   if(improved){

    add({bins:contourBins,total:newTotal},true,

   }

 plans.sort(function(a,b){return a.score-b.score;});

  err('Không xếp hết vào một cuộn PET dưới 30 m với khổ ngang đã chọn. Hãy tăng chiều rộng hoặc chia công việc thành nhiều lượt.',

}
function summary(state,c,candidate){
 var plan=candidate.plan,area=0,i;for(i=0;i<state.items.length;i++)area+=state.items[i].area;
 // Bounding-box utilization upper estimate; never describe it as true cut-area use.
 var length=c.roll?rollLength(plan,c):c.H,
     pct=100*area/(c.W*length*plan.bins.length);
 return{count:state.items.length,bins:plan.bins.length,usedDepth:rnd(plan.total),
  roll:!!c.roll,rollLength:c.roll?length:0,materialLength:length,
  proxy:Math.max(0,Math.min(100,rnd(pct))),contour:candidate.contour};
}
function previewPath(fp,offx,offy,color){
 var out=[],i,j,k,l,pts,p,cmd,d;
 for(i=0;i<fp.leaves.length;i++)for(j=0;j<fp.leaves[i].loops.length;j++){
  l=fp.leaves[i].loops[j];pts=l.pts;d='';
  if(!pts.length)continue;
  for(k=0;k<pts.length;k++){p=pts[k];d+=(k?'L':'M')+rnd(p.x+offx)+','+rnd(p.y+offy);}
  if(l.closed)d+='Z';
  out.push('<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width=".55" vector-effect="non-scaling-stroke"/>');
 }
 return out.join('');
}
function svgPlan(state,c,candidate){
 var plan=candidate.plan,frames=plan.bins.length,wide=c.W*frames+c.frameGap*(frames-1),
     height=c.roll?rollLength(plan,c):c.H,
     target=720,scale=Math.min(target/wide,480/height)*zoom,renderW=Math.max(140,wide*scale),renderH=Math.max(160,height*scale),
     out=['<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 '+(wide+16)+' '+(height+16)+'" width="'+rnd(renderW)+'" height="'+rnd(renderH)+'">'],
     i,j,bin,p,fp,l,x0,y0;
 out.push('<rect x="-8" y="-8" width="'+(wide+16)+'" height="'+(height+16)+'" fill="#eaf0f5"/>');
 for(i=0;i<frames;i++){
  x0=i*(c.W+c.frameGap);bin=plan.bins[i];
  out.push('<rect x="'+x0+'" y="0" width="'+c.W+'" height="'+height+'" fill="white" stroke="#b44d4b" stroke-width="1.5"/>');
  out.push('<rect x="'+(x0+c.ml)+'" y="'+c.mt+'" width="'+c.usableW+'" height="'+(height-c.mt-c.mb)+'" fill="none" stroke="#c6d7e6" stroke-dasharray="8 6"/>');
  for(j=0;j<bin.places.length;j++){
   p=bin.places[j];fp=footFor(state.items[p.item.index],p.angle||0);
   out.push(previewPath(fp,x0+c.ml+p.x,c.mt+p.y,'#143955'));
  }
  out.push('<text x="'+(x0+5)+'" y="-2" font-size="11" fill="#24445b">'+(c.roll?'CUỘN PET':'Tấm '+(i+1))+'</text>');
 }
 out.push('</svg>');return out.join('');
}
function svgOriginal(state){
 var items=state.items,i,x0=1e30,y0=1e30,x1=-1e30,y1=-1e30,o=[],d,it,fp;
 for(i=0;i<items.length;i++){d=items[i].snapshot;
 x0=Math.min(x0,d.x-d.w/2);x1=Math.max(x1,d.x+d.w/2);
 y0=Math.min(y0,-d.y-d.h/2);y1=Math.max(y1,-d.y+d.h/2);}
 var w=x1-x0,h=y1-y0,scale=Math.min(730/Math.max(1,w),450/Math.max(1,h))*zoom;
 o.push('<svg xmlns="http://www.w3.org/2000/svg" viewBox="'+rnd(x0-10)+' '+rnd(y0-10)+' '+rnd(w+20)+' '+rnd(h+20)+'" width="'+rnd((w+20)*scale)+'" height="'+rnd((h+20)*scale)+'">');
 for(i=0;i<items.length;i++){
  it=items[i];d=it.snapshot;fp=it.fp;
  o.push(previewPath(fp,d.x-d.w/2,-d.y-d.h/2,'#1b4c70'));
 }
 o.push('</svg>');return o.join('');
}

function setVal(d,id,v){var x=d.getElementById(id);if(x)x.value=String(v);}
function updatePopup(){
 if(!popup||popup.closed||!current)return;
 var d=popup.document,state=current,c=candidates(),o=d.getElementById('nsChoices'),i,btn,stats;
 if(!original){
  o.innerHTML='';for(i=0;i<state.candidates.length;i++){
   btn=d.createElement('button');btn.type='button';btn.className=i===choice?'sel':'';
   stats=summary(state,state.config,state.candidates[i]);
   btn.innerHTML='Phương án '+(i+1)+'<br/><small>'+
    (stats.roll?('Cuộn PET '+rnd(stats.rollLength/10)+' cm'):stats.bins+' tấm')+
    ' · '+stats.proxy+'% khung bao</small>';
   (function(idx,b){b.onclick=function(){choice=idx;original=false;updatePopup();};})(i,btn);
   o.appendChild(btn);
  }
  d.getElementById('nsCanvas').innerHTML=svgPlan(state,state.config,state.candidates[choice]);
  stats=summary(state,state.config,state.candidates[choice]);
  d.getElementById('nsStats').innerHTML='<b>'+stats.count+'/'+state.items.length+' đối tượng</b> · '+
   (stats.roll?('<b>CUỘN PET '+rnd(state.config.W/10)+' cm × '+rnd(stats.rollLength/10)+' cm</b> · 1 dải'):
   (stats.bins+' tấm · Chiều dài chi tiết '+rnd(stats.usedDepth/10)+' cm'))+
   ' · '+stats.proxy+'% (khung bao, ước tính) · '+(stats.contour?'ĐƯỜNG BAO':'KHUNG BAO')+
   ' · '+state.elapsed+' ms';
 }else{
  o.innerHTML='<b>VỊ TRÍ BAN ĐẦU</b> · Không có thay đổi nào trong tài liệu Corel';
  d.getElementById('nsCanvas').innerHTML=svgOriginal(state);
  d.getElementById('nsStats').innerHTML='Bản gốc '+state.items.length+' đối tượng · Không áp dụng dịch chuyển';
 }
 d.getElementById('nsChoiceCount').innerHTML=original?'':('('+(choice+1)+'/'+state.candidates.length+')');
 d.getElementById('nsZoom').innerHTML=Math.round(zoom*100)+'%';
 d.getElementById('nsApply').disabled=!!original;
 d.getElementById('nsOriginal').innerHTML=original?'TRỞ LẠI PHƯƠNG ÁN':'HIỆN BẢN GỐC';
}
function candidates(){return current?current.candidates:[];}
function modeUi(){
 if(!popup||popup.closed)return;
 var d=popup.document,mode=d.getElementById('nsMaterialMode'),
     h=d.getElementById('nsH'),label=d.getElementById('nsHLabel'),hint=d.getElementById('nsRollHint'),
     roll=!!(mode&&mode.value==='roll');
 if(h){h.disabled=roll;h.style.backgroundColor=roll?'#e7eff2':'#fbfdfe';}
 if(label)label.innerHTML=roll?'Chiều dài cuộn – tự động (mm)':'Chiều cao tấm (mm)';
 if(hint)hint.innerHTML=roll?
  'Chỉ nhập chiều rộng cuộn PET. Tool tính chiều dài tối thiểu tìm được (bao gồm lề đầu/cuối) và tạo một khung cuộn duy nhất. Giới hạn mỗi lượt 30 m.':
  'Chế độ tấm: sử dụng cả chiều rộng và chiều cao đã nhập.';
}
function stamp(){
 if(!current||!popup||popup.closed)return;
 var d=popup.document,fields=['W','Gap','Margin','FrameGap','Seconds'],i,k;
 var c=current.config;
 for(i=0;i<fields.length;i++){
  k=fields[i];setVal(d,'ns'+k,k==='Margin'?c.ml:k==='Seconds'?c.seconds:c[k==='Gap'?'gap':k==='FrameGap'?'frameGap':k]);
 }
 if(!c.roll)setVal(d,'nsH',c.H);
 setVal(d,'nsMaterialMode',c.roll?'roll':'sheet');modeUi();
 d.getElementById('nsRotate').checked=c.rotate;
 d.getElementById('nsContour').checked=c.contour;
 d.getElementById('nsMirror').checked=c.mirror;
 d.getElementById('nsEffort').value=c.effort;
}
function recompute(){
 try{
  if(!current)return false;
  snapshotValid(current);
  var c=readPopup(),result=variants(current,c,attempt++);
  current.config=c;current.candidates=result.candidates;current.elapsed=result.elapsed;
  choice=0;original=false;zoom=1;stamp();updatePopup();
  if(popup&&!popup.closed)popup.document.getElementById('nsStatus').innerHTML='✓ '+current.candidates.length+' PHƯƠNG ÁN · '+current.items.length+' ĐỐI TƯỢNG';
  return true;
 }catch(e){report(String(e.message||e));return false;}
}
function report(s){
 var x=E('v858Status');if(x)x.innerHTML=esc(s);
 try{if(popup&&!popup.closed){var p=popup.document.getElementById('nsStatus');if(p)p.innerHTML=esc(s);}}catch(e){}
}
function applyCandidate(){
 var state=current,cp,plan,a,doc,old,cmd=false,opt=false,i,j,bi,frame,place,sh,c,left,bottom,top,rect;
 if(!state||original)throw err('Hãy chọn phương án trước khi áp dụng.','Select a valid candidate first.');
 if(!popup||popup.closed)throw err('Cửa sổ đã đóng.','Preview window is closed.');
 c=readPopup();
 // Refuse stale configurations even if the user edited inputs without recomputing.
 var cur=state.config;for(var key in c){if(c.hasOwnProperty(key)&&c[key]!==cur[key])throw err('Thiết lập đã đổi. Bấm TÌM PHƯƠNG ÁN KHÁC trước.','Settings changed. Recompute before applying.');}
 snapshotValid(state);cp=state.candidates[choice];plan=cp.plan;
 if(!safePlan(plan,state,c,cp.contour))throw err('Bố cục không vượt qua kiểm tra va chạm/kích thước.','Candidate failed collision or bounds check.');
 a=app();doc=a.ActiveDocument;old=doc.Unit;
 var frameHeight=c.roll?rollLength(plan,c):c.H;
 if(!(frameHeight>0&&frameHeight<=30000))throw err('Chiều dài cuộn tính được không hợp lệ.','Calculated roll length invalid.');
 try{
  doc.Unit=3;
  doc.BeginCommandGroup('DHL Nest Studio V8.59 - Apply preview');cmd=true;
  try{a.Optimization=true;opt=true;}catch(optimization){}
  bottom=n(a.ActivePage.CenterY)-frameHeight/2;
  for(bi=0;bi<plan.bins.length;bi++){
   left=n(a.ActivePage.CenterX)-c.W/2+bi*(c.W+c.frameGap);
   rect=a.ActivePage.ActiveLayer.CreateRectangle2(left,bottom,c.W,frameHeight);
   if(!rect)throw err('Không tạo được khung vật liệu.','Failed to create material frame.');
   try{rect.Name=c.roll?'DHL_PET_ROLL_'+rnd(c.W)+'x'+rnd(frameHeight)+'_MM':'DHL_NEST_STUDIO_FRAME_'+(bi+1);}catch(nameErr){}
   try{rect.Fill.ApplyNoFill();rect.Outline.Width=.2;rect.OrderToBack();}catch(styling){}
   top=bottom+frameHeight-c.mt;
   for(j=0;j<plan.bins[bi].places.length;j++){
    place=plan.bins[bi].places[j];sh=state.items[place.item.index].shape;
    if(place.angle)sh.Rotate(place.angle);
    sh.CenterX=left+c.ml+place.x+place.w/2;
    sh.CenterY=top-place.y-place.h/2;
    if(c.mirror)sh.Flip(1);
   }
  }
  if(opt){a.Optimization=false;opt=false;}
  doc.EndCommandGroup();cmd=false;
  try{a.ActiveWindow.Refresh();}catch(e){}
  report(c.roll?
   '✓ Đã dàn '+state.items.length+' đối tượng trên 1 cuộn PET rộng '+rnd(c.W/10)+' cm, dài '+rnd(frameHeight/10)+' cm. Ctrl+Z để hoàn tác.':
   '✓ Đã áp dụng '+state.items.length+' đối tượng, '+plan.bins.length+' tấm. Ctrl+Z để hoàn tác.');
  current=null;
  try{popup.close();}catch(e){}
  popup=null;
  return true;
 }catch(e){
  if(opt)try{a.Optimization=false;}catch(x){}
  if(cmd)try{doc.EndCommandGroup();doc.Undo();}catch(rollback){throw err('Lỗi và không hoàn tác được. Kiểm tra tài liệu trước khi in.','Apply failed and rollback failed. Inspect CDR before printing.');}
  throw e;
 }finally{try{doc.Unit=old;}catch(e){}}
}
function apply(){
 try{return applyCandidate();}catch(e){report('⚠ '+String(e.message||e));return false;}
}

function openStudio(){
 try{
  var state=capture(),c=configFromDock(),result;
  if(!window.DHLDirectGroups||!window.DHLDirectGroups.runPlan)throw err('Chưa có engine dàn Corel.','Nesting engine not loaded.');
  result=variants(state,c,attempt++);
  state.config=c;state.candidates=result.candidates;state.elapsed=result.elapsed;
  current=state;choice=0;original=false;zoom=1;
  if(popup&&!popup.closed){try{popup.close();}catch(closeErr){}}
  popup=window.open('','DHL_NEST_STUDIO','width=1440,height=900,resizable=yes,scrollbars=yes');
  if(!popup||!popup.document)throw err('Corel đang chặn cửa sổ mới. Hãy cho phép popup trong Docker.','Corel blocked the preview window. Allow popups in Docker.');
  popup.document.open();popup.document.write(popupHtml());popup.document.close();
  stamp();bindPopup();updatePopup();report('✓ Đã tạo '+state.candidates.length+' phương án xem trước, chưa chỉnh sửa Corel.');
  return true;

}
