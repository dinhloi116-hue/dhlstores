<style id="dhl-v85-copy-size-style">
.v85-prep{border:1px solid #cfcfcf!important;border-radius:6px!important;padding:8px!important;margin:8px 0!important;background:#fff!important}.v85-prep-title{font-size:12px!important;font-weight:800!important;margin-bottom:6px!important}.v85-grid3{display:table!important;width:100%!important;table-layout:fixed!important}.v85-grid3>div{display:table-cell!important;padding-right:5px!important;vertical-align:top!important}.v85-grid3>div:last-child{padding-right:0!important}.v85-mini{display:block!important;font-size:10px!important;color:#555!important;margin-bottom:3px!important}.v85-lock{display:block!important;margin-top:7px!important;font-size:11px!important}.v85-lock input{width:auto!important;min-height:0!important;margin:0 5px 0 0!important;vertical-align:middle!important}.v85-actions{display:table!important;width:100%!important;table-layout:fixed!important;margin-top:7px!important}.v85-actions>div{display:table-cell!important;padding-right:5px!important}.v85-actions>div:last-child{padding-right:0!important}.v85-actions button{font-size:10px!important;padding:6px 4px!important}.v85-status{font-size:10px!important;color:#555!important;line-height:1.4!important;margin-top:6px!important}.v85-badge{display:inline-block!important;padding:3px 7px!important;border:1px solid #888!important;border-radius:4px!important;background:#f5f5f5!important;font-size:10px!important;font-weight:800!important;margin-bottom:4px!important}

<script id="dhl-v85-copy-size" type="text/javascript">
(function(){
function E(id){return document.getElementById(id);}function L(){try{return currentLang==='en'?'en':'vi';}catch(e){return 'vi';}}function esc(s){return String(s===undefined||s===null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}function r2(v){return Math.round(v*100)/100;}
var oldNest=null,oldUndo=null,lastPrepared=false,lastSource=null,lastQty=0;
function corel(){if(window.external&&window.external.Application)return window.external.Application;if(typeof corelApp==='function')return corelApp();throw new Error(L()==='vi'?'Không kết nối được CorelDRAW.':'Cannot connect to CorelDRAW.');}
function topSelection(a){var sr=a.ActiveSelectionRange,out=[],i;if(!sr)return out;for(i=1;i<=sr.Count;i++)out.push(sr.Item(i));return out;}
function T(){return L()==='vi'?{title:'TẠO SỐ LƯỢNG / KÍCH THƯỚC',qty:'Số bản in mới',w:'Ngang (cm)',h:'Dọc (cm)',lock:'Khóa tỷ lệ ngang/dọc',get:'LẤY SIZE MẪU',reset:'GIỮ NGUYÊN SIZE',hint:'Nếu chọn đúng 1 mẫu: nhập số lượng và kích thước rồi bấm DÀN TỐI ƯU. Tool giữ nguyên mẫu gốc, tạo bản in mới để dàn. Để Ngang = 0 sẽ giữ nguyên kích thước.',needOne:'Chọn đúng 1 mẫu để dùng chế độ tạo số lượng.',size:'Mẫu hiện tại: {w} × {h} cm.',ready:'Sẽ tạo {q} bản in, ngang {w} cm, dọc {h} cm.',prepared:'Đã tạo {q} bản in từ 1 mẫu. Mẫu gốc vẫn được giữ nguyên.',badQty:'Số lượng phải từ 1 trở lên.',badSize:'Kích thước phải lớn hơn 0.',undo:'Đã hoàn tác dàn + các bản sao vừa tạo.'}:{title:'QUANTITY / TARGET SIZE',qty:'New print copies',w:'Width (cm)',h:'Height (cm)',lock:'Lock aspect ratio',get:'USE SELECTED SIZE',reset:'KEEP ORIGINAL SIZE',hint:'With exactly 1 source selected, enter quantity and size, then click OPTIMIZE LAYOUT. The source stays untouched; new print copies are created and nested. Width = 0 keeps the original size.',needOne:'Select exactly 1 source object to use copy mode.',size:'Current source: {w} × {h} cm.',ready:'Will create {q} copies at {w} × {h} cm.',prepared:'Created {q} print copies from 1 source. Original source was kept.',badQty:'Quantity must be at least 1.',badSize:'Size must be greater than 0.',undo:'Undid nesting and the generated copies.'};}
function fmt(s,m){var k;for(k in m)if(m.hasOwnProperty(k))s=s.replace('{'+k+'}',m[k]);return s;}
function save(){try{localStorage.setItem('dhl_v85_copy',[E('v85Qty').value,E('v85Width').value,E('v85Height').value,E('v85Lock').checked?'1':'0'].join('|'));}catch(e){}}
function load(){try{var s=localStorage.getItem('dhl_v85_copy'),p;if(s){p=s.split('|');if(p.length>=4){E('v85Qty').value=p[0]||'1';E('v85Width').value=p[1]||'0';E('v85Height').value=p[2]||'0';E('v85Lock').checked=p[3]!=='0';}}}catch(e){}}
function readSourceSize(setInputs){var a=corel(),ss=topSelection(a),doc,old,w,h;if(ss.length!==1)throw new Error(T().needOne);doc=a.ActiveDocument;old=doc.Unit;try{doc.Unit=3;w=Math.abs(Number(ss[0].SizeWidth))/10;h=Math.abs(Number(ss[0].SizeHeight))/10;}finally{doc.Unit=old;}if(setInputs){E('v85Width').value=r2(w);E('v85Height').value=r2(h);save();}return{shape:ss[0],w:w,h:h};}
function syncLock(){var lock=!!E('v85Lock').checked,h=E('v85Height'),w=Number(E('v85Width').value),s;h.disabled=lock;if(lock){try{s=readSourceSize(false);if(w>0&&s.w>0)h.value=r2(w*s.h/s.w);else h.value=r2(s.h);}catch(e){if(!(Number(h.value)>0))h.value='0';}}save();updateStatus();}
function keepOriginal(){E('v85Width').value='0';E('v85Height').value='0';save();updateStatus();}
function getSize(){var st=E('v85PrepStatus');try{var s=readSourceSize(true);st.innerHTML=fmt(T().size,{w:r2(s.w),h:r2(s.h)});syncLock();}catch(e){st.innerHTML=esc(e.message);}}
function updateStatus(){var st=E('v85PrepStatus'),q=Math.max(1,parseInt(E('v85Qty').value,10)||1),w=Number(E('v85Width').value),h=Number(E('v85Height').value),lock=!!E('v85Lock').checked,s;if(!st)return;try{s=readSourceSize(false);if(w<=0){w=s.w;h=s.h;}else if(lock&&s.w>0){h=w*s.h/s.w;}else if(h<=0){h=s.h;}st.innerHTML=fmt(T().ready,{q:q,w:r2(w),h:r2(h)})+'<br><span class="v85-status">'+T().hint+'</span>';}catch(e){st.innerHTML=T().hint;}}
function buildUI(){var card=E('v77NestCard'),anchor=E('v80ModeWrap')||E('v77RotateLabel'),w;if(!card||!anchor)return false;if(E('v85Prep'))return true;w=document.createElement('div');w.id='v85Prep';w.className='v85-prep';w.innerHTML='<div class="v85-prep-title" id="v85Title"></div><div class="v85-grid3"><div><span class="v85-mini" id="v85QtyLabel"></span><input id="v85Qty" type="number" min="1" step="1" value="1"/></div><div><span class="v85-mini" id="v85WidthLabel"></span><input id="v85Width" type="number" min="0" step="0.1" value="0"/></div><div><span class="v85-mini" id="v85HeightLabel"></span><input id="v85Height" type="number" min="0" step="0.1" value="0"/></div></div><label class="v85-lock"><input id="v85Lock" type="checkbox" checked="checked"/><span id="v85LockText"></span></label><div class="v85-actions"><div><button id="v85GetSize" type="button"></button></div><div><button id="v85KeepSize" type="button"></button></div></div><div id="v85PrepStatus" class="v85-status"></div>';anchor.parentNode.insertBefore(w,anchor);load();E('v85Qty').onchange=function(){save();updateStatus();};E('v85Width').onchange=function(){syncLock();};E('v85Width').onkeyup=function(){syncLock();};E('v85Height').onchange=function(){save();updateStatus();};E('v85Lock').onclick=syncLock;E('v85GetSize').onclick=getSize;E('v85KeepSize').onclick=keepOriginal;syncLock();return true;}
function relabel(){var t=T(),v=document.getElementsByClassName?document.getElementsByClassName('ver'):[],f=document.getElementsByClassName?document.getElementsByClassName('footer'):[];if(E('v85Title'))E('v85Title').innerHTML=t.title;if(E('v85QtyLabel'))E('v85QtyLabel').innerHTML=t.qty;if(E('v85WidthLabel'))E('v85WidthLabel').innerHTML=t.w;if(E('v85HeightLabel'))E('v85HeightLabel').innerHTML=t.h;if(E('v85LockText'))E('v85LockText').innerHTML=t.lock;if(E('v85GetSize'))E('v85GetSize').innerHTML=t.get;if(E('v85KeepSize'))E('v85KeepSize').innerHTML=t.reset;if(v&&v.length)v[0].innerHTML='v8.5';if(f&&f.length)f[0].innerHTML='DHL Nameset Layout · v8.5 · copy + size + nesting · VI / EN';updateStatus();}
function shouldPrepare(){var q=parseInt(E('v85Qty').value,10)||1,w=Number(E('v85Width').value),h=Number(E('v85Height').value);return q>1||w>0||(!E('v85Lock').checked&&h>0);}
function prepareCopies(){var a=corel(),doc=a.ActiveDocument,ss=topSelection(a),source,qty,wcm,hcm,lock,old,sw,sh,tw,th,range,i,d,cmd=false;if(ss.length!==1)throw new Error(T().needOne);source=ss[0];qty=parseInt(E('v85Qty').value,10);if(!(qty>=1))throw new Error(T().badQty);wcm=Number(E('v85Width').value);hcm=Number(E('v85Height').value);lock=!!E('v85Lock').checked;old=doc.Unit;try{doc.Unit=3;sw=Math.abs(Number(source.SizeWidth));sh=Math.abs(Number(source.SizeHeight));if(!(sw>0&&sh>0))throw new Error(T().badSize);tw=wcm>0?wcm*10:sw;if(lock){th=tw*sh/sw;}else{th=hcm>0?hcm*10:sh;}if(!(tw>0&&th>0))throw new Error(T().badSize);doc.BeginCommandGroup('DHL Nameset Layout - Prepare Copies V8.5');cmd=true;range=a.CreateShapeRange();for(i=0;i<qty;i++){d=source.Duplicate(0,0);d.SetSize(tw,th);range.Add(d);}range.CreateSelection();doc.EndCommandGroup();cmd=false;lastPrepared=true;lastSource=source;lastQty=qty;return{qty:qty,w:tw/10,h:th/10};}catch(e){try{if(cmd)doc.EndCommandGroup();}catch(x){}throw e;}finally{try{doc.Unit=old;}catch(x2){}}}
function nest(){var res=E('v77NestResult'),prep=null,html,failed=false;if(!oldNest)return;lastPrepared=false;lastSource=null;lastQty=0;try{save();if(shouldPrepare())prep=prepareCopies();oldNest();html=res?String(res.innerHTML).toLowerCase():'';failed=html.indexOf('không dàn được')>=0||html.indexOf('could not nest')>=0;if(failed&&prep){try{corel().ActiveDocument.Undo();}catch(ux){}try{if(lastSource)lastSource.CreateSelection();}catch(sx){}lastPrepared=false;return;}if(prep&&res){res.innerHTML='<span class="v85-badge">'+fmt(T().prepared,{q:prep.qty})+'</span><br>'+res.innerHTML;}}catch(e){if(prep){try{corel().ActiveDocument.Undo();}catch(ux2){}try{if(lastSource)lastSource.CreateSelection();}catch(sx2){}lastPrepared=false;}if(res)res.innerHTML=(L()==='vi'?'Không dàn được: ':'Could not nest: ')+esc(e.message);}}
function undo(){var a;if(oldUndo)oldUndo();if(lastPrepared){try{a=corel();a.ActiveDocument.Undo();if(lastSource)lastSource.CreateSelection();if(a.ActiveWindow)a.ActiveWindow.Refresh();var r=E('v77NestResult');if(r)r.innerHTML=T().undo;}catch(e){}lastPrepared=false;lastSource=null;lastQty=0;}}
function finish(){if(!buildUI()){setTimeout(finish,180);return;}oldNest=window.V77NestSelected;oldUndo=window.V77Undo;window.V77NestSelected=nest;window.V77Undo=undo;if(E('v77NestBtn'))E('v77NestBtn').onclick=nest;if(E('v77UndoNest'))E('v77UndoNest').onclick=undo;var oldLang=window.setLanguage;if(oldLang&&!oldLang._v85){var wrap=function(x){oldLang(x);setTimeout(relabel,40);};wrap._v85=true;window.setLanguage=wrap;}relabel();}
if(window.addEventListener)window.addEventListener('load',function(){setTimeout(finish,1650);},false);else if(window.attachEvent)window.attachEvent('onload',function(){setTimeout(finish,1650);});else setTimeout(finish,1800);
})();
</script>
