<script id="dhl-v78-outline-fix" type="text/javascript">
(function(){
function V78el(id){return document.getElementById(id);}
function V78lang(){try{return currentLang==='en'?'en':'vi';}catch(e){return 'vi';}}
function V78esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function V78num(id,def){var v=Number(V78el(id).value);return isFinite(v)?v:def;}
function V78rangeBounds(sr){var i,s,l=1e20,r=-1e20,b=1e20,t=-1e20,w,h,cx,cy;for(i=1;i<=sr.Count;i++){s=sr.Item(i);w=Math.abs(Number(s.SizeWidth));h=Math.abs(Number(s.SizeHeight));cx=Number(s.CenterX);cy=Number(s.CenterY);l=Math.min(l,cx-w/2);r=Math.max(r,cx+w/2);b=Math.min(b,cy-h/2);t=Math.max(t,cy+h/2);}return {l:l,r:r,b:b,t:t};}
function V78deleteRange(sr){var i;if(!sr)return;try{for(i=sr.Count;i>=1;i--)try{sr.Item(i).Delete();}catch(x){}}catch(e){}}
function V78isBitmap(s){try{return !!s.Bitmap;}catch(e){return false;}}
function V78boundaryFromShape(a,s){var sr,ts,tr,bb,b;
 if(V78isBitmap(s)){
  try{ts=s.Bitmap.Trace(3);}catch(e0){throw new Error('TRACE: '+e0.message);}
  try{ts.Smoothing=25;}catch(e1){}
  try{ts.DetailLevelPercent=90;}catch(e2){}
  try{ts.DeleteOriginalObject=false;}catch(e3){}
  try{ts.RemoveBackground=true;}catch(e4){}
  try{tr=ts.Finish();}catch(e5){throw new Error('TRACE FINISH: '+e5.message);}
  if(!tr||!tr.Count)throw new Error('TRACE: no vector result');
  bb=V78rangeBounds(tr);
  try{b=tr.CreateBoundary(bb.l-20,bb.b-20,false,false);}catch(e6){V78deleteRange(tr);throw new Error('BOUNDARY: '+e6.message);}
  V78deleteRange(tr);
  if(!b)throw new Error('BOUNDARY: failed');
  return b;
 }
 sr=a.CreateShapeRange();sr.Add(s);bb=V78rangeBounds(sr);
 try{b=sr.CreateBoundary(bb.l-20,bb.b-20,false,false);}catch(e7){throw new Error('BOUNDARY: '+e7.message);}
 if(!b)throw new Error('BOUNDARY: failed');
 return b;
}
function V78outerOffset(base,off){var eff,sep,i,s,area,best=null,bestArea=-1,outer;
 if(!(off>0))return base;
 try{eff=base.CreateContour(1,off,1);}catch(e0){try{base.Delete();}catch(dx){}throw new Error('OFFSET '+off+' mm: '+e0.message);}
 try{sep=eff.Separate();}catch(e1){try{base.Delete();}catch(dx2){}throw new Error('OFFSET SEPARATE: '+e1.message);}
 if(!sep||!sep.Count){try{base.Delete();}catch(dx3){}throw new Error('OFFSET: no contour result');}
 for(i=1;i<=sep.Count;i++){s=sep.Item(i);area=Math.abs(Number(s.SizeWidth))*Math.abs(Number(s.SizeHeight));if(area>bestArea){bestArea=area;best=s;}}
 if(!best){V78deleteRange(sep);try{base.Delete();}catch(dx4){}throw new Error('OFFSET: no outer shape');}
 try{outer=best.Duplicate();}catch(e2){V78deleteRange(sep);try{base.Delete();}catch(dx5){}throw new Error('OFFSET DUPLICATE: '+e2.message);}
 V78deleteRange(sep);try{base.Delete();}catch(dx6){}
 return outer;
}
function V78styleWhite(s,src){try{s.Fill.UniformColor.RGBAssign(255,255,255);}catch(e0){}try{s.Outline.SetNoOutline();}catch(e1){}try{s.OrderBackOf(src);}catch(e2){try{s.OrderBackOne();}catch(e3){}}}
function V78styleCut(s,stroke){try{s.Fill.ApplyNoFill();}catch(e0){}try{s.Outline.Width=stroke;}catch(e1){}try{s.Outline.Color.CMYKAssign(0,100,0,0);}catch(e2){}}
function V78group(a,src,white,cut){var sr=a.CreateShapeRange();sr.Add(src);if(white)sr.Add(white);if(cut)sr.Add(cut);return sr.Group();}
function V78CreateOutline(){var a,doc,oldUnit,opt=false,cmd=false,res=V78el('v77OutlineResult'),ss,off,stroke,makeWhite,makeCut,i,base,outer,white,cut,count=0;
 try{
  if(window.saveV77Settings)try{saveV77Settings();}catch(sv){}
  a=corelApp();doc=a.ActiveDocument;ss=[];var ar=a.ActiveSelectionRange;for(i=1;i<=ar.Count;i++)ss.push(ar.Item(i));
  if(!ss.length)throw new Error(V78lang()==='vi'?'Chưa chọn ảnh/vector.':'No image/vector selected.');
  off=V78num('v77OutlineOffset',3);stroke=V78num('v77OutlineStroke',0.2);makeWhite=V78el('v77MakeWhite').checked;makeCut=V78el('v77MakeCut').checked;
  if(off<0||stroke<=0)throw new Error(V78lang()==='vi'?'Thông số không hợp lệ.':'Invalid settings.');
  if(!makeWhite&&!makeCut)throw new Error(V78lang()==='vi'?'Hãy chọn Tạo nền trắng hoặc Tạo cutline.':'Choose white border or cutline.');
  oldUnit=doc.Unit;doc.Unit=3;doc.BeginCommandGroup('DHL Nameset Layout - Outline V7.8');cmd=true;a.Optimization=true;opt=true;
  for(i=0;i<ss.length;i++){
   base=null;outer=null;white=null;cut=null;
   base=V78boundaryFromShape(a,ss[i]);
   outer=V78outerOffset(base,off);base=null;
   if(makeWhite){white=outer.Duplicate();V78styleWhite(white,ss[i]);}
   if(makeCut){cut=outer.Duplicate();V78styleCut(cut,stroke);try{cut.OrderFrontOf(ss[i]);}catch(fo){}}
   try{outer.Delete();}catch(dd){}
   V78group(a,ss[i],white,cut);count++;
  }
  a.Optimization=false;opt=false;doc.Unit=oldUnit;doc.EndCommandGroup();cmd=false;try{a.ActiveWindow.Refresh();}catch(rx){}
  res.setAttribute('data-used','1');res.innerHTML=V78lang()==='vi'?'✓ Đã tạo và Group '+count+' bộ. Khoảng cách viền: '+off+' mm.':'✓ Created and grouped '+count+' set(s). Outline distance: '+off+' mm.';
 }catch(e){
  try{if(outer)outer.Delete();}catch(c1){}try{if(base)base.Delete();}catch(c2){}try{if(opt&&a)a.Optimization=false;}catch(c3){}try{if(doc&&oldUnit!==undefined)doc.Unit=oldUnit;}catch(c4){}try{if(cmd&&doc)doc.EndCommandGroup();}catch(c5){}
  if(res){res.setAttribute('data-used','1');res.innerHTML=(V78lang()==='vi'?'Không tạo được đường bao: ':'Could not create outline: ')+V78esc(e.message);}
 }
}
window.V77CreateOutline=V78CreateOutline;
window.V76CreateOutline=V78CreateOutline;
function V78finishUI(){var v=document.getElementsByClassName?document.getElementsByClassName('ver'):[],f=document.getElementsByClassName?document.getElementsByClassName('footer'):[],btn=V78el('v77OutlineBtn'),hint=V78el('v77OutlineHint');if(v&&v.length)v[0].innerHTML='v7.8';if(f&&f.length)f[0].innerHTML='DHL Nameset Layout · v7.8 · VI / EN';if(btn)btn.onclick=V78CreateOutline;if(hint)hint.innerHTML=V78lang()==='vi'?'Khoảng cách viền là khoảng hở thật tính bằng mm từ biên ảnh ra đường bao. Ví dụ 10 mm = cách đúng 1 cm. Ảnh + nền trắng + cutline tự Group.':'Outline distance is the real gap in mm from image edge to outline. Example: 10 mm = exactly 1 cm. Image + white border + cutline are grouped.';}
if(window.addEventListener)window.addEventListener('load',function(){setTimeout(V78finishUI,250);},false);else if(window.attachEvent)window.attachEvent('onload',function(){setTimeout(V78finishUI,250);});else setTimeout(V78finishUI,500);
})();
</script>
