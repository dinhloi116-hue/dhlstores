function chooseSearch(items,W,H,gap,am){var b=budget(items.length,!!am.auto),base,multi,chosen;if(am.auto){base=searchFamily(items,W,H,gap,[0,90],Math.round(b*.45));multi=searchFamily(items,W,H,gap,[0,45,90,135],Math.round(b*.55));chosen=planBetter(base.best,multi.best);return{chosen:chosen,base:base,multi:multi,trials:base.trials+multi.trials,beamTests:base.beamTests+multi.beamTests,ms:base.ms+multi.ms};}base=searchFamily(items,W,H,gap,am.angles,b);return{chosen:base.best,base:base,trials:base.trials,beamTests:base.beamTests,ms:base.ms};}

function searchNest(a){var doc=a.ActiveDocument,oldUnit=doc.Unit,opt=false,cmd=false,ss=selection(a),W=N('v77NestW',58)*10,H=N('v77NestH',2000)*10,gap=N('v77NestGap',1.5)*10,fg=N('v77FrameGapInput',0)*10,mt=N('v77MarginT',0)*10,mb=N('v77MarginB',0)*10,ml=N('v77MarginL',0)*10,mr=N('v77MarginR',0)*10,uw=W-ml-mr,uh=H-mt-mb,am=angleMode(),items=[],i,choice,chosen,plan,page,baseLeft,baseBottom,bi,p,sh,left,top,usedArea=0,placed=0,res=E('v77NestResult');if(!ss.length)throw new Error(LANG()==='vi'?'Chưa chọn đối tượng.':'No objects selected.');if(W<=0||H<=0||gap<0||uw<=0||uh<=0)throw new Error(LANG()==='vi'?'Khổ/lề không hợp lệ.':'Invalid frame/margins.');try{doc.Unit=3;for(i=0;i<ss.length;i++)items.push(itemOf(ss[i],i,!!am.auto));choice=chooseSearch(items,uw,uh,gap,am);chosen=choice.chosen;if(!chosen||!chosen.plan||!chosen.plan.bins.length)throw new Error(LANG()==='vi'?'Không tìm được phương án dàn hợp lệ.':'No valid nesting plan found.');plan=chosen.plan;page=a.ActivePage;baseLeft=Number(page.CenterX)-W/2;baseBottom=Number(page.CenterY)-H/2;doc.BeginCommandGroup('DHL Nameset Layout - Beam Nest V8.17');cmd=true;a.Optimization=true;opt=true;for(bi=0;bi<plan.bins.length;bi++){left=baseLeft+bi*(W+fg);frame(page,left,baseBottom,W,H,bi+1);top=baseBottom+H-mt;for(i=0;i<plan.bins[bi].place.length;i++){p=plan.bins[bi].place[i];sh=p.item.shape;if(p.ang)sh.Rotate(p.ang);sh.CenterX=left+ml+p.x+p.ow/2;sh.CenterY=top-p.y-p.oh/2;placed++;usedArea+=p.ow*p.oh;}}a.Optimization=false;opt=false;doc.Unit=oldUnit;doc.EndCommandGroup();cmd=false;try{a.ActiveWindow.Refresh();}catch(rx){}
var vi=LANG()==='vi',cm=r2(plan.totalDepth/10),lb=r2(lowerBound(items,uw)/10),gapPct=lb>0?r2((cm/lb-1)*100):0,pct=plan.totalDepth>0?Math.round(usedArea/(uw*plan.totalDepth)*1000)/10:0,remain=plan.remaining.length,html='<span class="v80-modebadge">'+(vi?'Chế độ: TÌM SÂU + BEAM SEARCH':'Mode: DEEP + BEAM SEARCH')+'</span><br>'+(remain?(vi?'⚠ Đã xếp '+placed+'/'+items.length+' đối tượng; '+remain+' đối tượng không vừa.':'⚠ Packed '+placed+'/'+items.length+' objects; '+remain+' do not fit.'):(vi?'✓ Đã xếp '+placed+' đối tượng.':'✓ Packed '+placed+' objects.'))+'<span class="v817-plan">'+(vi?'Chiều dài vật liệu tốt nhất tìm được: ':'Best material length found: ')+cm+' cm = '+r2(cm/100)+' m<br>'+(vi?'Cận dưới theo diện tích: ~':'Area lower bound: ~')+lb+' cm · '+(vi?'chênh ':'gap ')+gapPct+'%<br>'+(vi?'Hiệu suất vùng bao: ':'Bounding-box usage: ')+pct+'% · '+plan.bins.length+(vi?' khung':' frame(s)')+'<br><span class="v817-sub">'+(vi?'Greedy/MaxRects/Skyline: ':'Greedy/MaxRects/Skyline: ')+choice.trials+(vi?' phương án · Beam Search: ':' plans · Beam Search: ')+choice.beamTests+(vi?' lượt · thời gian ~':' passes · time ~')+r2(choice.ms/1000)+' s.';if(am.auto&&choice.base.best&&choice.multi.best){var bc=r2(choice.base.best.plan.totalDepth/10),mc=r2(choice.multi.best.plan.totalDepth/10),picked=(chosen===choice.multi.best&&mc+0.001<bc)?(vi?'đa góc 0°/45°/90°/135°':'multi-angle 0°/45°/90°/135°'):(vi?'0°/90°':'0°/90°');html+='<br>'+(vi?'So sánh bắt buộc: 0°/90° = ':'Mandatory comparison: 0°/90° = ')+bc+' cm · '+(vi?'đa góc = ':'multi-angle = ')+mc+' cm<br>'+(vi?'Chọn: ':'Chosen: ')+picked;}html+='</span></span>';if(res){res.setAttribute('data-used','1');res.innerHTML=html;}return true;
}catch(e){try{if(opt)a.Optimization=false;}catch(x){}try{if(cmd){doc.EndCommandGroup();doc.Undo();}}catch(x2){}try{doc.Unit=oldUnit;}catch(x3){}throw e;}}
function run(){var res=E('v77NestResult'),a,ss,prep=false,q=0;if(typeof window.DHLLicenseGate==='function'){try{if(!window.DHLLicenseGate())return false;}catch(g){}}if(mode()!=='compact'){if(previousNest)return previousNest();return false;}lastPrepared=false;lastSource=null;lastPrepQty=0;try{a=app();ss=selection(a);if(shouldPrepare(ss)){q=prepareCopies(a,ss);prep=true;}if(res){res.setAttribute('data-used','1');res.innerHTML=LANG()==='vi'?'Đang tính MaxRects + Skyline + Beam Search để giảm chiều dài vật liệu...':'Running MaxRects + Skyline + Beam Search to reduce material length...';}searchNest(a);if(prep&&res)res.innerHTML='<span class="v85-badge">'+(LANG()==='vi'?'Đã tạo '+q+' bản in từ 1 mẫu. Mẫu gốc vẫn được giữ nguyên.':'Created '+q+' copies from one source. Original source was kept.')+'</span><br>'+res.innerHTML;return true;}catch(e){if(prep)rollbackPrep(a);if(res){res.setAttribute('data-used','1');res.innerHTML=(LANG()==='vi'?'Không dàn được: ':'Could not nest: ')+esc(e.message);}return false;}}
