<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopee Workflow</title><link rel="stylesheet" href="/style.css"></head><body>
<header><b>SHOPEE WORKFLOW</b><span>Google AI Studio</span><input id="shop" placeholder="Tên shop"></header>
<main>
<div class="steps"><button data-step="1" class="on">1 NGUỒN</button><button data-step="2">2 PHÂN TÍCH</button><button data-step="3">3 GIÁ BÁN</button><button data-step="4">4 NỘI DUNG</button><button data-step="5">5 ẢNH BÌA</button><button data-step="6">6 HOÀN TẤT</button></div>
<section data-panel="1" class="panel on"><div class="card"><h2>NỘI DUNG GỐC THAM CHIẾU</h2><input id="files" type="file" multiple accept="image/*,.pdf,.txt"><div id="fileNames"></div></div><div class="card"><h2>GIÁ VỐN</h2><div class="grid"><label>Giá nhập CNY<input id="cny" type="number" step="0.01"></label><label>Tỷ giá<input id="rate" type="number"></label><label>Khối lượng tính cước (g)<input id="weight" type="number"></label><label>Cước quốc tế (đ/kg)<input id="shipRate" type="number"></label><label>Ship nội địa TQ<input id="chinaShip" type="number" value="0"></label><label>Chi phí khác<input id="other" type="number" value="0"></label></div><div id="cost"></div></div><button class="next" data-next="2">PHÂN TÍCH SẢN PHẨM →</button></section>
<section data-panel="2" class="panel"><div class="card"><div class="row"><h2>KẾT QUẢ PHÂN TÍCH</h2><button id="analyze">GEMINI PHÂN TÍCH</button></div><div class="grid"><label>Tên sản phẩm<input id="name"></label><label>Chất liệu<input id="material"></label><label>Màu sắc<input id="colors"></label><label>Kích thước<input id="dims"></label><label>Trọng lượng sản phẩm nguồn (g)<input id="productWeight" type="number"></label><label>Mã ngành Shopee<input id="categoryId" placeholder="để xuất file"></label></div><label>Đặc điểm<textarea id="features"></textarea></label><label>Phân loại, mỗi dòng 1 mẫu<textarea id="variants"></textarea></label><label>Ngành Shopee<select id="category"></select></label><div id="categoryInfo"></div><div id="weightWarning"></div></div><button data-prev="1">← QUAY LẠI</button><button class="next" data-next="3">CHỐT & TÍNH GIÁ →</button></section>
<section data-panel="3" class="panel"><div class="card"><h2>PHÍ & GIÁ BÁN</h2><div class="grid"><label>Phí ngành %<input id="catFee" readonly></label><label>Thanh toán %<input id="payment" type="number"></label><label>Voucher Xtra %<input id="voucher" type="number"></label><label>Ads %<input id="ads" type="number"></label><label>Phí/đơn<input id="flat" type="number"></label><label>% lãi mục tiêu<input id="target" type="number"></label></div><div id="pricing"></div></div><button data-prev="2">← QUAY LẠI</button><button class="next" data-next="4">SOẠN NỘI DUNG →</button></section>
<section data-panel="4" class="panel"><div class="card"><div class="row"><h2>NỘI DUNG SHOPEE</h2><button id="seo">GEMINI SOẠN SEO</button></div><label>Tiêu đề<input id="title"></label><label>Mô tả<textarea id="desc" rows="14"></textarea></label></div><button data-prev="3">← QUAY LẠI</button><button class="next" data-next="5">ẢNH BÌA →</button></section>
<section data-panel="5" class="panel"><div class="card"><h2>PROMPT ẢNH BÌA CHUNG</h2><button id="makePrompt">TẠO PROMPT CHATGPT</button><textarea id="prompt" rows="18"></textarea><label>URL ảnh bìa<input id="cover"></label></div><button data-prev="4">← QUAY LẠI</button><button class="next" data-next="6">HOÀN TẤT →</button></section>
<section data-panel="6" class="panel"><div class="card"><h2>HOÀN TẤT</h2><div id="summary"></div><button id="save">LƯU SẢN PHẨM</button></div><div class="card"><h2>XUẤT SHOPEE</h2><label>Template Mass Upload gốc<input id="template" type="file" accept=".xlsx"></label><button id="export">XUẤT XLSX</button></div><button data-prev="5">← QUAY LẠI</button></section>
</main><div id="toast"></div><script src="/app.js"></script></body></html>
