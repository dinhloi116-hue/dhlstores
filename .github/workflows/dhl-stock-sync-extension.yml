name: DHL Stock Sync Extension

on:
  push:
    branches:
      - feature/dhl-stock-sync-extension
    paths:
      - 'tools/dhl-stock-sync-extension/**'
      - '.github/workflows/dhl-stock-sync-extension.yml'
  pull_request:
    paths:
      - 'tools/dhl-stock-sync-extension/**'
      - '.github/workflows/dhl-stock-sync-extension.yml'
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/dhl-stock-sync-extension

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test extension
        run: npm test

      - name: Package Chrome extension
        run: |
          rm -rf dist
          mkdir -p dist/dhl-stock-sync-extension
          cp manifest.json background.js stock-core.js dom-stock-parser.js content.js match-core.js shop-rules.js xlsx-lite.js xlsx-preserve.js popup.html popup.css popup.js catalog-mode.js catalog-export-fix.js simple-mode.js dist/dhl-stock-sync-extension/
          cd dist
          zip -r dhl-stock-sync-extension.zip dhl-stock-sync-extension

      - name: Verify packaged files
        run: |
          test -f dist/dhl-stock-sync-extension/dom-stock-parser.js
          test -f dist/dhl-stock-sync-extension/content.js
          test -f dist/dhl-stock-sync-extension/match-core.js
          test -f dist/dhl-stock-sync-extension/shop-rules.js
          test -f dist/dhl-stock-sync-extension/xlsx-lite.js
          test -f dist/dhl-stock-sync-extension/xlsx-preserve.js
          test -f dist/dhl-stock-sync-extension/background.js
          test -f dist/dhl-stock-sync-extension/catalog-mode.js
          test -f dist/dhl-stock-sync-extension/catalog-export-fix.js
          test -f dist/dhl-stock-sync-extension/simple-mode.js

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: dhl-stock-sync-extension
          path: tools/dhl-stock-sync-extension/dist/dhl-stock-sync-extension.zip
          retention-days: 14
