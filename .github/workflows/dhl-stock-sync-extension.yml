name: DHL Stock Sync Extension

on:
  push:
    branches:
      - feature/dhl-stock-sync-extension
    paths:
      - 'tools/dhl-stock-sync-extension/**'
      - '.github/workflows/dhl-stock-sync-extension.yml'
  pull_request:
    paths:
      - 'tools/dhl-stock-sync-extension/**'
      - '.github/workflows/dhl-stock-sync-extension.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/dhl-stock-sync-extension

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test extension
        run: npm test

      - name: Persist generated runtime sources
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content.js popup.js xlsx-lite.js
          if ! git diff --cached --quiet; then
            git commit -m "Materialize current-category runtime [skip ci]"
            git push
          fi

      - name: Package Chrome extension
        run: |
          rm -rf dist
          mkdir -p dist/dhl-stock-sync-extension
          cp manifest.json background.js safe-category-guard.js stock-core.js dom-stock-parser.js content.js match-core.js shop-rules.js generic-shop-rules.js xlsx-lite.js warehouse-core.js generic-warehouse-mode.js kids-product-size-mode.js xlsx-preserve.js direct-stock-core.js stock-import-core.js product-create-core.js popup.html popup.css popup.js catalog-mode.js catalog-generic-mode.js catalog-api-mode.js catalog-api-v2-mode.js catalog-popup-v3-mode.js product-branch-mode.js maintenance-ui.js simple-mode.js exact-name-mode.js one-file-mode.js saved-profiles-mode.js dist/dhl-stock-sync-extension/
          cd dist
          zip -r dhl-stock-sync-extension.zip dhl-stock-sync-extension

      - name: Verify packaged files
        run: |
          test -f dist/dhl-stock-sync-extension/safe-category-guard.js
          test -f dist/dhl-stock-sync-extension/dom-stock-parser.js
          test -f dist/dhl-stock-sync-extension/content.js
          test -f dist/dhl-stock-sync-extension/match-core.js
          test -f dist/dhl-stock-sync-extension/shop-rules.js
          test -f dist/dhl-stock-sync-extension/generic-shop-rules.js
          test -f dist/dhl-stock-sync-extension/xlsx-lite.js
          test -f dist/dhl-stock-sync-extension/warehouse-core.js
          test -f dist/dhl-stock-sync-extension/generic-warehouse-mode.js
          test -f dist/dhl-stock-sync-extension/kids-product-size-mode.js
          test -f dist/dhl-stock-sync-extension/xlsx-preserve.js
          test -f dist/dhl-stock-sync-extension/direct-stock-core.js
          test -f dist/dhl-stock-sync-extension/stock-import-core.js
          test -f dist/dhl-stock-sync-extension/product-create-core.js
          test -f dist/dhl-stock-sync-extension/background.js
          test -f dist/dhl-stock-sync-extension/catalog-mode.js
          test -f dist/dhl-stock-sync-extension/catalog-generic-mode.js
          test -f dist/dhl-stock-sync-extension/catalog-api-mode.js
          test -f dist/dhl-stock-sync-extension/catalog-api-v2-mode.js
          test -f dist/dhl-stock-sync-extension/catalog-popup-v3-mode.js
          test -f dist/dhl-stock-sync-extension/product-branch-mode.js
          test -f dist/dhl-stock-sync-extension/maintenance-ui.js
          test -f dist/dhl-stock-sync-extension/simple-mode.js
          test -f dist/dhl-stock-sync-extension/exact-name-mode.js
          test -f dist/dhl-stock-sync-extension/one-file-mode.js
          test -f dist/dhl-stock-sync-extension/saved-profiles-mode.js

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: dhl-stock-sync-extension
          path: tools/dhl-stock-sync-extension/dist/dhl-stock-sync-extension.zip
          retention-days: 14
